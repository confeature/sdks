      description: >
        Returns the email and full name of the currently authenticated
        user. ConfigCat parity (their `GET /v1/me` returns the same
        `MeModel` shape). Confeature additionally exposes a richer
        `/v1/auth/me` (returns the full `User` schema with creation
        timestamp + session metadata); both endpoints coexist — `/v1/me`
        is the canonical parity surface for ConfigCat-style clients,
        `/v1/auth/me` is the Confeature-internal richer view.
      tags: [Me]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeModel"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/organizations:
    get:
      operationId: organizationsList
      summary: List Organizations
      description: >
        Returns the list of Organizations the currently authenticated
        user has access to. ConfigCat parity (their `GET /v1/organizations`
        returns the same array shape). For a cookie session / cli-token this
        is EVERY organization the user is a member of (`orgs ⨝ org_members
        WHERE user_id = ?`): a user in one org gets a
        one-element array (the common case), a user in two gets both. A
        platform-admin management token (bypass) sees every organization.
        The zero-item case (an org-less user) is allowed but should not
        occur through normal flows.
      tags: [Organizations]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of Organizations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationModel"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/organizations/{organizationId}/members:
    get:
      operationId: organizationsMembersList
      summary: List Organization Members
      description: >
        Returns the admins, billing managers, and members of the
        specified Organization. ConfigCat parity (their V1 endpoint —
        their V2 adds pagination, deferred). Cross-organization access
        (the authenticated user is not a member of {organizationId})
        returns the generic 404 envelope — byte-identical to a request
        for a non-existent organizationId. NO 403 (existence-enumeration
        mitigation).
      tags: [Organizations]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of Organization Members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembersModel"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: >
            Organization not found OR the authenticated user is not a
            member. Generic envelope — no enumeration of which case
            triggered the 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/organizations/{organizationId}/invitations:
    get:
      operationId: listInvitations
      summary: List the invitations of an Organization.
      description: >
        Returns the invitations of the specified Organization as a bare
        array of InvitationModel objects (possibly empty). Cross-organization
        access (the authenticated user is not a member of {organizationId})
        returns the generic 404 envelope — byte-identical to a request for a
        non-existent organizationId. NO 403 (existence-enumeration
        mitigation). A management token may list any Organization's
        invitations.
      tags: [Invitations]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The list of the Organization's invitations (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationModel"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: >
            Organization not found OR the authenticated user is not a
            member. Generic envelope — no enumeration of which case
            triggered the 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/invitations/{invitationId}:
    get:
      operationId: getInvitation
      summary: Get the metadata of an Invitation.
      description: >
        Returns a single InvitationModel by its identifier. An invitation
        that does not exist OR that belongs to another Organization returns
        the generic 404 envelope — byte-identical for both cases (no
        existence enumeration). NO 403. A management token may read any
        invitation.
      tags: [Invitations]
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The requested invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationModel"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: >
            Invitation does not exist OR belongs to another Organization.
            Generic envelope — no enumeration of which case triggered the
            404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteInvitation
      summary: Revoke a pending Invitation.
      description: >
        Revoke a pending Invitation, removing it permanently. Only pending
        invitations can be revoked; a redeemed invitation, an invitation
        belonging to another Organization, and a non-existent invitationId
        all return the same generic 404 (anti-enumeration). After a
        successful revoke the invitation's token can no longer be redeemed.
      tags: [Invitations]
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: >
            The pending invitation was revoked. No content — a revoked
            invitation ceases to exist; there is no model to return.
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: >
            The invitation is not a pending invitation visible to the
            caller — it does not exist, has already been redeemed, or
            belongs to another Organization. Generic envelope,
            byte-identical for every case (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/products/{productId}/auditlogs:
    get:
      operationId: getProductAuditLogs
      summary: List a product's config-plane change history (newest-first).
      tags: [Audit logs]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
          description: Identifier of the Product (UUID).
        - in: query
          name: configId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: environmentId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: auditLogType
          required: false
          schema:
            $ref: "#/components/schemas/AuditLogType"
        - in: query
          name: fromUtcDateTime
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: toUtcDateTime
          required: false
          schema:
            type: string
            format: date-time
        # --- Confeature additive filters (no ConfigCat equivalent; parity-safe —
        #     a ConfigCat client simply omits them, absent = no filter). Serve
        #     "by actor" and per-flag history. ---
        - in: query
          name: actorId
          required: false
          schema:
            type: string
          description: Filter by acting principal id (user or management token). Confeature extension.
        - in: query
          name: settingKey
          required: false
          schema:
            type: string
          description: Filter by feature-flag key (per-flag history). Confeature extension.
      responses:
        "200":
          description: >
            The product's audit log entries, newest-first (bare array, no
            pagination — mirrors ConfigCat).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogItemModel"
        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token lacks the auditlog:read scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found (or cross-org — anti-enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── Release Guardian — management plane ONLY. Does NOT touch
  #    the SDK eval wire (config_v6 / ConfigV6). The inbound webhook is token-auth
  #    (the path token IS the auth); every other route is scope-guarded with a
  #    generic-404 cross-org gate (anti-enumeration). ───────────────────────────
  /v1/guardian/webhooks/{token}:
    post:
      operationId: receiveGuardianSignal
      summary: Inbound error-spike signal (token-auth; the customer's alert POSTs here).
      tags: [Guardian]
      # NO security — authenticity is the path token. Body is ignored for auth in v1.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Signal accepted (whether or not it correlated).
        "404":
          description: Unknown/disabled/malformed token (anti-enumeration).
        "429":
          description: Rate limited.
