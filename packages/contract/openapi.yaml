    put:
      operationId: replaceSettingValueV2
      summary: Replace a setting's value in one environment (v2)
      description: >
        Replaces the whole evaluation formula: a field that is not listed is
        reset. The value goes live in this environment with no publish call;
        the response is 200 only once it is in the environment's edge storage.
        A 503 means the value is saved but not live yet: retry the same request
        after Retry-After. A body without `targetingRules` deletes them.
        Targeting rules take user conditions with any of ConfigCat's 36
        comparators, and prerequisite flag conditions: `equals` or
        `doesNotEqual` on another setting of the same config, with a value of
        that setting's type. A write that would make the settings'
        prerequisites form a cycle in this environment is refused, and writes
        nothing. A rule serves a value or percentage options; the last
        rule may have no conditions and serve percentage options to all other
        users. `percentageEvaluationAttribute` names the user attribute
        percentage options bucket on (null is Identifier). Segment
        conditions take `isIn` or `isNotIn` on a segment of the setting's
        own product. A management token also needs config:publish. Aligned
        with ConfigCat's replace-setting-value-v2.
