      tags: [Segments]
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSegmentModel"
      responses:
        "200":
          description: The segment was updated and is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentModel"
        "400":
          description: >
            A field outside ConfigCat's bounds, a comparison value its comparator cannot read (the message names the field, never the value), or a segment used in more than 500 (config, environment) pairs. Nothing is written. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks segment:write, or it is a management token without config:publish. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Segment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 512 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteSegment
      summary: Delete a segment
      description: >
        Deletes a segment. A segment that targeting rules still reference is
        refused with a 400 naming its usage, and nothing is deleted. A
        management token also needs config:publish. Aligned with ConfigCat's
        delete-segment.
      tags: [Segments]
