  /v1/guardian/events/{eventId}/rollback:
    post:
      operationId: rollbackGuardianEvent
      summary: One-click rollback of the suspect flag-value change.
      description: >
        Restores the suspect flag's value in this environment, live when SDKs
        are still served the suspect change. A management token also needs
        config:publish.
      tags: [Guardian]
      security:
        - bearerAuth: []
        - basicAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Override the value-moved-on guard (roll back even if the flag's value changed since the suspect change).
                reason:
                  type: string
                  description: Mandatory note if the scope requires one.
      responses:
        "401":
          description: Missing or invalid credential.
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: >
            Rolled back — the suspect flag's draft value restored and the event
            marked rolled_back. The served value is restored (and re-published
            for this environment only) when SDKs are still served the suspect
            change; `servedValueChanged` reports whether it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianRollbackResult"
        "400":
          description: >
            A change note (reason) is required for this change. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks guardian:write, or it is a management token
            without config:publish.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The flag's value changed since the suspect (use force to override),
            or while the rollback was writing (nothing was rolled back; retry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianValueChanged"
        "422":
          description: >
            Rollback not available: the suspect is not a flag-value change, the
            same write also changed the flag's targeting rules (revert it
            through the v2 value API), or the value to restore is outside the
            setting's domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found / cross-org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  # CLI browser device-flow auth. Management-plane only —
  # NONE of these enter the SDK config_v6 wire / wire-cases corpus. The
  # device authorization grant (RFC 8628): authorize → (browser approve via a
  # cookie session) → token poll mints a long-lived, user-scoped, revocable
  # bearer (the `cli-token` source). Auth separation: the public
  # authorize / token endpoints never read account data and only yield a token
  # AFTER an authenticated cookie-session approval.
  /v1/cli/device/authorize:
    post:
      operationId: cliDeviceAuthorize
      summary: Start a CLI device-flow login (public; IP rate-limited).
      tags: [CLI Auth]
      # NO security — public. The minted device_code becomes the poll credential.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceAuthorizeRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Device + user codes and the verification URIs (RFC 8628).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceAuthorizeResponse"
        "429":
          description: Rate limited (per IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/device/token:
    post:
      operationId: cliDeviceToken
      summary: Poll for the CLI device-flow token (public; device_code rate-limited).
      tags: [CLI Auth]
      # NO security — the device_code IS the credential. A token is returned
      # ONLY when the matching request is approved; otherwise an RFC 8628 error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceTokenRequest"
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Approved — the minted token (returned ONCE) + identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceTokenSuccess"
        "400":
          description: >
            RFC 8628 poll state (authorization_pending / slow_down / expired_token / access_denied). Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceTokenError"
        "429":
          description: Rate limited (per device_code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/device/approve:
    post:
      operationId: cliDeviceApprove
      summary: Approve a pending CLI device code (cookie-session authed).
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceDecisionRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Approved — the waiting poll will mint a token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceDecisionResponse"
        "401":
          description: No valid web session (an anonymous visitor cannot approve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown / expired / already-acted code (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/device/deny:
    post:
      operationId: cliDeviceDeny
      summary: Deny a pending CLI device code (cookie-session authed).
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceDecisionRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Denied — the waiting poll will end cleanly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceDecisionResponse"
        "401":
          description: No valid web session (an anonymous visitor cannot deny).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown / expired / already-acted code (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/logout:
    post:
      operationId: cliLogout
      summary: Revoke the presenting CLI token (cli-token authed; idempotent).
      tags: [CLI Auth]
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Token revoked (idempotent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliLogoutResponse"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid CLI token presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/cli/tokens:
    get:
      operationId: listCliTokens
      summary: List the session user's own CLI logins (cookie-session authed).
      description: >
        Owner-scoped list of the signed-in user's `cli_token` rows for the
        dashboard revoke surface. NEVER returns the token hash or
        plaintext.
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session user's own CLI logins (no hash / plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliTokenList"
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/tokens/{id}:
    delete:
      operationId: revokeCliToken
      summary: Revoke the caller's own CLI login (cookie-session authed; idempotent).
      description: >
        Owner-scoped revoke for the dashboard. A token belonging to
        another user (or an unknown id) returns the SAME uniform 404 — no
        cross-user enumeration. Idempotent: a second revoke of the caller's own
        already-revoked token is a 204 no-op.
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "204":
          description: Token revoked (idempotent).
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id or another user's token (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/authorize/approve:
    post:
      operationId: mcpAuthorizeApprove
      summary: Approve a pending MCP client authorization (cookie-session authed).
      description: >
        Called by the dashboard MCP consent page when the signed-in user
        approves a remote MCP client's authorization request.
        Validates the session + the `state`'s `mcp:authreq` KV entry (must
        exist, match `client_id`), mints a bridged, org-scoped `mcp_token` for
        the session user's active org, writes a one-time `mcp:handoff:{code}`
        record (TTL 120 s, delete-on-read), and returns the MCP server's
        callback URL. The response NEVER carries the token plaintext — it travels only
        via delete-on-read KV.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAuthorizeApproveRequest"
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Approved — the callback URL the MCP server completes the grant with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAuthorizeRedirectResponse"
        "400":
          description: >
            Unknown / expired `state` or client mismatch. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid web session (an anonymous visitor cannot approve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/authorize/deny:
    post:
      operationId: mcpAuthorizeDeny
      summary: Deny a pending MCP client authorization (cookie-session authed).
      description: >
        Called by the dashboard MCP consent page when the signed-in user
        declines. Validates the session, deletes the
        `mcp:authreq:{state}` KV entry, and returns the MCP server's callback URL
        carrying `error=access_denied`. No token is minted.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAuthorizeDenyRequest"
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Denied — the callback URL carrying error=access_denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAuthorizeRedirectResponse"
        "400":
          description: >
            Unknown / expired `state`. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid web session (an anonymous visitor cannot deny).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/tokens:
    get:
      operationId: listMcpTokens
      summary: List the session user's own MCP connection credentials (cookie-session authed).
      description: >
        Owner-scoped list of the signed-in user's bridged `mcp_token` rows — the
        credentials backing their MCP connections. Each entry
        is a non-secret summary (which client, when created, when last used,
        whether revoked, when it expires). NEVER returns the token hash, the
        plaintext, or the grant id.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session user's own MCP credentials (no hash / plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenList"
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/tokens/{id}:
    delete:
      operationId: revokeMcpToken
      summary: Revoke the caller's own MCP credential (cookie-session authed; idempotent).
      description: >
        Owner-scoped revoke of a bridged `mcp_token`. Sets
        `revoked_at` so the credential is refused on its next management call,
        then — if the row's grant is linked — fires a best-effort internal hop to
        invalidate the OAuth grant in the MCP server (the grant-invalidate cascade;
        failure is tolerated, never blocks the revoke). A token belonging to
        another user (or an unknown id) returns the SAME uniform 404 — no
        cross-user enumeration. Idempotent: a second revoke of the caller's own
        already-revoked token is a 204 no-op.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "204":
          description: Credential revoked (idempotent).
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id or another user's credential (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/public-api-credentials:
    get:
      operationId: listPublicApiCredentials
      summary: List the session user's own Public API credentials (cookie-session authed).
      description: >
        Owner-scoped list of the signed-in user's Public API credentials, the
        username / password pairs accepted as HTTP Basic (`basicAuth`) on the
        management API. Newest first, revoked ones included. NEVER returns the
        password or its hash. ConfigCat manages these credentials on its
        dashboard only and has no API for them; this route follows
        Confeature's own `/v1/cli/tokens` pattern.
      tags: [Public API Credentials]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session user's own credentials (no password, no hash).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiCredentialList"
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPublicApiCredential
      summary: Create a Public API credential for the session user (cookie-session authed).
      description: >
        Mints a username / password pair bound to the signed-in user. The
        credential acts as its owner: org-scoped to the owner's current
        membership and role on every request, never more. The `password` is in
        this response ONLY (`Cache-Control: no-store`) and is stored hashed; it
        cannot be read again. Cookie-session only, so no credential can mint
        another. A user holds at most 10 live credentials: the 11th answers
        `409 credential_limit` until one is revoked. Credentials do not expire;
        revocation is the control.
      tags: [Public API Credentials]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicApiCredentialRequest"
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "201":
          description: Created. The only response that carries the password.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicApiCredentialCreated"
        "400":
          description: >
            The label is missing, empty or longer than 100 characters. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            `credential_limit` — the user already holds 10 live credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/public-api-credentials/{id}:
    delete:
      operationId: revokePublicApiCredential
      summary: Revoke the caller's own Public API credential (cookie-session authed; idempotent).
      description: >
        Owner-scoped revoke. The credential is refused with `401` on its next
        request. A credential belonging to another user (or an unknown id)
        returns the SAME uniform 404 — no cross-user enumeration. Idempotent: a
        second revoke of the caller's own already-revoked credential is a 204
        no-op.
      tags: [Public API Credentials]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "204":
          description: Credential revoked (idempotent).
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id or another user's credential (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        A user-bound Public API credential sent as HTTP Basic
        (`Authorization: Basic base64(username:password)`), the scheme
        ConfigCat's Public Management API accepts (it names it `Basic`; this
        contract keeps the `<kind>Auth` naming of its other schemes). The
        principal is the credential's owner, scoped to the owner's CURRENT org
        and role on every request, exactly as a dashboard session is: a
        demotion or a removal binds on the next request. It is never a platform
        operator, even when its owner is one: operator-only operations answer
        `403` to it and need the owner's session. Mint, list and revoke
        credentials on the dashboard's account security page
        (`/account/security`, the `Public API Credentials` operations). Every
        failure (wrong password, unknown username, revoked credential, removed
        owner, malformed header) is the same `401 invalid_credentials` with a
        `WWW-Authenticate: Basic` challenge; too many failures answer
        `429 too_many_attempts` (see `TooManyAttempts`).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Management API bearer token. Each token carries a list of
        scopes (e.g., `product:write`, `config:publish`, `tag:read`); the
        API enforces scope on every /v1/* route. The tag operations take
        `tag:read` for the reads and `tag:write` for create, update and
        delete.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-cfsession
      description: >
        Opaque session id (UUID v4). Issued by POST /v1/auth/login.
        The cookie is HttpOnly, Secure, SameSite=Lax, Path=/,
        Max-Age=604800. The api validates by point-reading the
        `sessions` table in D1; sign-out (POST /v1/auth/logout)
        deletes the session row globally.
  parameters:
    ConfigIfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string
      description: >
        The strong, quoted `ETag` of the config the SDK already holds,
        compared verbatim. A match answers `304 Not Modified`.
    ConfigSdkVersion:
      in: query
      name: sdk
      required: false
      schema:
        type: string
      description: >
        The SDK's name and version, as every ConfigCat-compatible SDK
        sends it. Informational: it feeds the server-side deprecation
        signal and never changes the response.
    ValueWriteReason:
      in: query
      name: reason
      required: false
      schema:
        type: string
        maxLength: 1000
      description: >
        The change note for the audit log. Required (400 reason_required)
        when the environment or its product requires a reason for changes.
    ValueWriteBypassApproval:
      in: query
      name: bypassApproval
      required: false
      schema:
        type: string
        enum: ["true", "false"]
      description: >
        Accepted for ConfigCat compatibility. Confeature has no approval
        flow, so it has no effect, and it never bypasses a required reason.
    ValueWriteLatestVersionId:
      in: query
      name: latestVersionId
      required: false
      schema:
        type: string
        format: uuid
      description: >
        The `lastVersionId` the client last read. When it no longer matches
        the stored value, the write is refused with 409 and nothing changes.
  responses:
    CrossOriginWrite:
      description: >
        `forbidden` (cross-origin request refused): the request carries a
        Confeature cookie and comes from neither the dashboard's own origin
        (`Sec-Fetch-Site: same-origin`) nor an allowlisted Origin. A request with
        an `Authorization` header, or with no Confeature cookie, is never refused
        this way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotJsonWrite:
      description: >
        `bad_request`: the request carries a Confeature cookie and its body is not
        JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyPasswordAttempts:
      description: >
        `too_many_attempts` — too many failed passwords, refused before
        verification, right password included. Each attempt is spent before the
        password is checked and given back when it was right. From one IP (a
        burst of 20, then one per 6 s) and on one address (a burst of 10, then
        one per minute), whatever the account's state, so a refusal reveals
        neither who has an account nor who signed in lately. A browser that
        signed in to the address with its password holds a `__Host-cfdevice`
        cookie (set on that 200, 30 days) and spends its own budget instead (a
        burst of 10, then one per minute). Signing in with Google and the
        password reset do not read this budget, and a confirmed reset clears the
        address's, browsers included. Wait `Retry-After` seconds. The body names
        no key.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PasswordCheckUnavailable:
      description: >
        `temporarily_unavailable` — the failed-password budget cannot answer,
        so the attempt is refused rather than left unbounded. Try again shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: >
        `too_many_attempts` — too many FAILED HTTP Basic attempts. From one IP
        (a burst of 20, then one per 6 s) a Basic request is refused before
        verification unless its username verified successfully in the last 30
        days; on one username (a burst of 10, then one per 30 s) only further
        failures are refused, so a working credential is never locked out. Wait
        `Retry-After` seconds. The body names no key.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConfigV6:
      description: Raw config_v6 JSON payload.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ConfigCacheControl"
        ETag:
          $ref: "#/components/headers/ConfigETag"
        Last-Modified:
          $ref: "#/components/headers/ConfigLastModified"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigV6"
    ConfigV6NotModified:
      description: >
        The config is unchanged since the `ETag` sent in `If-None-Match`.
        No body; the SDK keeps its cached config.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ConfigCacheControl"
        ETag:
          required: true
          description: >
            The config's current strong ETag — always present on a 304,
            which can only answer a matching `If-None-Match`.
          schema:
            type: string
        Last-Modified:
          $ref: "#/components/headers/ConfigLastModified"
    ConfigV6AccessDenied:
      description: >
        No config is served for this SDK key (ConfigCat's answer for an
        unknown key: `AccessDenied`). SDKs report it as an invalid SDK
        key. It does not mean the key was revoked.
      content:
        application/xml:
          schema:
            type: string
          example: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <Error><Code>AccessDenied</Code><Message>Access Denied</Message></Error>
    ValueWriteBadRequest:
      description: >
        Invalid request: a value that does not respect the setting's type or
        bounds, more than one value field, a predefined variation, a targeting
        rule that breaks a formula invariant or a limit of
        `featureFlagLimitations` (the message names the field, never the
        value), a comparison value of the wrong kind for its comparator, an
        empty list, a semantic version no SDK can parse, a number that is not
        finite, percentage options that break a rule of
        `percentageOptions` (integers 0 to 100 summing to 100, exactly two
        for a boolean setting), a prerequisite flag condition on the setting
        itself, on a setting that is not in this config (missing or another
        config's, one message), with a value of another type than its
        prerequisite's, or that would form a cycle of prerequisites, a
        segment condition on a segment that is not in this product (missing
        or another product's, one message), an invalid JSON Patch, a
        formula larger than 900000 bytes, a missing required reason,
        environment and setting in different products, or a config whose
        evaluationVersion is not v2.
        Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValueWriteConflict:
      description: >
        The stored value changed since `latestVersionId` (or since this
        request read it). Nothing was written; read the value again and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValueNotLive:
      description: >
        The value is saved but not live yet. Retry the same request after
        Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValueNotLive"
    RateLimited:
      description: >
        Too many management writes for this organization (#934). Each
        organization may make a burst of 200 writes, then one per second;
        every principal of the organization (session, management token, CLI
        or MCP token) spends the same budget. Nothing was written: retry after
        Retry-After seconds. Reads are not limited.
      headers:
        Retry-After:
          required: true
          description: Seconds until the organization's next write is admitted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
  headers:
    BasicChallenge:
      required: false
      description: >
        `Basic realm="Confeature Management API", charset="UTF-8"`. Sent on a
        401 ONLY when the request carried HTTP Basic (`basicAuth`): a challenge
        on every 401 would make a browser prompt on dashboard calls and cache an
        ambient credential.
      schema:
        type: string
    ConfigCacheControl:
      required: true
      description: >
        Always `max-age=0, must-revalidate`, as ConfigCat's CDN sends it:
        caches must revalidate before reuse, so a stale flag set is never
        served from a heuristic freshness window.
      schema:
        type: string
        const: max-age=0, must-revalidate
    ConfigETag:
      required: false
      description: >
        Strong, quoted, content-derived ETag. Present whenever the config
        was published with one; send it back as `If-None-Match`.
      schema:
        type: string
    ConfigLastModified:
      required: false
      description: >
        HTTP-date (IMF-fixdate) of the config's last write to the edge.
        Present whenever the publish recorded it.
      schema:
        type: string
  schemas:
    AuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_credentials"
            - "invalid_request"
            - "unauthorized"
            - "ambiguous_credential"
            - "bootstrap_consumed"
            - "bootstrap_unauthorized"
            - "bad_request"
        message:
          type: string
      description: >
        Auth-surface error envelope. On /v1/auth/login an unknown email and
        a wrong password return the same error, so the response never
        reveals whether an account exists. `bad_request`, with a `message`,
        is the same-origin guard's: the request carried a Confeature cookie
        and a body that is not JSON (#1166).
    PasswordResetAck:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Neutral, non-committal acknowledgement copy.
          example: If an account exists for that email, we've sent a reset link.
      description: >
        The single, constant 200 body returned by BOTH password-reset endpoints.
        The request endpoint returns it identically for a
        real account, an SSO-only account, an unknown email, or a rate-limited
        caller (no account enumeration); the confirm endpoint returns it on a
        successful password change. Carries no token, no session, and no field
        that discloses account existence.
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: integer
          description: Unix ms timestamp at user creation.
      description: >
        A human operator. Identified by email (lowercase canonical).
        Issued sessions live in the server-side `sessions` table; this
        shape is the wire representation returned by /v1/auth/login,
        /v1/auth/me, and /v1/auth/bootstrap.
    SessionProbe:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          description: Boolean session signal — true iff a valid cookie session is present.
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: The User record when authenticated, else null.
      description: >
        Result of the public session probe GET /v1/auth/session.
        Always returned with HTTP 200 so a probe on a public route never
        surfaces a console-visible 401.
    Session:
      type: object
      required: [id, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: integer
          description: Unix ms timestamp at session creation.
        expires_at:
          type: integer
          description: >
            Unix ms; refreshed on hot reads (sliding 7-day window,
            debounced to write only on ≥5-minute extends).
      description: >
        Server-side session record. Documented for completeness — the
        wire never carries a Session object directly; the cookie value
        IS the session id. Future endpoints ("list my sessions" / "sign
        out everywhere") will return this shape.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build identifier.
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: Build identifier (typically a git SHA in production, "dev" locally).
    ConfigV6:
      type: object
      description: >
        The ConfigCat config_v6 payload. The exact schema is governed by
        ConfigCat's specification; this contract treats it as an opaque
        object to preserve byte-for-byte forwarding from KV. SDKs are
        responsible for parsing per ConfigCat's documented format.
      additionalProperties: true
    ChangeNoteRequest:
      type: object
      properties:
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the product, or for an environment-scoped change the
            environment, requires a reason for changes.
      description: >
        Optional body of a write that otherwise takes none (publish, and the
        environment, config and setting deletes): it carries only the change
        note. A request with no body, or a body that is not JSON, carries no
        note.
    Error:
      type: object
      description: >
        Uniform error envelope returned by 4xx responses on /v1/* routes.
        `error` is a stable machine-readable token (e.g., `not_found`,
        `conflict`, `forbidden`, `unauthorized`); `message` is a
        human-readable explanation.
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
    InviteMembersRequest:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
            minLength: 5
            maxLength: 254
          description: >
            Non-empty array of invitee email addresses, capped at 20 per
            request. Each address is lower-cased server-side before
            storage and mints its own invitation row, its own one-time
            token, and its own 7-day expiry. The per-entry bounds match
            the address bounds Confeature applies elsewhere. The 20-item
            cap keeps the batch within D1's 100-statement `batch()` limit
            and SQLite's bound-variable ceiling, so an oversized batch
            fails fast with a clean 400.
        permissionGroupId:
          type: integer
          default: 0
          description: >
            Identifier of the permission group the invited members join.
            Confeature v1 has no permission-groups feature — the only
            accepted value is `0` (a placeholder, the same rule as
            `InvitationModel.permissionGroupId`); a non-zero value is
            rejected with 400. Omitting the field defaults it to `0`. A
            future release that introduces permission groups gives this
            field real values.
      description: >
        Request to invite one or more members in a single call — mirrors
        ConfigCat's `InviteMembersRequest`. Email uniqueness is checked
        best-effort against the existing `users` table: if ANY address
        already belongs to a registered user the whole batch is rejected
        with 409 and nothing is minted (the batch is all-or-nothing). The
        real safety net is the `UNIQUE(email)` constraint that fires at
        redemption time.
    InviteCreateResultEntry:
      type: object
      required: [email, invite_token, expires_at]
      properties:
        email:
          type: string
          format: email
          description: The invitee address this entry was minted for (lower-cased).
        invite_token:
          type: string
          pattern: "^confeature_invite_[A-Za-z0-9_-]{48}$"
          description: >
            Plaintext invite token, shape `confeature_invite_<48 url-safe
            chars>` (≈ 288 bits of entropy). Returned ONCE; never
            persisted server-side (only its SHA-256 digest is stored).
            The back-office UI constructs the full link
            (`<origin>/signup?invite=<token>`).
        expires_at:
          type: integer
          description: Unix epoch seconds at which this invitation expires (created_at + 7 days).
      description: >
        One element of the 201 response array of POST /v1/users/invite —
        the invitation minted for one email in the batch. The plaintext
        token is the only sensitive value on the wire; the back-office
        MUST hold it in a function-scoped variable and never log it.
    AcceptInviteRequest:
      type: object
      required: [invite_token, password]
      properties:
        invite_token:
          type: string
          pattern: "^confeature_invite_[A-Za-z0-9_-]{48}$"
          description: The plaintext token from the invite link's `?invite=` parameter.
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: >
            New user's password. Same minimum-strength rule as
            /v1/auth/bootstrap and /v1/auth/login. Hashed with
            argon2id server-side; never logged in plaintext.
      description: >
        Request body for POST /v1/auth/accept-invite. The token is
        observed on the wire exactly twice in its lifetime (here and in
        the matching 201 from /v1/users/invite); the password is
        observed once (here) and is hashed before persistence.
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: >
            The new account's password. Same rule as /v1/auth/login. Hashed
            with argon2id server-side; never logged in plaintext.
      description: Request body for POST /v1/auth/signup.
    SignupError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: ["signup_unavailable", "bad_request"]
        message:
          type: string
          description: One constant, user-facing message for every failure.
      description: >
        The one body every POST /v1/auth/signup failure answers, whatever
        its cause, but one: `bad_request` is the same-origin guard's, when the
        request carried a Confeature cookie and a body that is not JSON (#1166).
    SsoStartRequest:
      type: object
      properties:
        return_to:
          type: string
          description: >
            Optional path the back-office should land the operator on
            after a successful callback (e.g. `/products`). Bounded by
            the issuing back-office's own routing; the api treats it as
            opaque and round-trips it through KV state.
      description: >
        Request body for POST /v1/auth/sso/{provider}/start. All fields
        are optional in v0.1.
    SsoStartResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: >
            Fully-formed OIDC authorization URL with `state`, `nonce`,
            `code_challenge`, and `code_challenge_method=S256` baked in.
            The back-office opens this in the same tab (top-level
            navigation).
      description: >
        200 response of POST /v1/auth/sso/{provider}/start. The client
        navigates to `redirect_url`; the matching callback POSTs to
        `/v1/auth/sso/{provider}/callback` once the provider redirects
        back with `code` + `state` on the query string.
    SsoCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
          description: >
            Provider-issued authorization code (opaque). The back-office
            extracts it from the provider's redirect query string.
        state:
          type: string
          description: >
            The state value the provider echoed back. Must match the KV
            state entry minted by `ssoStart`; mismatched / missing /
            already-consumed state returns the generic 400 envelope.
      description: >
        Request body for POST /v1/auth/sso/{provider}/callback. Posted
        by the back-office after extracting `code` and `state` from the
        provider's redirect.
    SsoError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_sso_state"
            - "sso_provider_unavailable"
            - "bad_request"
            - "forbidden"
          description: >
            Failure-class signal. `bad_request` (a 400) and `forbidden` (a 403)
            are the same-origin guard's, when the request carried a Confeature
            cookie with a body that is not JSON, or from another origin (#1166). `invalid_sso_state` accompanies a 400
            (state missing / consumed / malformed / tampered, userinfo
            missing email, malformed body — all five branches share
            this code). `sso_provider_unavailable`
            accompanies a 502 (token endpoint or userinfo endpoint
            returned an error or was unreachable — both branches share
            this code). The user-facing `message`
            is identical between the two; the HTTP status is the
            broad-class signal.
        message:
          type: string
          description: >
            Human-readable explanation suitable for display in the
            back-office. Identical across all branches within a status
            class — no information leakage about which specific failure
            fired.
      description: >
        Uniform error envelope for `/v1/auth/sso/*` failures. Used by
        the 400-class and 502-class responses of `ssoCallback` and by
        the 404 of `ssoStart`. Errors are deliberately generic so a
        response never reveals which specific check failed.
    SsoProviderListItem:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: >
            Operator-chosen provider id — the same slug that appears in
            `/v1/auth/sso/{provider}/start` and `/callback` route
            placeholders. Public by construction; appears in the
            authorization-URL query string anyway.
        label:
          type: string
          description: >
            Human-readable button text rendered by the back-office sign-
            in page ("Sign in with <label>"). Defaults to `id` when the
            operator omits the `label` field in CONFEATURE_SSO_PROVIDERS.
      description: >
        Public-safe shape of a single registered SSO provider as exposed
        by `listSsoProviders`. NEVER carries any secret-bearing field.
    SsoProviderListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SsoProviderListItem"
          description: >
            Every registered provider in `CONFEATURE_SSO_PROVIDERS`
            order. Empty list when no providers are configured (the
            back-office sign-in page hides the SSO block silently in
            that case).
      description: >
        200 response of GET /v1/auth/sso/providers. The back-office
        renders one "Sign in with <label>" button per item above the
        existing email+password form. The built-in
        consumer `google` provider (id `google`, label `Google`) appears
        here automatically when `GOOGLE_CLIENT_ID` + `GOOGLE_CLIENT_SECRET`
        are configured.
    ConnectedMethods:
      type: object
      required: [password, google]
      properties:
        password:
          type: boolean
          description: True when the account has an email+password credential set.
        google:
          type: boolean
          description: True when a Google identity is linked to the account.
      description: >
        Sign-in methods connected to the authenticated account, derived
        read-only from the `users` row. No new
        storage — `password` is `password_hash IS NOT NULL`, `google` is
        `sso_provider_id = 'google' AND sso_subject IS NOT NULL`.
    MeWithMethods:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            methods:
              $ref: "#/components/schemas/ConnectedMethods"
      description: >
        200 response of GET /v1/auth/me. The base `User` shape plus an
        additive, optional `methods` object (present for cookie sessions;
        omitted for management-token principals, which have no connected-
        method concept). Backward-compatible with the prior plain `User`
        response.
    LinkRequiredResponse:
      type: object
      required: [status, challenge_id, email]
      properties:
        status:
          type: string
          enum: ["link_required"]
          description: Discriminator for the link-required branch of the callback.
        challenge_id:
          type: string
          description: >
            Single-use link-challenge id (~10 min TTL, stored in KV). The
            back-office prompts for the existing password and POSTs it
            with this id to /v1/auth/link/google, or POSTs the id alone to
            /v1/auth/link/google/email to have a link mailed. Carries no
            session authority on its own and never contains a token or
            password.
        email:
          type: string
          format: email
          description: The verified Google email matching the existing password account.
      description: >
        Returned by /v1/auth/sso/google/callback when the verified Google
        email matches an existing PASSWORD account not yet linked to
        Google. NO session cookie is set and NO
        mutation occurs; the user must confirm ownership with their
        password via /v1/auth/link/google.
    SsoCallbackResult:
      oneOf:
        - $ref: "#/components/schemas/User"
        - $ref: "#/components/schemas/LinkRequiredResponse"
        - $ref: "#/components/schemas/LinkedResponse"
      description: >
        Discriminated 200 result of /v1/auth/sso/{provider}/callback. A
        plain `User` (with a session cookie) for the signed-in branches;
        a `LinkRequiredResponse` (no cookie) for the consumer-google
        password-account-not-yet-linked branch; a `LinkedResponse`
        (`status: "linked"`, session unchanged) when the state carried a
        `link_user_id` and the authenticated user connected Google from the
        account page.
    LinkGoogleStartRequest:
      type: object
      properties:
        return_to:
          type: string
          description: >
            Optional path the back-office should land the operator on after
            a successful account-link callback. Defaults to
            `/account/security`. The api treats it as opaque and round-trips
            it through KV state (never forwarded to Google).
      description: >
        Request body for POST /v1/auth/link/google/start. All fields are
        optional.
    LinkedResponse:
      type: object
      required: [status, return_to, methods]
      properties:
        status:
          type: string
          enum: ["linked"]
          description: >
            Discriminator for the account-link branch of the callback. The
            authenticated user just connected Google from the account page;
            the session is unchanged (no new cookie). The client routes to
            `return_to` and toasts "Google connected".
        return_to:
          type: string
          description: >
            The path the back-office should navigate to (the `return_to`
            supplied to /v1/auth/link/google/start, default
            `/account/security`).
        methods:
          $ref: "#/components/schemas/ConnectedMethods"
      description: >
        Returned by /v1/auth/sso/google/callback when the KV state record
        carried a `link_user_id` (minted by /v1/auth/link/google/start) and
        the verified Google identity was successfully attached to the
        authenticated account. NO session cookie is set —
        the user stays logged in as themselves; `methods.google` is now
        `true`.
    LinkAccountError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "email_mismatch"
            - "identity_conflict"
          description: >
            Failure-class signal for the account-link callback branch (409).
            `email_mismatch` — the verified Google email does not equal the
            authenticated account's email; `identity_conflict` — the Google
            `sub` is already linked to a different account, or the account is
            already linked to a different Google identity. Nothing is changed.
        message:
          type: string
          description: >
            Human-readable explanation. For `email_mismatch` it names the
            account's own email ("Connect the Google account for
            <your account email>.") and never references any other account.
      description: Uniform 409 error envelope for the account-link callback branch.
    LinkGoogleRequest:
      type: object
      required: [challenge_id, password]
      properties:
        challenge_id:
          type: string
          description: The single-use link-challenge id from the callback's link_required branch.
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: >
            The existing account's password. Verified with argon2id
            (timing-equalised on a wrong/unknown password); never logged.
      description: Request body for POST /v1/auth/link/google.
    LinkGoogleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_credentials"
            - "invalid_link_challenge"
            - "identity_conflict"
          description: >
            Failure-class signal. `invalid_credentials` (401) — wrong
            password; `invalid_link_challenge` (410) — challenge missing /
            expired / already used / out of attempts; `identity_conflict`
            (409) — the account holds another identity, or the Google `sub` is
            already linked to another account.
        message:
          type: string
      description: Uniform error envelope for POST /v1/auth/link/google failures.
    LinkGoogleEmailRequest:
      type: object
      required: [challenge_id]
      properties:
        challenge_id:
          type: string
          minLength: 1
          maxLength: 256
          description: The challenge from the callback's `link_required` branch.
      description: Request body for POST /v1/auth/link/google/email.
    LinkGoogleEmailAck:
      type: object
      required: [message]
      properties:
        message:
          type: string
      description: 200 response of POST /v1/auth/link/google/email.
    LinkGoogleEmailError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_link_challenge"
            - "too_many_attempts"
            - "email_unavailable"
        message:
          type: string
      description: Error envelope for POST /v1/auth/link/google/email.
    LinkGoogleEmailPending:
      type: object
      required: [status, email]
      properties:
        status:
          type: string
          enum: ["google_required"]
        email:
          type: string
          format: email
          description: The account the link is for, to show before the Google sign-in.
      description: 202 response of POST /v1/auth/link/google/email/confirm.
    LinkGoogleEmailConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
          description: The single-use token from the emailed link. Never logged.
      description: Request body for POST /v1/auth/link/google/email/confirm.
    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: >
            New password (same minimum-strength rule as signup). Hashed
            with argon2id server-side; never logged in plaintext.
      description: Request body for POST /v1/auth/set-password.
    SetPasswordResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
          description: True when the password was set.
      description: 200 response of POST /v1/auth/set-password.
    SetPasswordError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ["password_already_set"]
          description: The account already has a password set — no overwrite (409).
        message:
          type: string
      description: 409 error envelope for POST /v1/auth/set-password.
    UnlinkGoogleResponse:
      type: object
      required: [methods]
      properties:
        methods:
          $ref: "#/components/schemas/ConnectedMethods"
      description: >
        200 response of POST /v1/auth/unlink/google. The
        post-mutation connected methods so the client can reflect the
        disconnected state without re-fetching GET /v1/auth/me. After a
        successful unlink `methods.google` is always `false`.
    UnlinkGoogleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ["last_sign_in_method"]
          description: >
            Google is the account's only sign-in method (no password set) —
            unlinking would lock the account out (409). Nothing is changed.
        message:
          type: string
      description: 409 error envelope for POST /v1/auth/unlink/google.
    ScopeSchema:
      type: string
      pattern: "^(?:\\*|[a-z][a-z-]*:(?:\\*|[a-z][a-z-]+))$"
      description: >
        Either `*` (super-admin), or `<resource>:<action>` where action
        is `*` or a lowercase verb (e.g., `product:write`,
        `config:publish`).
    CreateTokenRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScopeSchema"
        expires_at:
          type: integer
          minimum: 1
          description: Unix epoch ms after which the token is no longer valid.
    TokenSummary:
      type: object
      required:
        - id
        - name
        - scopes
        - expires_at
        - created_at
        - created_by_token_id
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeSchema"
        expires_at:
          type: number
          nullable: true
        created_at:
          type: number
        created_by_token_id:
          type: string
          nullable: true
        revoked_at:
          type: number
          nullable: true
    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/TokenSummary"
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: Plaintext token — shown only once at creation.
    TokenList:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenSummary"
    ProductModel:
      type: object
      description: >
        Details of the Product. Schema aligned 1:1 with ConfigCat's
        `ProductModel` (configcat-publicapi-node-client/model/product-model.ts).
      required:
        - organization
        - productId
        - name
        - description
        - order
        - reasonRequired
        - approveRequired
      properties:
        organization:
          $ref: "#/components/schemas/OrganizationModel"
        productId:
          type: string
          format: uuid
          description: Identifier of the Product.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of the Product.
        description:
          type: string
          nullable: true
          description: Description of the Product.
        order:
          type: integer
          description: >
            The order of the Product represented on the dashboard. Determined
            from an ascending sequence of integers.
        reasonRequired:
          type: boolean
          description: >
            Determines whether a mandatory reason must be given every time the
            Feature Flags or Settings within a Product are saved. Set with
            PATCH /v1/products/{productId} (a Confeature addition; ConfigCat
            sets it through POST /v1/products/{productId}/preferences).
        approveRequired:
          type: boolean
          description: >
            Whether changes need an approval. Always false: Confeature has no
            approval flow. Carried for wire parity with ConfigCat.
    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The name of the Product.
        description:
          type: string
          nullable: true
          description: The description of the Product.
        order:
          type: integer
          nullable: true
          description: >
            The order of the Product represented on the dashboard. When
            omitted, the next integer in the organization's sequence is
            assigned.
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
          description: The name of the Product.
        description:
          type: string
          nullable: true
          description: The description of the Product.
        order:
          type: integer
          nullable: true
          description: The order of the Product represented on the dashboard.
        reasonRequired:
          type: boolean
          description: >
            Determines whether a mandatory reason must be given every time the
            Feature Flags or Settings within the Product are saved. A
            Confeature addition: ConfigCat sets this flag through
            POST /v1/products/{productId}/preferences (reasonRequired), not
            on the product update body.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the product requires a reason for changes. A Confeature
            addition: a ConfigCat client omits it.
    EvaluationVersion:
      type: string
      description: >
        The evaluation version of a Config. Aligned 1:1 with ConfigCat's
        `EvaluationVersion` (configcat-publicapi-node-client/model/
        evaluation-version.ts). Confeature only ever produces `v2`; `v1` is
        carried for wire parity.
      enum:
        - v1
        - v2
    ConfigModel:
      type: object
      description: >
        Details of the Config. Schema aligned 1:1 with ConfigCat's
        `ConfigModel` (configcat-publicapi-node-client/model/config-model.ts).
      required:
        - product
        - configId
        - name
        - description
        - order
        - migratedConfigId
        - evaluationVersion
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        configId:
          type: string
          format: uuid
          description: Identifier of the Config.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of the Config.
        description:
          type: string
          nullable: true
          description: Description of the Config.
        order:
          type: integer
          description: >
            The order of the Config represented on the dashboard. Determined
            from an ascending sequence of integers.
        migratedConfigId:
          type: string
          format: uuid
          nullable: true
          description: >
            Identifier of the Config the current Config was migrated from.
            Always null in Confeature v1 — carried for wire parity.
        evaluationVersion:
          $ref: "#/components/schemas/EvaluationVersion"
    CreateConfigRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The name of the Config.
        description:
          type: string
          nullable: true
          description: The description of the Config.
        order:
          type: integer
          nullable: true
          description: >
            The order of the Config represented on the dashboard. When
            omitted, the next integer in the product's sequence is assigned.
        evaluationVersion:
          allOf:
            - $ref: "#/components/schemas/EvaluationVersion"
          description: >
            The evaluation version of the Config. When omitted, defaults to
            `v2`.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the product requires a reason for changes. A Confeature
            addition: a ConfigCat client omits it.
    UpdateConfigRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
          description: The name of the Config.
        description:
          type: string
          nullable: true
          description: The description of the Config.
        order:
          type: integer
          nullable: true
          description: The order of the Config represented on the dashboard.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the product requires a reason for changes. A Confeature
            addition: a ConfigCat client omits it.
    SettingKey:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,255}$"
      description: Stable lookup key for a setting inside a config.
    SettingType:
      type: string
      enum: [boolean, string, int, double]
      description: >
        The type of a Feature Flag or Setting. Aligned 1:1 with ConfigCat's
        `SettingType` enum (configcat-publicapi-node-client/model/setting-type.ts)
        — exactly the four members `boolean`, `string`, `int`, `double`, in that
        order, serialised as a lowercase string.
    CreateSettingRequest:
      type: object
      description: >
        ConfigCat's `CreateSettingInitialValues` (#938): `key`, `name`,
        `settingType` and an optional `hint` and `initialValues`. `settingType`
        is the canonical field; `type` is its alias, kept for clients written
        before it. One of the two is required, and a body with both must give
        the same type. An environment not named in `initialValues` is seeded
        with the type's zero value (`boolean → false`, `string → ""`,
        `int → 0`, `double → 0`). `tags` assigns tags to the new setting
        (#1009). `predefinedVariations` gives the new setting its predefined
        variations, written with the setting or not at all. `order`, `isJson`
        and `settingIdToInitFrom` are ConfigCat fields Confeature does not
        support yet: each is accepted when empty or null and refused with a
        400 naming its ticket otherwise.
      required:
        - key
        - name
      properties:
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable display label (ConfigCat SettingModel.name).
        hint:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional operator-facing hint (ConfigCat SettingModel.hint).
        settingType:
          $ref: "#/components/schemas/SettingType"
        type:
          $ref: "#/components/schemas/SettingType"
        initialValues:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/InitialValue"
          description: >
            The setting's value in each environment named, one entry per
            environment. Written with the setting, or not at all.
        tags:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: >
            The IDs of the tags attached to the setting (ConfigCat's
            `CreateSettingInitialValues.tags`). Absent, null or empty assigns
            none; a repeated id counts once. Each tag must belong to the
            config's product. The assignments are written with the setting, or
            not at all. Confeature divergences, enforced by the api rather
            than stated as schema bounds: at most 100 distinct tags per
            setting, and every refusal (a tag of another product or org, an id
            that does not exist or is out of range, more than 100 distinct
            ids) answers the same fixed 400 body, which names no id, so a
            foreign tag is indistinguishable from a missing one.
        predefinedVariations:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CreatePredefinedVariationModel"
          description: >
            The new setting's predefined variations, in order, held to the
            rules of `updatePredefinedVariations`: values that match
            `settingType` and are distinct, at most 100 variations, the whole
            list at most 900,000 bytes of UTF-8 JSON (400), and a body of at
            most 1 MiB (413). Confeature divergences, the same for every plan;
            this never answers 402. Null or absent creates none.
        order:
          type: integer
          format: int32
          nullable: true
          description: >
            Not supported yet (#818): settings are ordered by creation.
            Accepted only when null.
        isJson:
          type: boolean
          nullable: true
          description: Not supported yet (#818); accepted only when false or null.
        settingIdToInitFrom:
          type: integer
          format: int32
          nullable: true
          description: Not supported yet (#818); send `initialValues`. Accepted only when null.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the product requires a reason for changes. A Confeature
            addition: a ConfigCat client omits it.
    InitialValue:
      type: object
      description: >
        ConfigCat's `InitialValue` (#938): a new setting's value in one
        environment of the config's product. `value` must fit the setting
        type. Unlike ConfigCat's schema, `environmentId` is required: a value
        with no environment names nowhere to write it.
      required:
        - environmentId
        - value
      properties:
        environmentId:
          type: string
          format: uuid
        value:
          oneOf:
            - type: boolean
            - type: string
            - type: number
              format: double
    UpdateSettingRequest:
      type: object
      description: >
        Partial update of a Setting's mutable METADATA only. Every field is
        optional and only the fields present in the body are written (mirrors
        `UpdateConfigRequest`). `name`/`hint`/`tags` map 1:1 to ConfigCat's
        `SettingModel.name`/`SettingModel.hint`/`SettingModel.tags`. The setting's `key`
        and `type` are IMMUTABLE — they are NOT on this body; its per-environment
        VALUE is edited via the per-environment value endpoint, not here.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable display label (ConfigCat SettingModel.name).
        hint:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional operator-facing hint (ConfigCat SettingModel.hint).
        tags:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: >
            The IDs of the tags the setting carries after the update: the full
            new set, replacing the current one. Absent or null leaves the tags
            unchanged; an empty list removes them all; a repeated id counts
            once. A Confeature divergence: ConfigCat edits `tags` through the
            JSON Patch body of update-setting, which Confeature does not
            accept yet (#892); a full set is its one-call equivalent. As on
            create, each tag must belong to the setting's product, at most 100
            distinct tags are allowed, and every refusal answers the same
            fixed 400 body, which names no id.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the product requires a reason for changes. A Confeature
            addition: a ConfigCat client omits it.
    SettingModel:
      type: object
      description: >
        A Feature Flag or Setting, as the config's settings list and the
        per-key routes (get one, create, update) answer it (#937). Aligned 1:1
        with ConfigCat's `SettingModel` (get-settings). It carries no value: a
        value is per-environment (`SettingFormulaModel`). `tags` lists the
        tags assigned to the setting, by assignment order (#1009).
        `predefinedVariations` lists the setting's predefined variations, in
        their order.
      required:
        - settingId
        - key
        - name
        - hint
        - order
        - settingType
        - isJson
        - configId
        - configName
        - createdAt
        - tags
        - predefinedVariations
      properties:
        settingId:
          type: integer
          format: int32
          description: Identifier of the Feature Flag or Setting.
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
          description: Name of the Feature Flag or Setting.
        hint:
          type: string
          nullable: true
          description: Description of the Feature Flag or Setting.
        order:
          type: integer
          format: int32
          description: >
            The order of the setting in its config, from 0, by creation.
        settingType:
          $ref: "#/components/schemas/SettingType"
        isJson:
          type: boolean
          description: Always false in Confeature.
        configId:
          type: string
          format: uuid
        configName:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          description: The tags attached to the Feature Flag or Setting.
          items:
            $ref: "#/components/schemas/TagModel"
        predefinedVariations:
          type: array
          description: The Feature Flag or Setting's Variations, in their order.
          items:
            $ref: "#/components/schemas/PredefinedVariationModel"
    DeletedSettingModel:
      type: object
      description: >
        A Feature Flag or Setting deleted from its config, as the
        deleted-settings list answers it. Aligned 1:1 with
        ConfigCat's `DeletedSettingModel` (get-deleted-settings): exactly its
        four fields, all required. Closed (`additionalProperties: false`),
        which ConfigCat's document does not state: Confeature answers no
        other field, so a ConfigCat client reads the same body.
      additionalProperties: false
      required:
        - key
        - name
        - hint
        - settingType
      properties:
        key:
          type: string
          description: Key of the Feature Flag or Setting.
        name:
          type: string
          description: Name of the Feature Flag or Setting.
        hint:
          type: string
          nullable: true
          description: Description of the Feature Flag or Setting.
        settingType:
          $ref: "#/components/schemas/SettingType"
    CodeReferenceRequest:
      type: object
      description: >
        One code-reference report, as the scanner uploads it. Aligned 1:1 with
        ConfigCat's `CodeReferenceRequest`: its eight fields, its required
        list and its lengths (counted in UTF-16 code units, as ConfigCat's).
        Open: unknown properties are ignored. Divergences, each stated on its
        field: `activeBranches` and `flagReferences` admit null (read as
        absent, which is what ConfigCat's scanner sends instead), the counts
        Confeature bounds, and the `http:` / `https:` rule on `commitUrl`.
      required:
        - configId
        - repository
        - branch
      properties:
        configId:
          type: string
          format: uuid
          description: The Config's identifier the scanning was performed against.
        repository:
          type: string
          minLength: 1
          maxLength: 255
          description: The source control repository that contains the scanned code.
        branch:
          type: string
          minLength: 1
          maxLength: 255
          description: The source control branch on where the scan was performed.
        commitUrl:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: >
            The related commit's URL. When not empty, it must be an absolute
            URL whose scheme is `http:` or `https:` (a dashboard renders it as
            a link); ConfigCat documents no such rule.
        commitHash:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: The related commit's hash.
        uploader:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: The scanning tool's name.
        activeBranches:
          type: array
          nullable: true
          maxItems: 5000
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: >
            The currently active branches of the repository. Each previously
            uploaded report of this config and repository whose branch is not
            in the list is deleted, never the uploaded branch's. Absent or
            null: nothing is pruned. At most 5,000 entries of 1 to 255
            characters, and at most 1 MiB serialised as UTF-8 JSON; ConfigCat
            documents no bound.
        flagReferences:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FlagReference"
          description: >
            The actual code reference collection. At most 10,000 references
            in total across all entries; ConfigCat documents no bound. A
            `settingId` may appear more than once; each entry is stored in
            array order.
    FlagReference:
      type: object
      description: >
        The references to one Feature Flag or Setting. Aligned 1:1 with
        ConfigCat's `FlagReference`.
      required:
        - settingId
        - references
      properties:
        settingId:
          type: integer
          format: int32
          description: >
            The identifier of the Feature Flag or Setting the code reference
            belongs to.
        references:
          type: array
          maxItems: 150
          items:
            $ref: "#/components/schemas/ReferenceLinesRequest"
          description: >
            The actual references to the given Feature Flag or Setting. At
            most 150, the most ConfigCat's scanner uploads per flag, counted
            across every entry for the same setting; ConfigCat documents no
            bound.
    ReferenceLinesRequest:
      type: object
      description: >
        One reference: the file, the line and the lines around it. Aligned
        1:1 with ConfigCat's `ReferenceLinesRequest`.
      required:
        - file
        - referenceLine
      properties:
        file:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's name in where the code reference has been found.
        fileUrl:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: >
            The file's url. When not empty, it must be an absolute URL whose
            scheme is `http:` or `https:` (a dashboard renders it as a link);
            ConfigCat documents no such rule.
        preLines:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ReferenceLineRequest"
          description: >
            The lines before the actual reference line. At most 10, the most
            ConfigCat's scanner sends (`--line-count`); ConfigCat documents no
            bound.
        postLines:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ReferenceLineRequest"
          description: >
            The lines after the actual reference line. At most 10, the most
            ConfigCat's scanner sends (`--line-count`); ConfigCat documents no
            bound.
        referenceLine:
          $ref: "#/components/schemas/ReferenceLineRequest"
    ReferenceLineRequest:
      type: object
      description: >
        Determines a code reference line. Aligned 1:1 with ConfigCat's
        `ReferenceLineRequest`.
      required:
        - lineNumber
      properties:
        lineNumber:
          type: integer
          format: int32
          description: The line number.
        lineText:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: The content of the reference line.
    DeleteRepositoryReportsRequest:
      type: object
      description: >
        Which code-reference reports to delete. Aligned 1:1 with ConfigCat's
        `DeleteRepositoryReportsRequest`.
      required:
        - configId
        - repository
      properties:
        configId:
          type: string
          format: uuid
          description: The Config's identifier from where the reports should be deleted.
        repository:
          type: string
          minLength: 1
          maxLength: 255
          description: The source control repository which's reports should be deleted.
        branch:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: >
            If it's set, only this branch's reports belonging to the given
            repository will be deleted.
        settingId:
          type: integer
          format: int32
          nullable: true
          description: >
            If it's set, only this setting's references in the matching
            reports are deleted; the reports stay.
    CodeReferenceModel:
      type: object
      description: >
        One code-reference report, with the references to one Feature Flag or
        Setting. Aligned 1:1 with ConfigCat's `CodeReferenceModel`: its eight
        fields, all required, with ConfigCat's nullability. Confeature answers
        null only for `commitUrl`, `commitHash` and `uploader` when the upload
        left them out, and `[]` for no references.
      required:
        - codeReferenceId
        - repository
        - branch
        - commitUrl
        - commitHash
        - uploader
        - syncedAt
        - references
      properties:
        codeReferenceId:
          type: string
          format: uuid
          description: The identifier of the reference report.
        repository:
          type: string
          nullable: true
          description: The source control repository that contains the scanned code.
        branch:
          type: string
          nullable: true
          description: The source control branch on where the scan was performed.
        commitUrl:
          type: string
          nullable: true
          description: The related commit's URL.
        commitHash:
          type: string
          nullable: true
          description: The related commit's hash.
        uploader:
          type: string
          nullable: true
          description: The code reference scanning tool's name.
        syncedAt:
          type: string
          format: date-time
          description: The date and time when the reference report was uploaded (UTC).
        references:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReferenceLinesModel"
          description: The actual references to the given Feature Flag or Setting, in upload order.
    ReferenceLinesModel:
      type: object
      description: >
        One stored reference. Aligned 1:1 with ConfigCat's
        `ReferenceLinesModel`: its five fields, all required. `preLines` and
        `postLines` are `[]` when the upload sent none.
      required:
        - file
        - fileUrl
        - preLines
        - postLines
        - referenceLine
      properties:
        file:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's name in where the code reference has been found.
        fileUrl:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: The file's url.
        preLines:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceLineModel"
          description: The lines before the actual reference line.
        postLines:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceLineModel"
          description: The lines after the actual reference line.
        referenceLine:
          $ref: "#/components/schemas/ReferenceLineModel"
    ReferenceLineModel:
      type: object
      description: >
        Determines a code reference line. Aligned 1:1 with ConfigCat's
        `ReferenceLineModel`.
      required:
        - lineNumber
        - lineText
      properties:
        lineNumber:
          type: integer
          format: int32
          description: The line number.
        lineText:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: The content of the reference line.
    SettingDataV2Model:
      type: object
      description: >
        The setting a v2 value belongs to. Aligned 1:1 with ConfigCat's
        `SettingDataV2Model`. The creator fields are always null: Confeature
        does not return member identities through this model.
      required:
        - settingId
        - key
        - name
        - hint
        - settingType
        - isJson
        - order
        - createdAt
        - creatorEmail
        - creatorFullName
        - predefinedVariations
        - isWatching
      properties:
        settingId:
          type: integer
          format: int32
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
        hint:
          type: string
          nullable: true
        settingType:
          $ref: "#/components/schemas/SettingType"
        isJson:
          type: boolean
        order:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        creatorFullName:
          type: string
          nullable: true
        predefinedVariations:
          type: array
          description: >
            A collection of Variations for a Feature Flag or Setting, in their
            order.
          items:
            $ref: "#/components/schemas/PredefinedVariationModel"
        isWatching:
          type: boolean
    PredefinedVariationModel:
      type: object
      description: >
        A Predefined Variation, as ConfigCat's `PredefinedVariationModel`.
      required:
        - value
        - name
        - hint
        - predefinedVariationId
      properties:
        value:
          $ref: "#/components/schemas/PredefinedVariationValueModel"
        name:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: >
            The name of the Predefined Variation, shown on the Dashboard UI. If
            not set, the Value will be shown.
        hint:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: >
            The hint of the Predefined Variation: a longer description of what
            it serves, shown on the Dashboard UI.
        predefinedVariationId:
          type: string
          format: uuid
          description: The Predefined Variation's identifier.
    PredefinedVariationValueModel:
      type: object
      description: >
        Represents the value of a Predefined Variation: exactly the field that
        matches the setting's type is non-null.
      required:
        - boolValue
        - stringValue
        - intValue
        - doubleValue
      properties:
        boolValue:
          type: boolean
          nullable: true
          description: The served value in case of a boolean Feature Flag.
        stringValue:
          type: string
          nullable: true
          description: The served value in case of a text Setting.
        intValue:
          type: integer
          format: int32
          nullable: true
          description: The served value in case of a whole number Setting.
        doubleValue:
          type: number
          format: double
          nullable: true
          description: The served value in case of a decimal number Setting.
    UpdatePredefinedVariationsRequest:
      type: object
      description: >
        The body of an update of a setting's predefined variations, as
        ConfigCat's `UpdatePredefinedVariationsRequest`, plus Confeature's
        optional `reason`.
      required:
        - predefinedVariations
      properties:
        predefinedVariations:
          type: array
          description: >
            A collection of Predefined Variations: the whole list, in order.
          items:
            $ref: "#/components/schemas/UpdatePredefinedVariationModel"
        reason:
          type: string
          nullable: true
          writeOnly: true
          maxLength: 1000
          description: >
            The change note for the audit log, at most 1000 characters as for
            every bounded reason. Required (400 reason_required) when the
            product requires a reason for changes. A Confeature addition: a
            ConfigCat client omits it.
    UpdatePredefinedVariationModel:
      type: object
      description: >
        A Predefined Variation to keep or add, as ConfigCat's
        `UpdatePredefinedVariationModel`.
      required:
        - value
      properties:
        value:
          $ref: "#/components/schemas/UpdatePredefinedVariationValueModel"
        name:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: >
            The name of the Predefined Variation, shown on the Dashboard UI. If
            not set, the Value will be shown.
        hint:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: >
            The hint of the Predefined Variation: a longer description of what
            it serves, shown on the Dashboard UI.
        predefinedVariationId:
          type: string
          format: uuid
          nullable: true
          description: >
            The Predefined Variation's identifier to update. Omit the value if
            you want to add a new predefined variation.
    UpdatePredefinedVariationValueModel:
      type: object
      description: >
        Represents the value of a Predefined Variation: exactly one field, the
        one matching the setting's type, is non-null.
      properties:
        boolValue:
          type: boolean
          nullable: true
          description: The served value in case of a boolean Feature Flag.
        stringValue:
          type: string
          nullable: true
          description: The served value in case of a text Setting.
        intValue:
          type: integer
          format: int32
          nullable: true
          description: The served value in case of a whole number Setting.
        doubleValue:
          type: number
          format: double
          nullable: true
          description: The served value in case of a decimal number Setting.
    PredefinedVariationsModel:
      type: object
      description: >
        A setting's predefined variations, as ConfigCat's
        `PredefinedVariationsModel`.
      required:
        - predefinedVariations
        - maxPredefinedVariations
      properties:
        predefinedVariations:
          type: array
          description: The Feature Flag or Setting's Variations.
          items:
            $ref: "#/components/schemas/PredefinedVariationModel"
        maxPredefinedVariations:
          type: integer
          format: int32
          description: >
            The maximum number of predefined variations allowed for the
            Feature Flag or Setting: Confeature's technical maximum, 100, the
            same for every plan.
    PredefinedVariationsWithUsagesModel:
      type: object
      description: >
        A setting's predefined variations with their usages, as ConfigCat's
        `PredefinedVariationsWithUsagesModel`.
      required:
        - settingKey
        - settingType
        - predefinedVariations
        - environments
        - maxPredefinedVariations
      properties:
        settingKey:
          type: string
          description: Key of the Feature Flag or Setting.
        settingType:
          $ref: "#/components/schemas/SettingType"
        predefinedVariations:
          type: array
          description: The Feature Flag or Setting's Variations.
          items:
            $ref: "#/components/schemas/PredefinedVariationWithUsagesModel"
        environments:
          type: array
          description: The Environment descriptors for the Variations' usages.
          items:
            $ref: "#/components/schemas/PredefinedVariationEnvironmentModel"
        maxPredefinedVariations:
          type: integer
          format: int32
          description: >
            The maximum number of predefined variations allowed for the
            Feature Flag or Setting: Confeature's technical maximum, 100, the
            same for every plan.
    PredefinedVariationWithUsagesModel:
      type: object
      description: >
        A Predefined Variation with its usages, as ConfigCat's
        `PredefinedVariationWithUsagesModel`. In Confeature `usages` and
        `changeRequestUsages` are always empty, and both counts are 0: no
        setting value can name a predefined variation yet, and there are no
        change requests.
      required:
        - value
        - name
        - hint
        - predefinedVariationId
        - usages
        - usagesInOtherEnvironments
        - changeRequestUsages
        - changeRequestUsagesInOtherEnvironments
      properties:
        value:
          $ref: "#/components/schemas/PredefinedVariationValueModel"
        name:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: >
            The name of the Predefined Variation, shown on the Dashboard UI. If
            not set, the Value will be shown.
        hint:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: >
            The hint of the Predefined Variation: a longer description of what
            it serves, shown on the Dashboard UI.
        predefinedVariationId:
          type: string
          format: uuid
          description: The Predefined Variation's identifier.
        usages:
          type: array
          description: >
            The Feature Flag or Setting Variation's usages in the given
            Environments.
          items:
            $ref: "#/components/schemas/PredefinedVariationUsageModel"
        usagesInOtherEnvironments:
          type: integer
          format: int32
          description: >
            The Feature Flag or Setting Variation's usages in the Environments
            you don't have access to.
        changeRequestUsages:
          type: array
          description: >
            The Feature Flag or Setting Variation's usages in the given Change
            Requests.
          items:
            $ref: "#/components/schemas/PredefinedVariationChangeRequestUsageModel"
        changeRequestUsagesInOtherEnvironments:
          type: integer
          format: int32
          description: >
            The Feature Flag or Setting Variation's usages in the Change
            Requests you don't have access to.
    PredefinedVariationUsageModel:
      type: object
      description: >
        A setting value that serves the variation, as ConfigCat's
        `PredefinedVariationUsageModel`.
      required:
        - settingId
        - environmentId
      properties:
        settingId:
          type: integer
          format: int32
        environmentId:
          type: string
          format: uuid
    PredefinedVariationChangeRequestUsageModel:
      type: object
      description: >
        A change request that serves the variation, as ConfigCat's
        `PredefinedVariationChangeRequestUsageModel`.
      required:
        - changeRequestId
        - changeRequestTitle
        - settingId
        - environmentId
      properties:
        changeRequestId:
          type: integer
          format: int64
        changeRequestTitle:
          type: string
        settingId:
          type: integer
          format: int32
        environmentId:
          type: string
          format: uuid
    PredefinedVariationEnvironmentModel:
      type: object
      description: >
        An Environment of the setting's product, as ConfigCat's
        `PredefinedVariationEnvironmentModel`.
      required:
        - environmentId
        - name
        - accessType
      properties:
        environmentId:
          type: string
          format: uuid
          description: The identifier of the Environment.
        name:
          type: string
          description: The name of the Environment.
        accessType:
          $ref: "#/components/schemas/EnvironmentAccessType"
    EnvironmentAccessType:
      type: string
      enum:
        - full
        - readOnly
        - none
      description: >
        Represent the environment specific Feature Management permission, as
        ConfigCat's `EnvironmentAccessType`. Confeature has no
        environment-specific permission and answers `full`.
    CreatePredefinedVariationModel:
      type: object
      additionalProperties: false
      description: >
        A Predefined Variation of a new setting, as ConfigCat's
        `CreatePredefinedVariationModel`. It has no
        `predefinedVariationId`: the id is minted, and a body naming one, or
        any other field, is refused (400).
      required:
        - value
      properties:
        value:
          $ref: "#/components/schemas/CreatePredefinedVariationValueModel"
        name:
          type: string
          minLength: 0
          maxLength: 255
          nullable: true
          description: >
            The name of the Predefined Variation, shown on the Dashboard UI. If
            not set, the Value will be shown.
        hint:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
          description: >
            The hint of the Predefined Variation: a longer description of what
            it serves, shown on the Dashboard UI.
    CreatePredefinedVariationValueModel:
      type: object
      description: >
        Represents the value of a Predefined Variation: exactly one field, the
        one matching the setting's type, is non-null.
      properties:
        boolValue:
          type: boolean
          nullable: true
          description: The served value in case of a boolean Feature Flag.
        stringValue:
          type: string
          nullable: true
          description: The served value in case of a text Setting.
        intValue:
          type: integer
          format: int32
          nullable: true
          description: The served value in case of a whole number Setting.
        doubleValue:
          type: number
          format: double
          nullable: true
          description: The served value in case of a decimal number Setting.
    ValueModel:
      type: object
      description: >
        A typed value, as ConfigCat's `ValueModel`: exactly the field that
        matches the setting's type is non-null.
      required:
        - boolValue
        - stringValue
        - intValue
        - doubleValue
        - predefinedVariationId
      properties:
        boolValue:
          type: boolean
          nullable: true
        stringValue:
          type: string
          nullable: true
        intValue:
          type: integer
          format: int32
          nullable: true
        doubleValue:
          type: number
          format: double
          nullable: true
        predefinedVariationId:
          type: string
          format: uuid
          nullable: true
          description: Always null in Confeature.
    UpdateValueModel:
      type: object
      additionalProperties: false
      description: >
        The value to set, as ConfigCat's `UpdateValueModel`: exactly one
        field, the one matching the setting's type, is non-null.
        `predefinedVariationId` is refused (400).
      properties:
        boolValue:
          type: boolean
          nullable: true
        stringValue:
          type: string
          maxLength: 100000
          nullable: true
        intValue:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
          nullable: true
        doubleValue:
          type: number
          format: double
          nullable: true
        predefinedVariationId:
          type: string
          format: uuid
          nullable: true
    UpdateEvaluationFormulaModel:
      type: object
      additionalProperties: false
      description: >
        The body of a v2 value PUT, as ConfigCat's
        `UpdateEvaluationFormulaModel`. A full replace: an omitted field is
        reset.
      required:
        - defaultValue
      properties:
        defaultValue:
          $ref: "#/components/schemas/UpdateValueModel"
        targetingRules:
          type: array
          nullable: true
          maxItems: 500
          description: >
            The ordered targeting rules; the first rule a user matches serves
            its value. Null or omitted means none.
          items:
            $ref: "#/components/schemas/UpdateTargetingRuleModel"
        percentageEvaluationAttribute:
          type: string
          nullable: true
          maxLength: 1000
          description: >
            The user attribute percentage options bucket on, for every rule of
            this formula: 1 to 1000 characters, an empty string is refused.
            Null or omitted is `Identifier`.
    UserComparator:
      type: string
      description: >
        ConfigCat's `UserComparator`, in its order; every value is accepted.
        `semVerLess` … `semVerGreaterOrEquals`, `sensitiveTextEquals`,
        `sensitiveTextDoesNotEqual`, `textEquals` and `textDoesNotEqual` take a
        `stringValue`; the `number…` comparators and `dateTimeBefore` /
        `dateTimeAfter` (Unix seconds) take a `doubleValue`; every other one
        takes a `listValue`.
      enum:
        - isOneOf
        - isNotOneOf
        - containsAnyOf
        - doesNotContainAnyOf
        - semVerIsOneOf
        - semVerIsNotOneOf
        - semVerLess
        - semVerLessOrEquals
        - semVerGreater
        - semVerGreaterOrEquals
        - numberEquals
        - numberDoesNotEqual
        - numberLess
        - numberLessOrEquals
        - numberGreater
        - numberGreaterOrEquals
        - sensitiveIsOneOf
        - sensitiveIsNotOneOf
        - dateTimeBefore
        - dateTimeAfter
        - sensitiveTextEquals
        - sensitiveTextDoesNotEqual
        - sensitiveTextStartsWithAnyOf
        - sensitiveTextNotStartsWithAnyOf
        - sensitiveTextEndsWithAnyOf
        - sensitiveTextNotEndsWithAnyOf
        - sensitiveArrayContainsAnyOf
        - sensitiveArrayDoesNotContainAnyOf
        - textEquals
        - textDoesNotEqual
        - textStartsWithAnyOf
        - textNotStartsWithAnyOf
        - textEndsWithAnyOf
        - textNotEndsWithAnyOf
        - arrayContainsAnyOf
        - arrayDoesNotContainAnyOf
    SegmentComparator:
      type: string
      enum: [isIn, isNotIn]
      description: >
        ConfigCat's `SegmentComparator`: whether the user is, or is not, in
        the segment (#886).
    PrerequisiteComparator:
      type: string
      enum: [equals, doesNotEqual]
      description: >
        ConfigCat's `PrerequisiteComparator`: whether the prerequisite's
        served value equals, or does not equal, the condition's value.
    RolloutRuleComparator:
      type: string
      enum:
        - isOneOf
        - isNotOneOf
        - contains
        - doesNotContain
        - semVerIsOneOf
        - semVerIsNotOneOf
        - semVerLess
        - semVerLessOrEquals
        - semVerGreater
        - semVerGreaterOrEquals
        - numberEquals
        - numberDoesNotEqual
        - numberLess
        - numberLessOrEquals
        - numberGreater
        - numberGreaterOrEquals
        - sensitiveIsOneOf
        - sensitiveIsNotOneOf
      description: >
        ConfigCat's legacy comparator, the one a segment's condition takes
        (#886). The `isOneOf`, `isNotOneOf`, semver list and sensitive
        comparators read the value as a comma-separated list, each item
        trimmed; `contains` and `doesNotContain` compare the whole value; the
        number comparators read a decimal number, a decimal comma accepted.
    CreateSegmentModel:
      type: object
      additionalProperties: false
      description: A new segment, as ConfigCat's model.
      required:
        - name
        - comparisonAttribute
        - comparator
        - comparisonValue
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
        comparisonAttribute:
          type: string
          minLength: 1
          maxLength: 1000
        comparator:
          $ref: "#/components/schemas/RolloutRuleComparator"
        comparisonValue:
          type: string
          minLength: 1
          maxLength: 65535
    UpdateSegmentModel:
      type: object
      additionalProperties: false
      description: >
        A segment update, as ConfigCat's model: a field that is absent or
        null keeps its value; the result is held to the create bounds.
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
        comparisonAttribute:
          type: string
          nullable: true
          maxLength: 1000
        comparator:
          allOf:
            - $ref: "#/components/schemas/RolloutRuleComparator"
          nullable: true
        comparisonValue:
          type: string
          nullable: true
          maxLength: 65535
    SegmentModel:
      type: object
      description: >
        A segment, as ConfigCat's model. The creator and updater fields are
        always null: Confeature does not return member identities through
        this model. A sensitive comparison value is returned in cleartext.
      required:
        - createdAt
        - creatorEmail
        - creatorFullName
        - description
        - lastUpdaterEmail
        - lastUpdaterFullName
        - name
        - product
        - segmentId
        - updatedAt
        - comparisonAttribute
        - comparator
        - comparisonValue
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        segmentId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        creatorFullName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastUpdaterEmail:
          type: string
          nullable: true
        lastUpdaterFullName:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        comparisonAttribute:
          type: string
        comparator:
          $ref: "#/components/schemas/RolloutRuleComparator"
        comparisonValue:
          type: string
    SegmentListModel:
      type: object
      description: >
        A segment as ConfigCat lists it, with its `usage`: how many feature
        flags and settings reference it. The creator and updater fields are
        always null.
      required:
        - createdAt
        - creatorEmail
        - creatorFullName
        - description
        - lastUpdaterEmail
        - lastUpdaterFullName
        - name
        - product
        - segmentId
        - updatedAt
        - usage
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        segmentId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        creatorFullName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastUpdaterEmail:
          type: string
          nullable: true
        lastUpdaterFullName:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        usage:
          type: integer
          format: int32
    TagModel:
      type: object
      description: >
        A tag, as ConfigCat's model: a product-scoped label for sorting
        feature flags and settings.
      required:
        - color
        - name
        - product
        - tagId
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        tagId:
          type: integer
          format: int64
          description: Identifier of the Tag.
        name:
          type: string
          description: Name of the Tag.
        color:
          type: string
          nullable: true
          description: The configured color of the Tag.
    SettingTagModel:
      type: object
      description: >
        A tag as a setting's value carries it, as ConfigCat's
        `SettingTagModel` (#1009): the assignment's identifier and the tag's
        identifier, name and color, without the tag's product.
      required:
        - color
        - name
        - settingTagId
        - tagId
      properties:
        settingTagId:
          type: integer
          format: int64
          description: Identifier of the assignment of the Tag to the setting.
        tagId:
          type: integer
          format: int64
          description: Identifier of the Tag.
        name:
          type: string
          description: Name of the Tag.
        color:
          type: string
          nullable: true
          description: The configured color of the Tag.
    CreateTagModel:
      type: object
      additionalProperties: false
      description: A new tag, as ConfigCat's model.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the Tag.
        color:
          type: string
          nullable: true
          minLength: 0
          maxLength: 255
          description: >
            Color of the Tag. Possible values: `panther`, `whale`, `salmon`,
            `lizard`, `canary`, `koala`, or any HTML color code. Stored as
            given: only its length is checked.
    UpdateTagModel:
      type: object
      additionalProperties: false
      description: >
        A tag update, as ConfigCat's model: a field that is absent or null
        keeps its value; the result is held to the create bounds.
      properties:
        name:
          type: string
          nullable: true
          minLength: 0
          maxLength: 255
          description: Name of the Tag.
        color:
          type: string
          nullable: true
          minLength: 0
          maxLength: 255
          description: >
            Color of the Tag. Possible values: `panther`, `whale`, `salmon`,
            `lizard`, `canary`, `koala`, or any HTML color code. Stored as
            given: only its length is checked.
    UpdateComparisonValueListModel:
      type: object
      additionalProperties: false
      description: One item of a list comparison value, as ConfigCat's model.
      required:
        - value
      properties:
        value:
          type: string
          maxLength: 255
        hint:
          type: string
          nullable: true
          maxLength: 1500
    UpdateComparisonValueModel:
      type: object
      additionalProperties: false
      description: >
        The value a user attribute is compared to, as ConfigCat's model:
        exactly the field the comparator takes is non-null (see
        `UserComparator`). A `doubleValue` must be finite. A semver
        comparator's value (each non-blank list item, or the string) must be
        a semantic version the SDKs parse: `v?MAJOR.MINOR.PATCH`, an optional
        pre-release and build, at most 256 characters once trimmed.
      properties:
        stringValue:
          type: string
          nullable: true
          maxLength: 65535
        doubleValue:
          type: number
          format: double
          nullable: true
        listValue:
          type: array
          nullable: true
          description: >
            A list comparator's items. `minItems: 1` is Confeature's, not
            ConfigCat's (which sets none): an empty list matches no user under
            `isOneOf` or `containsAnyOf` and every user carrying the attribute
            under their negations, so the condition is dead or always true. It is refused as a
            misauthored condition rather than stored as one.
          minItems: 1
          maxItems: 15000
          items:
            $ref: "#/components/schemas/UpdateComparisonValueListModel"
    UpdateUserConditionModel:
      type: object
      additionalProperties: false
      description: A condition on a user attribute, as ConfigCat's model.
      required:
        - comparisonAttribute
        - comparator
        - comparisonValue
      properties:
        comparisonAttribute:
          type: string
          minLength: 1
          maxLength: 1000
        comparator:
          $ref: "#/components/schemas/UserComparator"
        comparisonValue:
          $ref: "#/components/schemas/UpdateComparisonValueModel"
    UpdateSegmentConditionModel:
      type: object
      additionalProperties: false
      description: >
        A condition on a segment, as ConfigCat's model (#886): a segment of
        the setting's own product, which cannot be deleted while a rule
        references it.
      required:
        - segmentId
        - comparator
      properties:
        segmentId:
          type: string
          format: uuid
        comparator:
          $ref: "#/components/schemas/SegmentComparator"
    UpdatePrerequisiteFlagConditionModel:
      type: object
      additionalProperties: false
      description: >
        A condition on a prerequisite flag, as ConfigCat's model: another
        setting of the same config, and a value of that setting's type (the
        one typed field of its type is set). The prerequisite is evaluated in
        the same environment.
      required:
        - prerequisiteSettingId
        - comparator
        - prerequisiteComparisonValue
      properties:
        prerequisiteSettingId:
          type: integer
          format: int32
        comparator:
          $ref: "#/components/schemas/PrerequisiteComparator"
        prerequisiteComparisonValue:
          $ref: "#/components/schemas/UpdateValueModel"
    UpdateConditionModel:
      type: object
      additionalProperties: false
      description: >
        One AND-ed condition, as ConfigCat's model: exactly one of its three
        fields is non-null.
      properties:
        userCondition:
          allOf:
            - $ref: "#/components/schemas/UpdateUserConditionModel"
          nullable: true
        segmentCondition:
          allOf:
            - $ref: "#/components/schemas/UpdateSegmentConditionModel"
          nullable: true
        prerequisiteFlagCondition:
          allOf:
            - $ref: "#/components/schemas/UpdatePrerequisiteFlagConditionModel"
          nullable: true
    UpdatePercentageOptionModel:
      type: object
      additionalProperties: false
      description: >
        A percentage option, as ConfigCat's model. A rule's percentages are
        integers from 0 to 100 and sum to exactly 100; a boolean setting has
        exactly two options; the value has the setting's type.
      required:
        - percentage
        - value
      properties:
        percentage:
          type: integer
          format: int32
        value:
          $ref: "#/components/schemas/UpdateValueModel"
    UpdateTargetingRuleModel:
      type: object
      additionalProperties: false
      description: >
        A targeting rule, as ConfigCat's model. It sets exactly one of `value`
        and `percentageOptions`; it has one or more conditions, or none only
        as the last rule serving percentage options.
      properties:
        conditions:
          type: array
          nullable: true
          maxItems: 100
          items:
            $ref: "#/components/schemas/UpdateConditionModel"
        percentageOptions:
          type: array
          nullable: true
          maxItems: 500
          items:
            $ref: "#/components/schemas/UpdatePercentageOptionModel"
        value:
          allOf:
            - $ref: "#/components/schemas/UpdateValueModel"
          nullable: true
    ComparisonValueListModel:
      type: object
      required:
        - value
        - hint
      properties:
        value:
          type: string
        hint:
          type: string
          nullable: true
          maxLength: 1500
    ComparisonValueModel:
      type: object
      description: >
        The value a user attribute is compared to: exactly the field the
        comparator takes is non-null. Sensitive values are in cleartext.
      required:
        - stringValue
        - doubleValue
        - listValue
      properties:
        stringValue:
          type: string
          nullable: true
        doubleValue:
          type: number
          format: double
          nullable: true
        listValue:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ComparisonValueListModel"
    UserConditionModel:
      type: object
      required:
        - comparisonAttribute
        - comparator
        - comparisonValue
      properties:
        comparisonAttribute:
          type: string
          minLength: 1
          maxLength: 1000
        comparator:
          $ref: "#/components/schemas/UserComparator"
        comparisonValue:
          $ref: "#/components/schemas/ComparisonValueModel"
    SegmentConditionModel:
      type: object
      required:
        - segmentId
        - comparator
      properties:
        segmentId:
          type: string
          format: uuid
        comparator:
          $ref: "#/components/schemas/SegmentComparator"
    PrerequisiteFlagConditionModel:
      type: object
      required:
        - prerequisiteSettingId
        - comparator
        - prerequisiteComparisonValue
      properties:
        prerequisiteSettingId:
          type: integer
          format: int32
        comparator:
          $ref: "#/components/schemas/PrerequisiteComparator"
        prerequisiteComparisonValue:
          $ref: "#/components/schemas/ValueModel"
    ConditionModel:
      type: object
      description: One AND-ed condition; exactly one of its three fields is non-null.
      required:
        - userCondition
        - segmentCondition
        - prerequisiteFlagCondition
      properties:
        userCondition:
          allOf:
            - $ref: "#/components/schemas/UserConditionModel"
          nullable: true
        segmentCondition:
          allOf:
            - $ref: "#/components/schemas/SegmentConditionModel"
          nullable: true
        prerequisiteFlagCondition:
          allOf:
            - $ref: "#/components/schemas/PrerequisiteFlagConditionModel"
          nullable: true
    PercentageOptionModel:
      type: object
      required:
        - percentage
        - value
      properties:
        percentage:
          type: integer
          format: int32
        value:
          $ref: "#/components/schemas/ValueModel"
    TargetingRuleModel:
      type: object
      description: >
        A targeting rule, as ConfigCat's model: its AND-ed conditions, then
        either its `value` or its `percentageOptions` (empty when it serves a
        value).
      required:
        - conditions
        - percentageOptions
        - value
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/ConditionModel"
        percentageOptions:
          type: array
          items:
            $ref: "#/components/schemas/PercentageOptionModel"
        value:
          allOf:
            - $ref: "#/components/schemas/ValueModel"
          nullable: true
    FeatureFlagLimitations:
      type: object
      description: >
        The limits this setting's values are held to, as ConfigCat's
        `FeatureFlagLimitations`: the organization's limits, at most
        ConfigCat's published maxima, each one enforced.
      required:
        - maxPercentageOptionCount
        - maxTargetingRuleCount
        - maxComparisonValueLength
        - maxComparisonValueListLength
        - maxComparisonValueListItemLength
        - maxStringFlagValueLength
        - maxConditionPerTargetingRuleCount
      properties:
        maxPercentageOptionCount:
          type: integer
          format: int32
        maxTargetingRuleCount:
          type: integer
          format: int32
        maxComparisonValueLength:
          type: integer
          format: int32
        maxComparisonValueListLength:
          type: integer
          format: int32
        maxComparisonValueListItemLength:
          type: integer
          format: int32
        maxStringFlagValueLength:
          type: integer
          format: int32
        maxConditionPerTargetingRuleCount:
          type: integer
          format: int32
    ConfigSettingFormulaModel:
      type: object
      description: >
        One setting's value in one environment, as ConfigCat's
        `ConfigSettingFormulaModel` (an entry of get-setting-values-v2): the
        fields of SettingFormulaModel without its config and environment
        envelope. The person fields are always null, and approvals are not
        supported, so `changeRequestCount` is 0.
      required:
        - lastVersionId
        - defaultValue
        - targetingRules
        - setting
        - updatedAt
        - percentageEvaluationAttribute
        - lastUpdaterUserEmail
        - lastUpdaterUserFullName
        - integrationLinks
        - settingTags
        - settingIdsWherePrerequisite
        - changeRequestCount
      properties:
        lastVersionId:
          type: string
          format: uuid
          description: >
            The version of this value. Send it back as `latestVersionId` to
            refuse the write if someone changed the value in between.
        defaultValue:
          $ref: "#/components/schemas/ValueModel"
        targetingRules:
          type: array
          maxItems: 500
          description: The ordered targeting rules, sensitive values in cleartext.
          items:
            $ref: "#/components/schemas/TargetingRuleModel"
        setting:
          $ref: "#/components/schemas/SettingDataV2Model"
        updatedAt:
          type: string
          format: date-time
          nullable: true
        percentageEvaluationAttribute:
          type: string
          nullable: true
        lastUpdaterUserEmail:
          type: string
          nullable: true
        lastUpdaterUserFullName:
          type: string
          nullable: true
        integrationLinks:
          type: array
          maxItems: 0
          items:
            type: object
        settingTags:
          type: array
          description: >
            The tags attached to the Feature Flag or Setting, by assignment
            order.
          items:
            $ref: "#/components/schemas/SettingTagModel"
        settingIdsWherePrerequisite:
          type: array
          description: >
            The settings whose targeting rules in this environment have this
            setting as a prerequisite, by ascending id.
          items:
            type: integer
            format: int32
        changeRequestCount:
          type: integer
          format: int32
    ConfigSettingFormulasModel:
      type: object
      description: >
        Every setting's value of one config in one environment, as ConfigCat's
        `ConfigSettingFormulasModel` (get-setting-values-v2). Approvals are not
        supported, so `approveRequired` and `canBypassApproval` are false.
      required:
        - config
        - environment
        - readOnly
        - settingFormulas
        - featureFlagLimitations
        - approveRequired
        - canBypassApproval
        - reasonRequired
      properties:
        config:
          $ref: "#/components/schemas/ConfigModel"
        environment:
          $ref: "#/components/schemas/EnvironmentModel"
        readOnly:
          type: boolean
          description: True when the caller cannot write values here.
        settingFormulas:
          type: array
          description: Every setting's formula, in the config's settings-list order.
          items:
            $ref: "#/components/schemas/ConfigSettingFormulaModel"
        featureFlagLimitations:
          $ref: "#/components/schemas/FeatureFlagLimitations"
        approveRequired:
          type: boolean
        canBypassApproval:
          type: boolean
        reasonRequired:
          type: boolean
          description: >
            True when a change note (`reason`) is required for a value change
            in this environment.
    SettingFormulaModel:
      type: object
      description: >
        A setting's value in one environment, as ConfigCat's
        `SettingFormulaModel` (get-setting-value-v2). The person fields are
        always null, and approvals are not supported, so `approveRequired`,
        `canBypassApproval` and `changeRequestCount` are false / false / 0.
      required:
        - lastVersionId
        - defaultValue
        - targetingRules
        - setting
        - updatedAt
        - percentageEvaluationAttribute
        - lastUpdaterUserEmail
        - lastUpdaterUserFullName
        - integrationLinks
        - settingTags
        - settingIdsWherePrerequisite
        - changeRequestCount
        - config
        - environment
        - readOnly
        - featureFlagLimitations
        - approveRequired
        - canBypassApproval
        - reasonRequired
      properties:
        lastVersionId:
          type: string
          format: uuid
          description: >
            The version of this value. Send it back as `latestVersionId` to
            refuse the write if someone changed the value in between.
        defaultValue:
          $ref: "#/components/schemas/ValueModel"
        targetingRules:
          type: array
          maxItems: 500
          description: The ordered targeting rules, sensitive values in cleartext.
          items:
            $ref: "#/components/schemas/TargetingRuleModel"
        setting:
          $ref: "#/components/schemas/SettingDataV2Model"
        updatedAt:
          type: string
          format: date-time
          nullable: true
        percentageEvaluationAttribute:
          type: string
          nullable: true
        lastUpdaterUserEmail:
          type: string
          nullable: true
        lastUpdaterUserFullName:
          type: string
          nullable: true
        integrationLinks:
          type: array
          maxItems: 0
          items:
            type: object
        settingTags:
          type: array
          description: >
            The tags attached to the Feature Flag or Setting, by assignment
            order.
          items:
            $ref: "#/components/schemas/SettingTagModel"
        settingIdsWherePrerequisite:
          type: array
          description: >
            The settings whose targeting rules in this environment have this
            setting as a prerequisite, by ascending id.
          items:
            type: integer
            format: int32
        changeRequestCount:
          type: integer
          format: int32
        config:
          $ref: "#/components/schemas/ConfigModel"
        environment:
          $ref: "#/components/schemas/EnvironmentModel"
        readOnly:
          type: boolean
          description: True when the caller cannot write values here.
        featureFlagLimitations:
          $ref: "#/components/schemas/FeatureFlagLimitations"
        approveRequired:
          type: boolean
        canBypassApproval:
          type: boolean
        reasonRequired:
          type: boolean
          description: >
            True when a change note (`reason`) is required for a value change
            in this environment.
    OperationType:
      type: string
      enum: [unknown, add, remove, replace, move, copy, test]
      description: >
        ConfigCat's `OperationType`. `unknown` is accepted by the schema and
        refused (400).
    JsonPatchOperation:
      type: object
      description: One RFC 6902 operation, as ConfigCat's `JsonPatchOperation`.
      required:
        - op
        - path
      properties:
        op:
          $ref: "#/components/schemas/OperationType"
        path:
          type: string
          minLength: 1
          description: The target JSON Pointer (RFC 6901).
        from:
          type: string
          nullable: true
          description: The source JSON Pointer, for move and copy.
        value:
          nullable: true
          description: The value, for add, replace and test.
    SdkKeysModel:
      type: object
      description: >
        The SDK keys for a Config in a specified Environment. Schema aligned
        1:1 with ConfigCat's `SdkKeysModel`
        (configcat-publicapi-node-client/model/sdk-keys-model.ts).
      required:
        - primary
        - secondary
      properties:
        primary:
          type: string
          description: >
            The primary SDK key. Minted in ConfigCat's shape,
            `configcat-sdk-1/<22>/<22>`; an older key keeps
            the legacy `confeature-sdk-1-<32>-<32>` shape and stays valid.
          example: configcat-sdk-1/FAKEfixtureKeyNotRea01/FAKEfixtureKeyNotRea02
        secondary:
          type: string
          nullable: true
          description: >
            The secondary SDK key, in either shape (see `primary`). Null
            when the secondary slot is empty.
    SdkKeyNotFound:
      type: object
      description: >
        404 body of `deleteSdkKey` — the config-in-environment does not exist,
        or is not visible to the caller's organization.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_found]
        message:
          type: string
    SdkKeyConflict:
      type: object
      description: >
        409 body of the SDK-key extensions (Confeature extension). `only_key`
        (`deleteSdkKey`): the only key cannot be deleted — generate a
        secondary first. `secondary_exists` (`rotateSdkKeys`): a secondary
        already exists — delete one of the two keys first.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [only_key, secondary_exists]
        message:
          type: string
    EnvironmentModel:
      type: object
      description: >
        Details of the Environment. Schema aligned 1:1 with ConfigCat's
        `EnvironmentModel` (configcat-publicapi-node-client/model/
        environment-model.ts).
      required:
        - product
        - environmentId
        - name
        - color
        - description
        - order
        - reasonRequired
        - approveRequired
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        environmentId:
          type: string
          format: uuid
          description: Identifier of the Environment.
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the Environment.
        color:
          type: string
          nullable: true
          description: The color of the Environment.
        description:
          type: string
          nullable: true
          description: The description of the Environment.
        order:
          type: integer
          description: >
            The order of the Environment represented on the dashboard.
            Determined from an ascending sequence of integers.
        reasonRequired:
          type: boolean
          description: >
            Determines whether a mandatory reason must be given every time
            the Feature Flags or Settings are saved within this Environment.
            Set with PATCH /v1/environments/{environmentId} (a Confeature
            addition; ConfigCat sets it through
            POST /v1/products/{productId}/preferences).
        approveRequired:
          type: boolean
          description: >
            Whether changes need an approval. Always false: Confeature has no
            approval flow. Carried for wire parity with ConfigCat.
    CreateEnvironmentModel:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: The name of the Environment.
        color:
          type: string
          nullable: true
          description: The color of the Environment.
        description:
          type: string
          nullable: true
          description: The description of the Environment.
        order:
          type: integer
          nullable: true
          description: >
            The order of the Environment represented on the dashboard. When
            omitted, the next integer in the product's sequence is assigned.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the owning product requires a reason for changes. A
            Confeature addition: a ConfigCat client omits it.
    UpdateEnvironmentModel:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          description: The name of the Environment.
        color:
          type: string
          nullable: true
          description: The color of the Environment.
        description:
          type: string
          nullable: true
          description: The description of the Environment.
        order:
          type: integer
          nullable: true
          description: The order of the Environment represented on the dashboard.
        reasonRequired:
          type: boolean
          description: >
            Determines whether a mandatory reason must be given every time the
            Feature Flags or Settings are saved within this Environment. A
            Confeature addition: ConfigCat sets this flag through
            POST /v1/products/{productId}/preferences
            (reasonRequiredEnvironments), not on the environment update body.
        reason:
          type: string
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the environment or its product requires a reason for
            changes. A Confeature addition: a ConfigCat client omits it.
    InvitationModel:
      type: object
      description: >
        Details of an Invitation. Schema aligned 1:1 with ConfigCat's
        `InvitationModel` (configcat-publicapi-node-client/model/
        invitation-model.ts).
      required:
        - invitationId
        - email
        - permissionGroupId
        - createdAt
        - expired
      properties:
        invitationId:
          type: string
          description: Identifier of the Invitation.
        email:
          type: string
          nullable: true
          description: >
            The email address the invitation was sent to. Nullable for
            parity with ConfigCat's model; Confeature always emits a
            non-null value.
        permissionGroupId:
          type: integer
          description: >
            Identifier of the Permission Group the invited user joins.
            Always 0 in Confeature v1 — carried for wire parity (no
            permission-groups feature yet).
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp the invitation was created.
        expired:
          type: boolean
          description: >
            Whether the invitation has expired. True when the invitation's
            expiry instant has passed; independent of redemption state.
    RateLimited:
      type: object
      description: >
        A management write refused because its organization's write budget is
        spent (#934). One constant body, the same the CLI device flow's
        per-IP limit answers.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [rate_limited]
        message:
          type: string
          enum: [too many requests]
    ValueNotLive:
      type: object
      description: >
        A value write that was saved but did not reach the edge (#879). One
        constant body for every cause.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_live]
        message:
          type: string
          enum:
            - "The value is saved but is not live yet. Retry the same request to make it live."
    SettingValue:
      type: object
      description: >
        Per-environment setting value envelope. Matches ConfigCat's shape:
        `value` carries the override; `rolloutRules` and
        `rolloutPercentageItems` MUST be present but empty in phase 1
        (segments / targeting are not yet supported);
        `settingType` is the value's type discriminator. Confeature persists
        only `value` and `settingType` for now.
      required:
        - value
        - rolloutRules
        - rolloutPercentageItems
        - settingType
      properties:
        value:
          oneOf:
            - type: boolean
            - type: string
            - type: number
          description: >
            The per-environment value. Its JSON type MUST respect the setting's
            `settingType` — a boolean for `boolean`, a string for `string`, an
            integer for `int`, any finite number for `double`. Aligned with
            ConfigCat's `SettingValueType` (boolean | number | string).
        rolloutRules:
          type: array
          maxItems: 0
          description: >
            Reserved for targeting rules. MUST be an empty array in phase 1;
            non-empty values return 400 (segments / targeting are not yet
            supported).
          items:
            type: object
        rolloutPercentageItems:
          type: array
          maxItems: 0
          description: >
            Reserved for percentage rollouts. MUST be an empty array in
            phase 1; non-empty values return 400 (segments / targeting are
            not yet supported).
          items:
            type: object
        settingType:
          $ref: "#/components/schemas/SettingType"
        reason:
          type: string
          maxLength: 1000
          writeOnly: true
          description: >
            The change note for the audit log. Required (400 reason_required)
            when the environment or its product requires a reason for
            changes. A Confeature addition: a ConfigCat client omits it.
    PublishResponse:
      type: object
      required:
        - config_id
        - sdk_keys_updated
        - setting_count
        - published_at
      properties:
        config_id:
          type: string
          format: uuid
        sdk_keys_updated:
          type: integer
          minimum: 0
          description: >
            Number of active SDK keys whose served entry was actually
            (re)written by this publish. A key already serving the published
            payload (same ETag) is not rewritten and is not counted, so a
            publish that changes nothing reports 0.
        setting_count:
          type: integer
          minimum: 0
          description: Number of settings included in the projected payload.
        published_at:
          type: number
          description: Unix epoch ms at which the publish completed.
    OrganizationModel:
      type: object
      description: >
        Details of the Organization. Schema aligned 1:1 with ConfigCat's
        `OrganizationModel` (configcat-publicapi-node-client/model/
        organization-model.ts).
      required: [organizationId, name]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Identifier of the Organization.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the Organization.
    OrganizationAdminModel:
      type: object
      description: >
        Describes an Organization Admin. ConfigCat parity
        (organization-admin-model.ts). `twoFactorEnabled` always
        reports `false` in Confeature v1 — the field is carried for
        wire-shape parity; truthful values arrive when 2FA support
        ships.
      required: [userId, fullName, email, twoFactorEnabled]
      properties:
        userId:
          type: string
          format: uuid
          description: Identifier of the Organization Admin.
        fullName:
          type: string
          description: Name of the Organization Admin.
        email:
          type: string
          format: email
          description: Email of the Organization Admin.
        twoFactorEnabled:
          type: boolean
          description: >
            Determines whether 2FA is enabled for the Organization Admin.
            Always `false` in Confeature v1 (no 2FA yet).
    OrganizationMemberModel:
      type: object
      description: >
        Describes an Organization Member. ConfigCat parity
        (organization-member-model.ts). The `permissions` field always
        returns an empty array in Confeature v1 — per-product ACL is
        not yet supported. The shape is preserved so ConfigCat
        customers regenerating clients against the Confeature API don't
        lose fields.
      required: [userId, fullName, email, twoFactorEnabled, permissions]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        twoFactorEnabled:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationPermissionModel"
          description: >
            The permissions of the Member. v1 of Confeature does not
            implement per-product permissions; this field always returns
            an empty array.
    OrganizationPermissionModel:
      type: object
      description: >
        Per-product permission entry (ConfigCat parity placeholder).
        Confeature v1 returns EMPTY arrays in
        `OrganizationMemberModel.permissions`. The shape is published so
        client codegen does not break; field-level fidelity will land
        when per-product ACL ships.
      properties: {}
    OrganizationMembersModel:
      type: object
      description: >
        Response shape for GET /v1/organizations/{organizationId}/members.
        ConfigCat parity (organization-members-model.ts). Three role
        buckets — admins, billingManagers, members. v1 of Confeature
        populates `admins` (self-service signup, founder-org backfill,
        existing invite redemption) and eventually `members` (future
        member-role invitations). `billingManagers` always returns an
        empty array until billing managers are supported.
      required: [admins, billingManagers, members]
      properties:
        admins:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAdminModel"
          description: List of Organization Admins.
        billingManagers:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAdminModel"
          description: >
            List of Billing Managers. Empty in v1 of Confeature (no
            billing module yet). Field present for ConfigCat wire parity.
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMemberModel"
          description: List of Organization Members.
    StatisticsV2Model:
      type: object
      description: >
        ConfigCat's `StatisticsV2Model`, the monthly usage and quota of an
        Organization, plus Confeature's additive `plan`, `limits` and `usage`.
        Confeature does not meter evaluation requests: the two quota fields
        are 2147483647 (unlimited), the three statistics arrays are always
        empty and `hasConnectedApplication` is always false.
      required:
        - hasConnectedApplication
        - millionRequestLimitPerMonth
        - networkTrafficGigaByteLimitPerMonth
        - organizationStatistics
        - productStatistics
        - detailedStatistics
        - plan
        - limits
        - usage
      properties:
        hasConnectedApplication:
          type: boolean
          description: >
            Whether the Organization has a connected application. Always false:
            Confeature does not record SDK connections.
        millionRequestLimitPerMonth:
          type: integer
          format: int32
          description: >
            The monthly request quota in millions. Always 2147483647, the int32
            maximum: Confeature does not meter evaluation requests.
        networkTrafficGigaByteLimitPerMonth:
          type: integer
          format: int32
          description: >
            The monthly network traffic quota in gigabytes. Always 2147483647,
            the int32 maximum: Confeature does not meter network traffic.
        organizationStatistics:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMonthlyStatisticV2Model"
          description: The Organization's monthly statistics. Always empty.
        productStatistics:
          type: array
          items:
            $ref: "#/components/schemas/ProductMonthlyStatisticV2Model"
          description: The Products' monthly statistics. Always empty.
        detailedStatistics:
          type: array
          items:
            $ref: "#/components/schemas/DetailedStatisticV2Model"
          description: The per-day, per-Config, per-Environment statistics. Always empty.
        plan:
          type: string
          enum: [free, pro, team, enterprise]
          description: The Organization's plan. Confeature extension.
        limits:
          $ref: "#/components/schemas/UsagePlanLimits"
        usage:
          $ref: "#/components/schemas/UsageCounts"
    OrganizationMonthlyStatisticV2Model:
      type: object
      description: >
        ConfigCat's aggregated monthly statistics of an Organization. Declared
        so a generated client deserialises `organizationStatistics`; Confeature
        never sends an item.
      required:
        - date
        - millionRequestCount
        - millionRequestLimitPerMonth
        - networkTrafficGigaByteLimitPerMonth
        - overLimit
        - overNetworkTrafficLimit
        - publicApiCallCount
        - responseMegaBytes
      properties:
        date:
          type: string
          format: date-time
        millionRequestCount:
          type: number
          format: double
        responseMegaBytes:
          type: number
          format: double
        overLimit:
          type: boolean
        overNetworkTrafficLimit:
          type: boolean
        millionRequestLimitPerMonth:
          type: integer
          format: int32
        networkTrafficGigaByteLimitPerMonth:
          type: integer
          format: int32
        publicApiCallCount:
          type: integer
          format: int64
    ProductMonthlyStatisticV2Model:
      type: object
      description: >
        ConfigCat's aggregated monthly statistics of a Product. Declared so a
        generated client deserialises `productStatistics`; Confeature never
        sends an item.
      required: [date, millionRequestCount, productId, responseMegaBytes]
      properties:
        productId:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
        millionRequestCount:
          type: number
          format: double
        responseMegaBytes:
          type: number
          format: double
    DetailedStatisticV2Model:
      type: object
      description: >
        ConfigCat's request and traffic usage of one Config / Environment
        entry. Declared so a generated client deserialises
        `detailedStatistics`; Confeature never sends an item.
      required:
        - configId
        - configName
        - date
        - environmentId
        - environmentName
        - productId
        - productName
        - requestCount
        - responseKiloBytes
        - sdk
        - sdkKey
      properties:
        date:
          type: string
          format: date-time
        productId:
          type: string
          format: uuid
        productName:
          type: string
        configId:
          type: string
          format: uuid
        configName:
          type: string
        environmentId:
          type: string
          format: uuid
          nullable: true
        environmentName:
          type: string
        sdk:
          type: string
        sdkKey:
          type: string
        requestCount:
          type: integer
          format: int64
        responseKiloBytes:
          type: number
          format: double
    UsagePlanLimits:
      type: object
      description: >
        The plan limits the Organization's creates and formula writes are held
        to, as enforcement applies them: `null` is unlimited, which is every
        limit when plan limits do not apply to the Organization (billing off on
        the deployment, or a system Organization). Confeature extension.
      required:
        - products
        - seats
        - flagsPerProduct
        - environmentsPerProduct
        - segmentsPerProduct
        - targetingRulesPerFlag
        - percentageOptionsPerFlag
      properties:
        products:
          type: integer
          nullable: true
          description: Products per Organization.
        seats:
          type: integer
          nullable: true
          description: Members plus pending invitations per Organization.
        flagsPerProduct:
          type: integer
          nullable: true
          description: Feature flags and settings per Product.
        environmentsPerProduct:
          type: integer
          nullable: true
          description: Environments per Product.
        segmentsPerProduct:
          type: integer
          nullable: true
          description: Segments per Product.
        targetingRulesPerFlag:
          type: integer
          nullable: true
          description: Targeting rules in one setting value.
        percentageOptionsPerFlag:
          type: integer
          nullable: true
          description: Percentage options in one targeting rule.
    UsageCounts:
      type: object
      description: >
        The live counts the limits are compared with: Organization-wide
        products and seats, and per Product its feature flags, environments and
        segments (every Product, with 0 when it has none). Confeature
        extension.
      required: [products, seats, flags, environments, segments]
      properties:
        products:
          type: integer
          minimum: 0
        seats:
          type: integer
          minimum: 0
        flags:
          type: array
          items:
            $ref: "#/components/schemas/UsageProductCount"
        environments:
          type: array
          items:
            $ref: "#/components/schemas/UsageProductCount"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/UsageProductCount"
    UsageProductCount:
      type: object
      description: One Product's count of one dimension. Confeature extension.
      required: [productId, name, count]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        count:
          type: integer
          minimum: 0
    OrganizationLimitations:
      type: object
      description: >
        ConfigCat's `OrganizationLimitations`: the limits the Organization's
        feature flag values and targeting are held to. The fields shared with
        `FeatureFlagLimitations` are its values for the same Organization.
        `maxPredefinedVariations` is Confeature's technical maximum, 100, the
        same for every plan.
      required:
        - maxPercentageOptionCount
        - maxTargetingRuleCount
        - maxComparisonValueLength
        - maxComparisonValueListLength
        - maxComparisonValueListItemLength
        - maxStringFlagValueLength
        - maxConditionPerTargetingRuleCount
        - maxPredefinedVariations
      properties:
        maxPercentageOptionCount:
          type: integer
          format: int32
        maxTargetingRuleCount:
          type: integer
          format: int32
        maxComparisonValueLength:
          type: integer
          format: int32
        maxComparisonValueListLength:
          type: integer
          format: int32
        maxComparisonValueListItemLength:
          type: integer
          format: int32
        maxStringFlagValueLength:
          type: integer
          format: int32
        maxConditionPerTargetingRuleCount:
          type: integer
          format: int32
        maxPredefinedVariations:
          type: integer
          format: int32
    MeModel:
      type: object
      description: >
        Response shape for GET /v1/me. ConfigCat parity (me-model.ts).
        Returns ONLY identity — org membership is discovered via GET
        /v1/organizations. Confeature v1 derives `fullName` from the
        user's email local part until a profile-editing feature lands.
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
    AuditLogItemModel:
      type: object
      additionalProperties: false
      required: [auditLogId, auditLogDateTime, auditLogTypeEnum]
      description: >
        A single config-plane change in a product's audit log.
        Mirrors ConfigCat's audit-log item shape: the structured `before`/
        `after` snapshots + `configId`/`environmentId` are Confeature-only
        additive members carried for the back-office diff view + the
        Release Guardian rollback.
      properties:
        auditLogId:
          type: integer
          format: int64
        auditLogDateTime:
          type: string
          format: date-time
        auditLogType:
          type: string
          nullable: true
        auditLogTypeEnum:
          $ref: "#/components/schemas/AuditLogType"
        userEmail:
          type: string
          nullable: true
        userName:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
        where:
          type: string
          nullable: true
        why:
          type: string
          nullable: true
        # Additive Confeature-only members (ConfigCat clients ignore them):
        before:
          nullable: true
          description: Structured pre-change snapshot (Confeature extension).
        after:
          nullable: true
          description: Structured post-change snapshot (Confeature extension).
        configId:
          type: string
          format: uuid
          nullable: true
        environmentId:
          type: string
          format: uuid
          nullable: true
    AuthEventModel:
      type: object
      additionalProperties: false
      required: [eventType, createdAt]
      description: >
        A single auth-plane event in the caller's own account-security activity
        Management-plane only (no ConfigCat equivalent). The
        shape carries NO secret value (token plaintext / hash / password) and NO
        other user's id — it is the caller's own security context, exposed only
        to them.
      properties:
        eventType:
          $ref: "#/components/schemas/AuthEventType"
        createdAt:
          type: integer
          format: int64
          description: Unix ms timestamp of the event.
        ip:
          type: string
          nullable: true
          description: Originating IP (CF-Connecting-IP, or "unknown").
        userAgent:
          type: string
          nullable: true
          description: Originating request User-Agent.
        actorType:
          type: string
          enum: [user, management_token, system]
          description: The kind of identity that performed the action.
        actorLabel:
          type: string
          nullable: true
          description: Denormalized non-secret actor label (email / token name).
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Non-secret detail for the event (e.g. a token label/id, the OAuth
            provider name). NEVER contains a secret value.
    AuthEventType:
      type: string
      description: >
        The enumerated kind of auth-plane event. Extensible —
        a migration client deserializes an unknown future value as the raw
        string.
      enum:
        - session_login
        - session_logout
        - oauth_sign_in
        - oauth_linked
        - oauth_unlinked
        - cli_device_approved
        - cli_device_denied
        - cli_token_minted
        - cli_token_revoked
        - management_token_minted
        - management_token_revoked
        - public_api_credential_created
        - public_api_credential_revoked
        - invite_accepted
        - password_reset
    AuditLogType:
      type: string
      description: >
        ConfigCat audit log event type. Lists ConfigCat's full enum verbatim
        (incl. its own casing inconsistencies) for migration-client
        deserializer safety, PLUS the additive Confeature values
        `configPublished` and `settingTargetingRulesChanged` (a change to a
        value's targeting rules, its sensitive comparison values redacted;
        ConfigCat records it under `settingValueChanged`). Confeature's emitter
        only produces the config-plane subset it supports.
      enum:
        - productCreated
        - productChanged
        - productOwnershipTransferred
        - productDeleted
        - productsReordered
        - teamMemberInvited
        - teamMemberInvitationRevoked
        - teamMemberJoined
        - teamMemberPermissionGroupChanged
        - teamMemberRemoved
        - teamMemberLeft
        - teamMemberInvitationChanged
        - teamMemberInvitationResent
        - teamMemberInvitationRejected
        - configCreated
        - configChanged
        - configDeleted
        - configsReordered
        - environmentCreated
        - environmentChanged
        - environmentDeleted
        - environmentsReordered
        - settingCreated
        - settingChanged
        - settingDeleted
        - settingsReordered
        - settingValueChanged
        - predefinedVariationsChanged
        - webHookCreated
        - webHookChanged
        - webHookDeleted
        - subscriptionChanged
        - permissionGroupCreated
        - permissionGroupChanged
        - permissionGroupDeleted
        - permissionGroupDefault
        - apiKeyAdded
        - apiKeyRemoved
        - integrationAdded
        - integrationChanged
        - integrationRemoved
        - apiKeyConnected
        - integrationLinkAdded
        - integrationLinkRemoved
        - organizationAdded
        - organizationRemoved
        - organizationChanged
        - organizationSubscriptionTypeChanged
        - organizationAdminChanged
        - organizationAdminLeft
        - organizationAdminDisabled2FA
        - tagAdded
        - tagChanged
        - tagRemoved
        - settingTagAdded
        - settingTagRemoved
        - publicApiAccessTokenAdded
        - publicApiAccessTokenRemoved
        - domainAdded
        - domainVerified
        - domainRemoved
        - domainSamlConfigured
        - domainSamlDeleted
        - autoProvisioningConfigurationChanged
        - organizationMemberJoined
        - organizationMemberProductJoinRequested
        - organizationMemberProductJoinRequestRejected
        - organizationMemberProductJoinRequestApproved
        - codeReferencesUploaded
        - codeReferenceDeleted
        - codeReferenceStaleBranchDeleted
        - segmentCreated
        - segmentChanged
        - segmentDeleted
        - webhookSigningKeyDeleted
        - webhookSigningKeyCreated
        # --- Confeature additive extension (no ConfigCat equivalent) ---
        - configPublished
        - settingTargetingRulesChanged
    # ── Release Guardian — management-plane component shapes.
    #    `before`/`after`/`current` are arbitrary JSON values: modelled with the
    #    concrete `{}` (empty schema = "any JSON") + `nullable: true`, NOT a bare
    #    z.unknown()-equivalent that collapses codegen. ──────────────────────────
    GuardianEventStatus:
      type: string
      enum: [open, acknowledged, rolled_back, dismissed]
    CreateGuardianIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
          nullable: true
          description: null = product-wide.
        outboundWebhookUrl:
          type: string
          nullable: true
          description: SSRF-validated (https, allowlisted provider).
        correlationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
    UpdateGuardianIntegrationRequest:
      type: object
      additionalProperties: false
      description: Partial update — every member is optional.
      properties:
        environmentId:
          type: string
          format: uuid
          nullable: true
          description: null = product-wide.
        outboundWebhookUrl:
          type: string
          nullable: true
          description: SSRF-validated (https, allowlisted provider).
        correlationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        enabled:
          type: boolean
    GuardianIntegration:
      type: object
      additionalProperties: false
      required: [integrationId, productId, correlationWindowSeconds, enabled, createdAt]
      properties:
        integrationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
          nullable: true
        outboundWebhookUrl:
          type: string
          nullable: true
        correlationWindowSeconds:
          type: integer
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
    GuardianIntegrationCreated:
      allOf:
        - $ref: "#/components/schemas/GuardianIntegration"
        - type: object
          required: [webhookUrl]
          properties:
            webhookUrl:
              type: string
              description: >
                The full inbound URL with the plaintext token,
                `https://hooks.confeature.io/v1/guardian/webhooks/{token}` —
                returned ONCE, never again.
    GuardianChangeSummary:
      type: object
      description: A summary of a suspect/candidate audit_log change (no error data).
      additionalProperties: false
      properties:
        auditLogId:
          type: integer
          format: int64
        action:
          type: string
        settingKey:
          type: string
          nullable: true
        before:
          type: object
          nullable: true
          additionalProperties: true
          description: The change's prior value — an arbitrary JSON value.
        after:
          type: object
          nullable: true
          additionalProperties: true
          description: The change's new value — an arbitrary JSON value.
        changedBy:
          type: string
          nullable: true
        changedAt:
          type: integer
          format: int64
        rollbackable:
          type: boolean
          description: true only for flag-value changes.
    GuardianEvent:
      type: object
      additionalProperties: false
      required: [eventId, productId, receivedAt, status, signalCount, candidates]
      properties:
        eventId:
          type: integer
          format: int64
        productId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
          nullable: true
        receivedAt:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/GuardianEventStatus"
        signalCount:
          type: integer
        suspect:
          allOf:
            - $ref: "#/components/schemas/GuardianChangeSummary"
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GuardianChangeSummary"
    # A flat superset of GuardianEvent, deliberately NOT `allOf: [GuardianEvent, …]`:
    # GuardianEvent is `additionalProperties: false`, so an allOf extension could
    # never validate an instance carrying `servedValueChanged`; and the pinned
    # oasdiff breaking gate reads an allOf-wrapped 200 as every GuardianEvent
    # property removed. Keep the members below in lock-step with GuardianEvent.
    GuardianRollbackResult:
      type: object
      additionalProperties: false
      description: >
        A rollback's answer: the updated event (the GuardianEvent shape), plus
        whether SDKs are now served the restored value.
      required:
        [eventId, productId, receivedAt, status, signalCount, candidates, servedValueChanged]
      properties:
        eventId:
          type: integer
          format: int64
        productId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
          nullable: true
        receivedAt:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/GuardianEventStatus"
        signalCount:
          type: integer
        suspect:
          allOf:
            - $ref: "#/components/schemas/GuardianChangeSummary"
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GuardianChangeSummary"
        servedValueChanged:
          type: boolean
          description: >
            true when the value SDKs are served was restored. false when the
            rollback changed the draft value only — the suspect change was
            never served, a later publish superseded it, or the environment's
            published snapshot could not be read.
    GuardianValueChanged:
      type: object
      description: >
        409 body of a rollback — the flag's current value no longer equals the
        suspect change's new value, so a rollback would overwrite a newer
        change. Retry with `force: true` to override.
      required: [error, message, current]
      properties:
        error:
          type: string
          enum: [value_changed_since]
        message:
          type: string
        current:
          description: The flag's current (draft) value — an arbitrary JSON value, or null.
        published:
          description: >
            The value SDKs are served for the flag — an arbitrary JSON value.
            Present only when the flag is published in this environment.
    CliDeviceAuthorizeRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 200
          description: >
            Optional display name (e.g. the host name) shown beside the minted
            CLI token in the dashboard token list. A display nicety, NEVER an
            auth input.
      description: Request body for POST /v1/cli/device/authorize (bodiless POST accepted).
    CliDeviceAuthorizeResponse:
      type: object
      additionalProperties: false
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - interval
        - expires_in
      properties:
        device_code:
          type: string
          description: The CLI-held credential for the poll. Its SHA-256 hash is stored; the plaintext is not.
        user_code:
          type: string
          description: Short, human-readable code the user reads / types on the approval page (e.g. WDJB-MJHT).
        verification_uri:
          type: string
          description: The session-gated approval page URL on the back-office app origin.
        verification_uri_complete:
          type: string
          description: The verification URI with ?user_code= pre-filled.
        interval:
          type: integer
          description: Minimum poll interval in seconds (RFC 8628).
        expires_in:
          type: integer
          description: Seconds until the device + user codes expire.
      description: RFC 8628 device-authorization response.
    CliDeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code:
          type: string
      description: Request body for POST /v1/cli/device/token — the device_code IS the credential.
    CliDeviceTokenSuccess:
      type: object
      additionalProperties: false
      required: [access_token, token_type, identity]
      properties:
        access_token:
          type: string
          description: The minted CLI token plaintext — returned ONCE, stored only as a hash server-side.
        token_type:
          type: string
          enum: ["bearer"]
        identity:
          type: object
          additionalProperties: false
          required: [user, org]
          properties:
            user:
              type: string
              description: The approving user's email.
            org:
              type: string
              description: The active org id the token is scoped to.
      description: Successful poll — the minted token + the identity it acts as.
    CliDeviceTokenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "authorization_pending"
            - "slow_down"
            - "expired_token"
            - "access_denied"
            - "bad_request"
        message:
          type: string
      description: >
        RFC 8628 poll error envelope. `bad_request`, with a `message`, is the
        same-origin guard's, when the poll carried a Confeature cookie and a
        body that is not JSON (#1166). NEVER carries a token — an unknown /
        expired / denied / pending code yields the appropriate error here, never
        account data (auth separation).
    CliDeviceDecisionRequest:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code:
          type: string
      description: Request body for POST /v1/cli/device/approve and /deny.
    CliDeviceDecisionResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      description: Acknowledgement of a successful approve / deny.
    CliLogoutResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      description: Acknowledgement of an idempotent CLI-token revoke.
    CliTokenSummary:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        createdAt:
          type: integer
        lastUsedAt:
          type: integer
          nullable: true
        revokedAt:
          type: integer
          nullable: true
      description: >
        One CLI login in the dashboard revoke list (owner-scoped). NEVER carries
        the token hash or plaintext.
    CliTokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/CliTokenSummary"
      description: The session user's own CLI logins.
    CreatePublicApiCredentialRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: A name the owner recognises the credential by (e.g. "Kill switch").
      description: Request body for POST /v1/public-api-credentials.
    PublicApiCredentialCreated:
      type: object
      additionalProperties: false
      required: [id, username, password, label, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
          description: >
            The HTTP Basic user-id, `cfapi_` and 22 url-safe characters. Not a
            secret: it is shown in the credential list. Never contains a colon.
        password:
          type: string
          description: >
            The HTTP Basic password, `cfapi_secret_` and 43 url-safe characters.
            Shown in this response only; the server keeps its hash.
        label:
          type: string
        createdAt:
          type: integer
          description: Unix milliseconds.
      description: >
        A freshly minted Public API credential. The only body that ever carries
        the password.
    PublicApiCredentialSummary:
      type: object
      additionalProperties: false
      required: [id, username, label, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: string
        username:
          type: string
        label:
          type: string
        createdAt:
          type: integer
          description: Unix milliseconds.
        lastUsedAt:
          type: integer
          nullable: true
          description: Unix milliseconds, refreshed at most every 5 minutes.
        revokedAt:
          type: integer
          nullable: true
          description: Unix milliseconds; set once the credential is revoked.
      description: >
        One Public API credential in the owner's list. NEVER carries the
        password or its hash.
    PublicApiCredentialList:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/PublicApiCredentialSummary"
      description: The session user's own Public API credentials, newest first.
    McpAuthorizeApproveRequest:
      type: object
      additionalProperties: false
      required: [state, client_id, scope]
      properties:
        state:
          type: string
          description: >
            The opaque CSRF state that binds the dashboard consent decision to
            the MCP server's `mcp:authreq:{state}` KV record carrying the parsed
            OAuth request.
        client_id:
          type: string
          description: The registered MCP client id the authorization is for (must match the authreq).
        scope:
          type: string
          description: The OAuth scope string the client requested.
      description: Request body for POST /v1/mcp/authorize/approve.
    McpAuthorizeDenyRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          description: The opaque CSRF state identifying the pending authorization to decline.
      description: Request body for POST /v1/mcp/authorize/deny.
    McpAuthorizeRedirectResponse:
      type: object
      additionalProperties: false
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
          description: >
            The MCP server's callback URL the browser is sent to. On approve it
            carries a one-time `code` (the bridged token travels separately via
            delete-on-read KV, NEVER in this URL); on deny it carries
            `error=access_denied`. NEVER contains the token plaintext.
      description: >
        The callback URL the MCP server completes (or aborts) the OAuth grant with.
        Returned by both /approve and /deny.
    McpToken:
      type: object
      additionalProperties: false
      required: [id, oauthClientId, createdAt, revoked]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        oauthClientId:
          type: string
          nullable: true
          description: The registered MCP client (Claude / Cursor / …) this credential was minted for.
        createdAt:
          type: integer
          description: Unix ms.
        lastUsedAt:
          type: integer
          nullable: true
          description: Unix ms of the last (debounced) use, or null if never used.
        revoked:
          type: boolean
          description: Derived from `revoked_at` being non-null.
        expiresAt:
          type: integer
          nullable: true
          description: Unix ms the sliding-30-day standing expiry currently lapses at.
      description: >
        One MCP connection credential in the dashboard revoke list (owner-scoped).
        NEVER carries the token hash, the plaintext, or the grant id.
    McpTokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/McpToken"
      description: The session user's own MCP connection credentials.
tags:
  - name: Auth
    description: >
      Real-user authentication for the back-office. Email + password
      core in v0.1, with an SSO-ready provider interface for future
      Okta / Google Workspace / Azure AD / GitHub OAuth plugins.
      Management tokens remain the parallel M2M / CLI credential —
      see the `bearerAuth` security scheme.
  - name: Me
    description: >
      Authenticated user identity endpoint (ConfigCat parity — `GET
      /v1/me`). Returns the minimal `MeModel` (email + fullName) for
      drop-in compatibility with ConfigCat-generated clients. Confeature
      additionally exposes a richer `/v1/auth/me` (under the `Auth` tag)
      that returns the full `User` shape with creation timestamp + session
      metadata.
  - name: Organizations
    description: >
      Multi-tenant organization surface (ConfigCat parity). Organizations
      are the canonical unit of ownership across the back-office data plane.
      It lists the orgs the user belongs to, lists the members of one org,
      removes a member from one org, reads the active org via `/v1/me`, and
      reads an org's limitations.
      Cross-org access on `{organizationId}` routes returns 404 generic —
      no existence enumeration. Schema names mirror ConfigCat's
      `OrganizationModel`, `OrganizationAdminModel`,
      `OrganizationMemberModel`, `OrganizationMembersModel` byte-for-byte.
  - name: Usage&Quota
    description: >
      ConfigCat's usage and quota read: an Organization's usage against its
      plan's limits. Confeature meters capacity (products, seats, flags,
      environments, segments, targeting counts), never evaluation requests.
  - name: Guardian
    description: >
      Release Guardian — a Confeature differentiator with
      no ConfigCat counterpart. Correlates an inbound error-spike signal
      (POSTed to an unguessable token-auth webhook) with recent flag-value
      changes and offers a one-click rollback. Management plane ONLY: nothing
      here enters the SDK eval wire (`config_v6` / `ConfigV6`). The inbound
      webhook is token-auth (the path token IS the authentication, mirroring
      the billing webhook split); every other route is scope-guarded
      (`guardian:read` / `guardian:write`) with a generic-404 cross-org gate.
  - name: CLI Auth
    description: >
      CLI browser device-flow login — an RFC 8628 device
      authorization grant. `confeature login` requests a device + user code,
      opens the browser to a session-gated approval page, and polls until the
      signed-in user approves; the poll then mints a long-lived, revocable,
      USER-scoped bearer (the `cli-token` source — org-scoped like a session,
      NOT a platform-admin management token). Management plane ONLY: nothing
      here enters the SDK eval wire (`config_v6` / `ConfigV6`). Auth separation:
      the public authorize / token endpoints never read account data
      and only yield a token AFTER an authenticated cookie-session approval.
  - name: Public API Credentials
    description: >
      User-bound Public API credentials: the username / password pairs a
      ConfigCat-compatible client (CLI, Terraform, MCP server, the management
      kill switch) sends as HTTP Basic (`basicAuth`) to the management API.
      A credential acts as its owner, org-scoped to the owner's current
      membership and role, never more. Minted, listed and revoked by the owner
      over a cookie session only (ConfigCat manages them on its dashboard and
      has no API for them). The password is shown once and stored hashed.
  - name: Code References
    description: >
      ConfigCat's code references: the reports the code scanner
      (`configcat scan --upload`) uploads, listed per Feature Flag or Setting
      and deleted per repository. Management plane only: nothing here enters
      the SDK eval wire (`config_v6` / `ConfigV6`).
  - name: MCP Auth
    description: >
      Dashboard consent endpoints for the remote MCP server
      (`mcp.confeature.io`). Because `__Host-cfsession` is host-locked to
      `app.confeature.io`, the MCP server's OAuth `/authorize` step redirects to a
      session-gated dashboard consent page that calls these endpoints. On
      approve, the API mints a bridged, org-scoped `mcp_token` (the `mcp-token`
      source — org-scoped like a session, NOT a platform-admin management token)
      and hands it to the MCP server via a short-TTL, delete-on-read KV record; the
      response NEVER carries the token plaintext. Management plane ONLY:
      nothing here enters the SDK eval wire (`config_v6` / `ConfigV6`). The
      OAuth/MCP protocol wire (authorize/token/register/`/mcp`) is served by
      the MCP server via standard libraries and is intentionally NOT part of this
      management contract.
