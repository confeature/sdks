              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Segment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateSegment
      summary: Update a segment
      description: >
        Updates a segment: a field that is absent or null keeps its value.
        The edit goes live, with no publish call, in every environment whose
        targeting rules reference the segment — at most 500 (config,
        environment) pairs; a segment used by more is refused with a 400
