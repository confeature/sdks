          description: The segment was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentModel"
        "400":
          description: >
            A field outside ConfigCat's bounds, a list longer than maxComparisonValueListLength or with an item longer than maxComparisonValueListItemLength, or a comparison value its comparator cannot read (a number or a semantic version). The message names the field, never the value. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks segment:write, or it is a management token without config:publish. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 512 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
