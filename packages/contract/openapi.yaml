            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembersModel"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "404":
          description: >
            Organization not found OR the authenticated user is not a
            member. Generic envelope — no enumeration of which case
            triggered the 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/organizations/{organizationId}/members/{userId}:
    delete:
      operationId: deleteOrganizationMember
      summary: Delete Member from Organization
      description: >
        This endpoint removes a Member identified by the `userId` from the
        given Organization identified by the `organizationId` parameter.
        ConfigCat's `delete-organization-member`, in this contract's camelCase
        operationId convention. `userId` is a UUID here, where ConfigCat
        declares a plain string, because every Confeature user id is one (see
        `OrganizationMemberModel.userId`).

        The caller is an admin of this Organization, acting in it with any
        credential type, or a management token. Either needs the `member:write`
        scope. In the founder Organization, the one that runs the Confeature
        service itself, the caller must be a platform operator (see the `403`).

        The removal is one atomic write and binds on the next request. In this
        Organization, the pending invitations the Member issued, and those
        addressed to their email (compared case-insensitively), are deleted.
        Another Organization's invitation to that email is not touched.
        If this was the Member's only Organization, their account is deleted
        too, which ends every session and credential they hold and lets their
        email be invited again. A Member of another Organization keeps the
        account and that Organization, and loses their sessions in this one.
        Removing a Member of the founder Organization also revokes the
        management tokens recorded as theirs, and deletes the pending
        invitations issued through any of those tokens, including one already
        revoked. A token records as its owner the user whose dashboard session
        minted it or, when a token minted it, that token's owner if it has one.
        A token from before owners were recorded has one only if its mint from
        a session is on record, so a token that a token minted back then has
        none, even when its parent does. A token with no recorded owner, which
        includes one seeded outside the API, is not revoked.

        If the Organization's billing customer has the removed Member's email
        (compared case-insensitively), that email is replaced by the address of
        the Organization's oldest remaining admin, the one who joined it first.
        This runs asynchronously, normally within minutes of the removal, and
        is retried while the billing provider is unavailable. The removal's
        outcome and its response do not depend on the billing provider. Any
        other email on the billing customer stays, whoever set it. This does not
        cover extra billing recipients set in the billing provider's dashboard,
        or invoices already issued.
      tags: [Organizations]
      parameters:
        - in: path
          name: organizationId
          required: true
          description: The identifier of the Organization.
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          description: The identifier of the Member.
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "204":
          description: When the delete was successful.
        "400":
          description: >
            Bad request. A path parameter is not a UUID, or the Member is the
            Organization's last admin, whom nobody can remove: an Organization
            always keeps an admin. Nothing is changed.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: >
            Forbidden. `insufficient_scope`: the management token lacks
            `member:write`. `forbidden`: the caller acts in this Organization
            and is not its admin, removing themself included; or this is the
            founder Organization and the caller is not a platform operator,
            meaning a dashboard session of that Organization's admin, or a
            management token. Nothing is changed. ConfigCat's swagger lists no
            `403` on this operation; Confeature adds it so that a caller who can
            list this Organization's Members is told they lack the right, not
            that the Member does not exist. A caller outside the Organization
            gets the `404`.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Organization not found, the caller does not act in it, OR the user
            is not one of its Members. Generic envelope — no enumeration of
            which case triggered the 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/organizations/{organizationId}/invitations:
    get:
      operationId: listInvitations
      summary: List the invitations of an Organization.
      description: >
        Returns the invitations of the specified Organization as a bare
        array of InvitationModel objects (possibly empty). Cross-organization
        access (the authenticated user is not a member of {organizationId})
        returns the generic 404 envelope — byte-identical to a request for a
        non-existent organizationId. NO 403 (existence-enumeration
        mitigation). A management token may list any Organization's
        invitations.
      tags: [Invitations]
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: The list of the Organization's invitations (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationModel"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "404":
          description: >
            Organization not found OR the authenticated user is not a
            member. Generic envelope — no enumeration of which case
            triggered the 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/organizations/{organizationId}/usage-and-quota:
    get:
      operationId: getOrganizationUsageAndQuota
      summary: Get usage and quota
      description: >
        ConfigCat's `get-organization-usage-and-quota`: the Organization's
        usage against its plan, so a client copying settings in bulk reads how
        many it may still create with the credential that will create them
        (the pre-flight read). The ConfigCat fields are present and typed, and
        three of them diverge on purpose, because Confeature does not meter
        evaluation requests (its plans have unlimited evaluations):
        `millionRequestLimitPerMonth` and `networkTrafficGigaByteLimitPerMonth`
        are 2147483647, the int32 maximum, meaning unlimited in a field that
        cannot be null; `organizationStatistics`, `productStatistics` and
        `detailedStatistics` are always empty; `hasConnectedApplication` is
        always false. Plausible numbers would be worse than these. Confeature
        adds `plan`, `limits` and `usage`: the figures plan enforcement
        holds the Organization's creates to, with `null` meaning unlimited.
        For a product, the settings it may still create are
        `limits.flagsPerProduct` minus that product's `usage.flags` count; a
        concurrent create can still win the race, so a create past the limit
        is still refused with a 402. Reading this never counts against a
        limit and never answers 402. A dashboard session, a cli-token or a
        Public API credential reads only the organization it acts in; any other
        `organizationId` is the generic 404, the same as one that does not
        exist. A management token reads any Organization with the
        `product:read` scope, ConfigCat's per-product statistics permission;
        its creates land in the founder Organization, which plan limits do not
        hold, so the limits it reads for another Organization understate what
        it may create.
      tags: [Usage&Quota]
      parameters:
        - in: path
          name: organizationId
          required: true
          description: The identifier of the Organization.
          schema:
            type: string
            format: uuid
        - in: query
          name: productId
          required: false
          description: >
            The identifier of the Product to filter statistics for: the
            per-product `usage` arrays then hold that Product only. A Product
            outside the Organization is the generic 404.
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: The Organization's usage and quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatisticsV2Model"
        "400":
          description: The `organizationId` or `productId` is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: The management token lacks the `product:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            The Organization (or the `productId`) does not exist, or the caller
            does not act in it. Generic envelope: the two cases are
            indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/organizations/{organizationId}/organization-limitations:
    get:
      operationId: getOrganizationLimitations
      summary: Get Organization limitations
      description: >
        ConfigCat's `get-organization-limitations`: the limits the
        Organization's feature flag values and targeting are held to. Every
        field shared with `FeatureFlagLimitations` is the value a v2 setting
        value read reports for the same Organization, from the one source. A
        count the plan leaves unlimited reports the technical maximum, the
        largest a write can hold anyway, because every field is a required
        integer. `maxPredefinedVariations` is Confeature's technical maximum,
        100, the same for every plan. Reading this never answers 402. Credentials
        and the 404 rule are those of `getOrganizationUsageAndQuota`.
      tags: [Organizations]
      parameters:
        - in: path
          name: organizationId
          required: true
          description: The identifier of the Organization.
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: The Organization's limitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationLimitations"
        "400":
          description: The `organizationId` is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: The management token lacks the `product:read` scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            The Organization does not exist, or the caller does not act in it.
            Generic envelope: the two cases are indistinguishable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/invitations/{invitationId}:
    get:
      operationId: getInvitation
      summary: Get the metadata of an Invitation.
      description: >
        Returns a single InvitationModel by its identifier. An invitation
        that does not exist OR that belongs to another Organization returns
        the generic 404 envelope — byte-identical for both cases (no
        existence enumeration). NO 403. A management token may read any
        invitation.
      tags: [Invitations]
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: The requested invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationModel"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "404":
          description: >
            Invitation does not exist OR belongs to another Organization.
            Generic envelope — no enumeration of which case triggered the
            404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteInvitation
      summary: Revoke a pending Invitation.
      description: >
        Revoke a pending Invitation, removing it permanently. Only pending
        invitations can be revoked; a redeemed invitation, an invitation
        belonging to another Organization, and a non-existent invitationId
        all return the same generic 404 (anti-enumeration). After a
        successful revoke the invitation's token can no longer be redeemed.
        Revoking needs the `member:write` scope and, in the founder
        Organization, the one that runs the Confeature service itself, a
        platform operator (see the `403`).
      tags: [Invitations]
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "204":
          description: >
            The pending invitation was revoked. No content — a revoked
            invitation ceases to exist; there is no model to return.
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: >
            Forbidden. `insufficient_scope`: the management token lacks
            `member:write`. `forbidden`: the caller acts in the founder
            Organization and is not a platform operator, meaning a dashboard
            session of that Organization's admin, or a management token. Nothing
            is changed. ConfigCat's swagger lists no `403` on `delete-invitation`;
            Confeature adds it because only the caller lacks the right. A caller
            outside that Organization gets the `404`.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            The invitation is not a pending invitation visible to the
            caller — it does not exist, has already been redeemed, or
            belongs to another Organization. Generic envelope,
            byte-identical for every case (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/products/{productId}/auditlogs:
    get:
      operationId: getProductAuditLogs
      summary: List a product's config-plane change history (newest-first).
      tags: [Audit logs]
      security:
        - bearerAuth: []
        - basicAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: productId
