openapi: 3.1.0
info:
  title: Confeature API
  version: 0.6.0
  description: >
    Confeature's API. This file is the single source of truth — every Worker
    and every SDK imports types generated from this document.

    The resource hierarchy mirrors ConfigCat's public API: a
    Product owns one or more Configs and one or more Environments. Each
    Config owns one or more Settings. SDK keys hang off a (Config,
    Environment) pair. Setting values can be overridden per environment;
    when no override exists, the setting's default value applies.

    Two deliberate divergences from ConfigCat are documented inline in this
    file:
      1. Settings are addressed by (configId, key) instead of a synthetic
         numeric settingId — our keys are immutable so the URL is stable.
         This carries over to per-environment value endpoints, which use
         (configId, key) rather than ConfigCat's numeric settingId. The v2
         value routes (#880) use ConfigCat's numeric settingId, as ConfigCat.
      2. An explicit POST /v1/configs/{configId}/publish endpoint exists
         until value writes auto-materialise to KV. Setting-value writes do
         NOT auto-publish in this version.
  contact:
    name: MakerLabs
    url: https://confeature.io
servers:
  - url: https://api.confeature.io
    description: Production management API
  - url: https://cdn.confeature.io
    description: Production eval read path
paths:
  /v1/auth/bootstrap:
    post:
      operationId: authBootstrap
      summary: Create the first admin user (one-shot)
      description: >
        Single-use endpoint that creates the first admin user on a fresh
        Confeature deployment. The pre-shared bootstrap
        token is presented via the `X-Bootstrap-Token` header. Once the
        `users` table is non-empty, this endpoint MUST respond 410 gone
        for every subsequent call regardless of token validity.
      tags: [Auth]
      parameters:
        - name: X-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
          description: Plaintext bootstrap token; compared constant-time to BOOTSTRAP_TOKEN_HASH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, minLength: 5, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "201":
          description: Admin user created; bootstrap endpoint is now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Bootstrap token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "410":
          description: Bootstrap already consumed (users table is non-empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/login:
    post:
      operationId: authLogin
      summary: Sign in with email + password
      description: >
        Verifies the credential and, on success, issues a session cookie
        (`__Host-cfsession`, HttpOnly, Secure, SameSite=Lax, Path=/,
        Max-Age=604800). The cookie value is opaque; revocation is
        server-side via POST /v1/auth/logout. Failures return the SAME
        shape and timing whether the email does not exist or the password
        is wrong (auth-side enumeration defence). Failed passwords are
        budgeted per IP and per address, and over budget the attempt is
        refused before verification.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 5
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                  writeOnly: true
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Sign-in succeeded; session cookie set in headers.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Malformed request body (e.g. not an email, or an empty password). Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Wrong email OR wrong password (indistinguishable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyPasswordAttempts"
        "503":
          $ref: "#/components/responses/PasswordCheckUnavailable"
  /v1/auth/signup:
    post:
      operationId: authSignup
      summary: Create an account and sign in
      description: >
        Confeature-original endpoint: ConfigCat's public API has no account
        creation (its sign-up is a dashboard flow), so no parity drift exists
        to violate. Creates the user in a new private organization and, on
        success, issues the same session cookie as /v1/auth/login. Rate
        limited per client IP. Every failure (an email already registered,
        the rate limit, a storage error) answers the SAME 409 body, and a
        malformed body answers that body with a 400, so the response never
        reveals whether an account exists.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "201":
          description: Account created; session cookie set in headers.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >
            Malformed request body. Same body as the 409. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupError"
        "409":
          description: >
            Sign-up could not complete: a duplicate email, the rate limit, or
            a transient failure, indistinguishable on purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupError"
  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: Sign out and revoke the current session
      description: >
        Deletes the session record for the cookie carried on the request,
        then clears the cookie client-side. Idempotent: calling logout
        without a session still returns 204.
      tags: [Auth]
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "204":
          description: Session deleted (if present); cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=; Max-Age=0; HttpOnly; Secure; SameSite=Lax; Path=/
  /v1/auth/me:
    get:
      operationId: authMe
      summary: Return the currently authenticated user
      description: >
        Returns the User record associated with the request's session
        credential (cookie or management token). For a
        cookie session the response additionally carries a `methods`
        object describing which sign-in methods are connected to the
        account — `password` (a password is set) and `google` (a Google
        identity is linked). The field is additive and backward-compatible.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: Currently authenticated user, with connected methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeWithMethods"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/session:
    get:
      operationId: authSession
      summary: Probe the current session (always 200)
      description: >
        Public session probe used by the back-office bootstrap.
        ALWAYS returns 200: `authenticated` is the boolean session signal
        and `user` is the User record when a valid cookie session is
        present, else null. Unlike GET /v1/auth/me this endpoint NEVER
        returns 401, so the back-office can probe for a session on a public
        route (e.g. /sign-in) without surfacing a console-visible 401.
      tags: [Auth]
      responses:
        "200":
          description: Session probe result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProbe"
  /v1/auth/events:
    get:
      operationId: listAuthEvents
      summary: List the caller's own account-security activity (newest-first).
      description: >
        Returns the AUTHENTICATED CALLER'S OWN auth-plane events (sign-in/out,
        OAuth link/unlink, CLI device approve/deny, CLI + management token
        mint/revoke), newest-first. Strictly user-self-scoped:
        the read is hard-scoped `WHERE user_id = <principal.id>`, so a caller
        can NEVER see another user's events. Management-plane
        only (no ConfigCat equivalent) — additive and parity-safe. Each item is
        an `AuthEventModel` carrying NO secret value and NO other user's id.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size (default 50, max 200).
        - in: query
          name: before
          required: false
          schema:
            type: integer
            format: int64
          description: >
            Cursor — return only events strictly OLDER than this `createdAt`
            (unix ms). Omit for the newest page.
      responses:
        "200":
          description: The caller's own auth events, newest-first (bare array).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthEventModel"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/accept-invite:
    post:
      operationId: authAcceptInvite
      summary: Redeem a one-time invite and sign in
      description: >
        Confeature-original endpoint (ConfigCat's invite
        flow is not part of their public API, so no parity drift exists
        to violate). Consumes a `confeature_invite_<…>` token and a
        password, atomically creates the `users` row + issues a
        `__Host-cfsession` cookie. The invite row is DELETEd in the
        same D1 transaction that inserts the user, making the link
        single-use by construction. Expired, consumed,
        unknown, and malformed tokens all return the SAME 410 generic
        body — no token-existence enumeration.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Invite redeemed; user created; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "410":
          description: >
            Invite expired, consumed, unknown, or malformed — same generic body
            and status for all FOUR failure branches.
            This unifies what would otherwise be a 400 (token shape / password
            length) with the 410 (expired / consumed / unknown). The contract
            deliberately omits 400 here: a malformed body emerges as 410 with
            the identical generic copy so no scanner can distinguish "I
            mistyped the token" from "I guessed a once-valid token that has
            been redeemed".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/password-reset/request:
    post:
      operationId: authPasswordResetRequest
      summary: Request a password-reset link
      description: >
        Confeature-original endpoint. Accepts an email and,
        for a registered account that HAS a password, mints a single-use
        30-minute reset token and emails a reset link. An account that signs in
        through a provider instead is emailed how it signs in, with no token.
        ALWAYS returns the same generic 200 acknowledgement — for a real account, an SSO/OAuth-only
        account (no password), a non-existent account, or a rate-limited caller
        — so the endpoint cannot be used to discover which emails are
        registered (mirrors /v1/auth/login's "SAME shape and timing" defence).
        The reset token is never returned in the response and
        never logged.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 5
                  maxLength: 254
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: >
            Generic acknowledgement, identical in every case. No body field
            discloses whether an account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAck"
        "400":
          description: >
            Malformed request body (e.g. not an email). Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/password-reset/confirm:
    post:
      operationId: authPasswordResetConfirm
      summary: Complete a password reset
      description: >
        Confeature-original endpoint. Exchanges a valid,
        unexpired, unconsumed reset token plus a new password for an updated
        credential. On success the new argon2id hash is written, the token is
        consumed (single-use), the address counts as verified, and ALL of the
        account's sessions, CLI tokens, MCP tokens and Public API credentials
        are revoked, with a device sign-in approved but not yet collected. Only
        the account's own sessions and credentials end: nobody is removed from
        an organization and no invitation is withdrawn, and the notice names the
        people who joined through invitations this account sent. The user must
        sign in again with the new password. A rejected (weak)
        password does NOT consume the token, so the same link can be retried
        within its lifetime. A malformed body, a weak password, or an
        invalid/expired/consumed token all return a single uniform 400 (no
        distinction that reveals which condition failed).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 128
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  writeOnly: true
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Password changed. No session cookie is issued; sign in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAck"
        "400":
          description: >
            Malformed body, weak new password, OR an invalid/expired/consumed
            token — returned as a single uniform outcome (no distinction that
            reveals which condition failed). The token is not consumed.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/sso/{provider}/start:
    post:
      operationId: ssoStart
      summary: Begin an OIDC SSO flow for a registered provider
      description: >
        Confeature-original endpoint (ConfigCat's SSO
        sign-in endpoints are not part of their public OpenAPI, so no
        parity drift exists to violate). Mints a fresh `state`, `nonce`,
        and PKCE verifier (S256), persists the triple to KV under
        `sso:state:<state>` with a 10-minute TTL, then returns a fully-
        formed OIDC Authorization-Code-with-PKCE redirect URL the
        back-office opens in the same tab. A 404 response means the
        path-`provider` id is not registered; the body is deliberately
        generic so an attacker cannot distinguish "registry empty" from
        "unknown id".
      tags: [Auth]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
          description: The registered provider id (string slug, e.g. `corp-okta`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoStartRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Provider authorization URL minted; client opens it in the same tab.
          headers:
            Set-Cookie:
              description: >
                `__Host-cfsso`, a 10-minute cookie binding the state to this
                browser. The callback refuses a request that does not carry it.
              schema:
                type: string
                example: __Host-cfsso=<secret>; Max-Age=600; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoStartResponse"
        "404":
          description: >
            Provider id is not registered. Body is the generic SSO error
            envelope; no enumeration of empty-registry vs unknown-id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
  /v1/auth/sso/{provider}/callback:
    post:
      operationId: ssoCallback
      summary: Complete an OIDC SSO flow and issue a session cookie
      description: >
        Confeature-original endpoint (same note as `ssoStart`: no
        ConfigCat counterpart exists). Consumes the KV state
        triple atomically (read + delete), exchanges the `code` at the
        provider's token endpoint, fetches the operator's email at
        the userinfo endpoint, upserts a single `users` row by
        email-match (preserving any existing `password_hash`),
        creates a session, and sets the `__Host-cfsession` cookie
        using the same machinery as `/v1/auth/login` and
        `/v1/auth/accept-invite`. All 400-class failures (missing /
        consumed / malformed state, missing email, malformed body)
        return one bytewise-identical body. All 502-class failures
        (token endpoint down, userinfo endpoint down) return one
        bytewise-identical body. No per-branch enumeration.
      tags: [Auth]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
          description: The registered provider id (string slug, e.g. `corp-okta`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoCallbackRequest"
      responses:
        "200":
          description: >
            SSO sign-in succeeded (session cookie set), OR — for the
            consumer `google` provider when the verified email matches an
            existing PASSWORD account not yet linked — a `link_required`
            challenge (NO cookie set, NO mutation), OR — when the KV state
            record carried a `link_user_id`
            (minted by /v1/auth/link/google/start) — a `linked` envelope
            confirming the authenticated user just connected Google from the
            account page (the session is UNCHANGED; no new cookie). The
            response is a discriminated union of three shapes: the signed-in
            branch is a plain `User`; the link-required branch carries
            `status: "link_required"` + a single-use `challenge_id` + the
            matched `email`; the account-link branch carries
            `status: "linked"` + `return_to` + the updated `methods`. The
            client distinguishes account-link (go to `return_to`, toast
            "Google connected") from sign-in (a plain `User`, go to
            `/products`) on the presence of `status: "linked"`.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoCallbackResult"
        "400":
          description: >
            State missing / consumed / malformed / tampered, or started by
            another browser (no `__Host-cfsso`, or not the one its start set:
            login CSRF), or userinfo
            returned no `email`, or — for the `google` provider — the
            `email_verified` claim was absent or false, or malformed body
            — same generic body for ALL branches. No session is issued; the KV
            state entry IS consumed when present, to prevent replay.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
        "403":
          description: >
            Link-mode CSRF guard. The KV state carried a
            `link_user_id` but the request presented no valid session, or a
            session whose user id does NOT equal `link_user_id`. The link is
            bound to the session that initiated it; a mismatched/absent
            session is rejected and NOTHING is changed.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
        "409":
          description: >
            Link-mode conflict. Either the Google `email`
            does not match the authenticated account's email
            (`email_mismatch`), or the Google `sub` is already linked to a
            DIFFERENT account (`identity_conflict`), or the account is
            already linked to a different Google identity. Nothing is changed.
            Only reachable when the state carried a `link_user_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkAccountError"
        "502":
          description: >
            Provider's token endpoint or userinfo endpoint returned an
            error or was unreachable. Same generic body for BOTH
            branches. The KV state entry
            IS consumed; no users row is upserted; no session is
            issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
  /v1/auth/sso/providers:
    get:
      operationId: listSsoProviders
      summary: Discover registered SSO providers for the back-office sign-in page
      description: >
        Confeature-original endpoint (a discovery endpoint that keeps the
        back-office sign-in page provider-agnostic). Returns the public-safe
        `{ id, label }` subset of
        every entry in `CONFEATURE_SSO_PROVIDERS`. The response NEVER
        carries any secret-bearing field (`client_id`,
        `client_secret_binding`, `issuer`, `redirect_uri_origin` are
        all omitted by construction). Empty registry returns
        `{ providers: [] }` with HTTP
        200 (not 404; an empty list is a valid steady state).
      tags: [Auth]
      responses:
        "200":
          description: Public-safe list of registered SSO providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProviderListResponse"
  /v1/auth/link/google:
    post:
      operationId: authLinkGoogle
      summary: Confirm a password account and attach a pending Google identity
      description: >
        Confeature-original endpoint. The second
        leg of the no-silent-merge linking flow: the `google` callback
        verified the Google identity server-side and minted a single-use
        link challenge (returned as `challenge_id` in the callback's
        `link_required` branch). This endpoint loads the user by the
        challenge's email, verifies the supplied password with argon2id
        (timing-equalised on a wrong/unknown password), and — on success —
        spends the challenge, attaches `sso_provider_id='google'` +
        `sso_subject`, creates a session, and sets the `__Host-cfsession`
        cookie. A wrong password spends one of the challenge's 5 attempts, not
        the challenge. No token or password is ever logged.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Google linked; session cookie set. Password still valid.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: >
            Wrong password (timing-equalised against the unknown-user
            branch). No session is issued, and the same challenge may be
            retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
        "409":
          description: >
            `identity_conflict` — the account already holds another identity
            (a different Google `sub` or an enterprise provider), or the
            Google `sub` carried by the challenge is already linked to a
            different account. Nothing is written: an identity on an account
            is never silently replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
        "410":
          description: >
            The link challenge is missing, expired, already used, or just
            spent its fifth wrong password. ~10 minute TTL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
        "429":
          $ref: "#/components/responses/TooManyPasswordAttempts"
        "503":
          $ref: "#/components/responses/PasswordCheckUnavailable"
  /v1/auth/link/google/email:
    post:
      operationId: authLinkGoogleEmail
      summary: Email a link that connects the pending Google identity
      description: >
        Confeature-original endpoint. The other way out of the `link_required`
        branch, for someone who owns the address and does not know the password:
        mails the account's address a single-use link, valid 30 minutes, that
        attaches the Google identity frozen in the challenge. The challenge stays
        usable, so the password leg still works afterwards. No session cookie, no
        mutation; the link's token never appears in a response, and travels in
        the link's fragment (`/connect-google#token=…&email=…`), which a browser
        never sends to a server. The response binds the link to this browser with
        `__Host-cflink`; a newer link supersedes the older one, and a failed send
        leaves no usable link. Rate limited per address. It answers truthfully, unlike the reset request: only a holder of
        a challenge reaches it, and the callback has already said the account
        exists.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleEmailRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: The link was handed to the mail transport.
          headers:
            Set-Cookie:
              description: >
                `__Host-cflink`, 30 minutes: binds the link to this browser.
              schema:
                type: string
                example: __Host-cflink=<secret>; Max-Age=1800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleEmailAck"
        "410":
          description: The link challenge is missing or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleEmailError"
        "429":
          description: >
            `too_many_attempts` — too many links for this address in the last
            hour. Wait `Retry-After` seconds.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleEmailError"
        "503":
          description: "`email_unavailable` — the email could not be sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleEmailError"
  /v1/auth/link/google/email/confirm:
    post:
      operationId: authLinkGoogleEmailConfirm
      summary: Spend an emailed link, attach Google and sign in
      description: >
        Confeature-original endpoint. Spends the token of the link
        /v1/auth/link/google/email mailed, attaches `sso_provider_id='google'` +
        `sso_subject` from the frozen identity, creates a session and sets the
        `__Host-cfsession` cookie, but only from the browser that asked for the
        link (its `__Host-cflink`). From any other browser it attaches nothing
        and answers 202: that browser is given an approval (a new `__Host-cflink`,
        10 minutes) that a Google sign-in in it, as the same address and the same
        Google `sub`, finishes at the callback. So neither a stranger's browser
        nor a stranger's Google account can finish what the mailbox approved. The
        dashboard's link opens a screen that POSTs here on a click, never on the
        page load, so a mail scanner following the link connects nothing. An
        account already holding an identity keeps it.
        The link proves the mailbox: on an account whose address nobody had
        verified it also removes the password and revokes every session, token
        and credential, as they may be a stranger's who registered the address
        first. Only the account's own sessions and credentials end: nobody is
        removed from an organization and no invitation is withdrawn, and the
        notice names the people who joined through invitations this account
        sent. A verified account only gains Google.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleEmailConfirmRequest"
      responses:
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Google attached; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "202":
          description: >
            From a browser that did not ask for the link: nothing attached. The
            body names the address; a Google sign-in as it finishes the link.
          headers:
            Set-Cookie:
              description: "`__Host-cflink`, the approval, 10 minutes."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleEmailPending"
        "400":
          description: >
            The body is not JSON, from either of two sources: a body declared
            `application/json` that does not parse (a plain-text answer from the
            request parser), or, when the request carries a Confeature cookie, a
            body of another content type (the JSON `bad_request` envelope). Any other
            malformed body is the 410.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            text/plain:
              schema:
                type: string
        "409":
          description: >
            `identity_conflict` — the account already holds another identity, or
            the Google `sub` is linked to another account. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
        "410":
          description: >
            The link is unknown, expired or already used, or malformed: one
            uniform answer. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
  /v1/auth/link/google/start:
    post:
      operationId: authLinkGoogleStart
      summary: Begin connecting Google to the already-authenticated account
      description: >
        Confeature-original endpoint ("connect Google from the account
        page"). The inverse of /v1/auth/unlink/google: lets an
        ALREADY-AUTHENTICATED user link a Google identity to their existing
        account. Session-only (a management-token principal has no connected-
        method concept, mirroring /v1/auth/set-password and
        /v1/auth/unlink/google) — a bearer caller gets 401. Mints the SAME
        `state` / `nonce` / PKCE triple as /v1/auth/sso/google/start and
        persists it to KV under `sso:state:<state>`, but TAGS the record with
        `link_user_id` = the initiating session user's id. That binding IS the
        CSRF protection: the matching callback completes the link ONLY when a
        valid session whose user id equals `link_user_id` is presented. Returns
        the same `{ redirect_url }` as the sign-in start. The optional
        `return_to` defaults to `/account/security`.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleStartRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: >
            Google authorization URL minted (link-mode). The client opens it
            in the same tab; on return the callback completes the link.
          headers:
            Set-Cookie:
              description: >
                `__Host-cfsso`, a 10-minute cookie binding the state to this
                browser. The callback refuses a request that does not carry it.
              schema:
                type: string
                example: __Host-cfsso=<secret>; Max-Age=600; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoStartResponse"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: >
            No valid cookie session presented (session-only endpoint — a
            management-token bearer is rejected). Nothing is minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /v1/auth/set-password:
    post:
      operationId: authSetPassword
      summary: Add an email+password credential to a Google-first account
      description: >
        Confeature-original endpoint. Lets an
        authenticated user who signed up via Google (no password set) add
        an email+password credential. Allowed ONLY when the caller's
        `password_hash IS NULL`; the password is hashed with argon2id and
        stored. If a password is already set the endpoint returns 409
        `password_already_set` with NO overwrite (a change/reset flow is a
        separate concern, out of scope here). The password is never logged.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: Password set; the account can now also sign in with email+password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPasswordResponse"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "409":
          description: >
            The account already has a password set — no overwrite. Use a
            change/reset flow (out of scope here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPasswordError"
  /v1/auth/unlink/google:
    post:
      operationId: authUnlinkGoogle
      summary: Disconnect the Google sign-in from the authenticated account
      description: >
        Confeature-original endpoint. Lets an authenticated
        user disconnect their Google sign-in from the connected-accounts
        surface — the inverse of /v1/auth/link/google. Session-only (a
        management-token principal has no connected-method concept, mirroring
        /v1/auth/set-password). On success the `sso_provider_id` and
        `sso_subject` columns are set to NULL and the post-mutation connected
        methods are returned so the client can reflect state without a
        re-fetch. Empty request body. The endpoint enforces the account-lockout
        safety rule: Google can be unlinked ONLY when another sign-in method
        remains (a password is set) — otherwise it returns 409
        `last_sign_in_method` and changes NOTHING. When the account is already
        not connected to Google the call is an idempotent 200 no-op (the
        desired end state already holds).
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "200":
          description: >
            Google disconnected, or already not connected (idempotent no-op).
            Returns the post-mutation connected methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkGoogleResponse"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented (session-only endpoint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "409":
          description: >
            Google is the account's only sign-in method (no password set) —
            unlinking would lock the account out. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkGoogleError"
  /v1/users/invite:
    post:
      operationId: createInvite
      summary: Invite one or more members
      description: >
        Invite one or more members in a single call — the request shape
        aligns to ConfigCat's `InviteMembersRequest` (`emails[]` +
        `permissionGroupId`). `permissionGroupId` is a v1 placeholder:
        Confeature has no permission-groups feature yet, so the only
        accepted value is `0` (the same rule as
        `InvitationModel.permissionGroupId`) — a non-zero value is a 400.
        The `201` array response — one `{ email, invite_token, expires_at }`
        entry per submitted email — is a deliberate, documented
        Confeature-original divergence from ConfigCat's `204 No Content`:
        Confeature has no server-side email delivery, so the operator
        receives each invite token to relay (the back-office builds
        `<origin>/signup?invite=<token>`). The hashed-at-rest, 7-day,
        single-use token model and the best-effort per-email
        duplicate-email guard are unchanged from the single-email path.
        Inviting needs the `member:write` scope: a user's own credential
        carries every scope, so only a management token minted without it is
        refused. Any member of an Organization may invite into it, whatever
        their role, except in the founder Organization, the one that runs the
        Confeature service itself, where only a platform operator may (see the
        `403`).
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMembersRequest"
      responses:
        "201":
          description: >
            One invitation minted per submitted email; the plaintext
            token of each is returned once (shown only once).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCreateResultEntry"
        "400":
          description: >
            Malformed request — an empty or omitted `emails` array, a
            malformed address inside the batch, or a non-zero
            `permissionGroupId`. No invitation row is minted.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: >
            Forbidden. `insufficient_scope`: the management token lacks
            `member:write`. `forbidden`: the invitation would join the founder
            Organization and the caller is not a platform operator, meaning a
            dashboard session of that Organization's admin, or a management
            token. No invitation is minted. ConfigCat's swagger lists no `403`
            on `invite-member`; Confeature adds it because the request is sound
            and only the caller lacks the right.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Whole-batch rejection — at least one submitted address
            already belongs to a registered user (`email_taken`). The
            batch is all-or-nothing: nothing is minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns ok if the Worker is reachable.
      responses:
        "200":
          description: Worker is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /version:
    get:
      operationId: getVersion
      summary: Build identifier
      description: Returns the Worker's BUILD_SHA from its environment variables.
      responses:
        "200":
          description: Build identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /configuration-files/{sdkKey}/config_v6.json:
    get:
      operationId: getConfigV6
      summary: ConfigCat-compatible eval payload
      description: >
        Returns the raw config_v6 JSON document for an SDK key. Served
        by cdn.confeature.io from KV. The Worker does not parse or
        validate the body; the SDK is responsible for ConfigCat-spec
        evaluation against this payload. Conditional requests follow
        ConfigCat's CDN: send the last `ETag` as `If-None-Match` and a
        matching config answers `304` with no body. Behaviour measured
        against ConfigCat's CDN on 2026-09-27.

        Both SDK key shapes are served here. A legacy
        `confeature-sdk-1-<32>-<32>` key is one path segment. A
        ConfigCat-shaped key, `configcat-sdk-1/<22>/<22>` (the shape
        Confeature mints), contains `/`, so on this path it is sent
        percent-encoded, `configcat-sdk-1%2F<22>%2F<22>` — which is what
        OpenAPI's default `simple` path-parameter serialisation produces.
        A stock ConfigCat SDK sends the same key unencoded instead; that
        request is `getConfigV6ForConfigCatSdkKey`, which answers
        identically.
      servers:
        - url: https://cdn.confeature.io
          description: Eval read path
      parameters:
        - in: path
          name: sdkKey
          required: true
          schema:
            type: string
          description: >
            The SDK key identifying the customer's setting namespace, in
            either shape: `configcat-sdk-1/<22>/<22>` (sent `%2F`-encoded)
            or the legacy `confeature-sdk-1-<32>-<32>`, which stays valid.
          example: configcat-sdk-1/FAKEfixtureKeyNotRea01/FAKEfixtureKeyNotRea02
        - $ref: "#/components/parameters/ConfigIfNoneMatch"
        - $ref: "#/components/parameters/ConfigSdkVersion"
      responses:
        "200":
          $ref: "#/components/responses/ConfigV6"
        "304":
          $ref: "#/components/responses/ConfigV6NotModified"
        "403":
          $ref: "#/components/responses/ConfigV6AccessDenied"
  # A ConfigCat-shaped SDK key, `configcat-sdk-1/<keyA>/<keyB>`, as a stock
  # ConfigCat SDK sends it: unencoded, so it spans three path segments. An
  # OpenAPI path parameter cannot hold a `/`, and the contract describes the
  # request actually on the wire, hence a second path. It is
  # the same config read as getConfigV6 — same parameters, same responses,
  # by `$ref` to one definition — and served by the same CDN handler.
  /configuration-files/configcat-sdk-1/{keyA}/{keyB}/config_v6.json:
    get:
      operationId: getConfigV6ForConfigCatSdkKey
      summary: ConfigCat-compatible eval payload (ConfigCat-shaped SDK key)
      description: >
        Returns the raw config_v6 JSON document for the ConfigCat-shaped
        SDK key `configcat-sdk-1/{keyA}/{keyB}`, sent unencoded as a
        stock ConfigCat SDK sends it. Identical to `getConfigV6` in every
        response, header and status; the same key sent `%2F`-encoded to
        `getConfigV6` gets the same answer. Any non-empty `keyA` / `keyB`
        that matches no config — a malformed or over-long one included —
        answers `403`.
      servers:
        - url: https://cdn.confeature.io
          description: Eval read path
      parameters:
        - in: path
          name: keyA
          required: true
          schema:
            type: string
          description: >
            The first segment after `configcat-sdk-1/` — 22 characters of
            `[A-Za-z0-9_-]` in a key Confeature mints.
          example: FAKEfixtureKeyNotRea01
        - in: path
          name: keyB
          required: true
          schema:
            type: string
          description: >
            The second segment — 22 characters of `[A-Za-z0-9_-]` in a key
            Confeature mints.
          example: FAKEfixtureKeyNotRea02
        - $ref: "#/components/parameters/ConfigIfNoneMatch"
        - $ref: "#/components/parameters/ConfigSdkVersion"
      responses:
        "200":
          $ref: "#/components/responses/ConfigV6"
        "304":
          $ref: "#/components/responses/ConfigV6NotModified"
        "403":
          $ref: "#/components/responses/ConfigV6AccessDenied"
  /v1/tokens:
    post:
      operationId: createToken
      summary: Create a management token
      description: >
        The caller must be a platform operator holding `token:write`, and every
        scope of the new token must be one the caller holds: a management token
        holds its own scopes, and a dashboard session holds every scope. Holding
        the requested scopes is necessary but not sufficient: a dashboard
        session acting outside the founder Organization, the one that runs the
        Confeature service itself, holds them all and is still refused (see the
        `403`).
      tags: [Tokens]
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created. Plaintext shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          description: >
            Invalid request body. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Forbidden. `forbidden`: the caller is not a platform operator,
            meaning a dashboard session of the founder Organization's admin,
            acting in that Organization, or a management token. Any other
            credential is refused, whatever its scopes. `insufficient_scope`:
            the management token lacks `token:write`, or the request names a
            scope the caller does not hold, where `*` holds every scope and
            `member:*` holds every `member:` scope. Nothing is minted.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listTokens
      summary: List management tokens
      tags: [Tokens]
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
          description: List of token summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "403":
          description: >
            Forbidden. `forbidden`: the caller is not a platform operator,
            meaning a dashboard session of the founder Organization's admin,
            acting in that Organization, or a management token. Any other
            credential is refused, whatever its scopes. `insufficient_scope`:
            the management token lacks `token:read`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a management token
      tags: [Tokens]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Token id (UUID).
      responses:
        "204":
          description: Token revoked.
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "403":
          description: >
            Forbidden. `forbidden`: the caller is not a platform operator,
            meaning a dashboard session of the founder Organization's admin,
            acting in that Organization, or a management token. Any other
            credential is refused, whatever its scopes. `insufficient_scope`:
            the management token lacks `token:write`. Nothing is revoked.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Token not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/products:
    post:
      operationId: createProduct
      summary: Create a product
      tags: [Products]
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductModel"
        "400":
          description: >
            Invalid request body. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Token lacks the required scope. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
