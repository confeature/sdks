openapi: 3.1.0
info:
  title: Confeature API
  version: 0.5.0
  description: >
    Confeature's API. This file is the single source of truth — every Worker
    and every SDK imports types generated from this document.

    The resource hierarchy mirrors ConfigCat's public API: a
    Product owns one or more Configs and one or more Environments. Each
    Config owns one or more Settings. SDK keys hang off a (Config,
    Environment) pair. Setting values can be overridden per environment;
    when no override exists, the setting's default value applies.

    Two deliberate divergences from ConfigCat are documented inline in this
    file:
      1. Settings are addressed by (configId, key) instead of a synthetic
         numeric settingId — our keys are immutable so the URL is stable.
         This carries over to per-environment value endpoints, which use
         (configId, key) rather than ConfigCat's numeric settingId. The v2
         value routes (#880) use ConfigCat's numeric settingId, as ConfigCat.
      2. An explicit POST /v1/configs/{configId}/publish endpoint exists
         until value writes auto-materialise to KV. Setting-value writes do
         NOT auto-publish in this version.
  contact:
    name: MakerLabs
    url: https://confeature.io
servers:
  - url: https://api.confeature.io
    description: Production management API
  - url: https://cdn.confeature.io
    description: Production eval read path
paths:
  /v1/auth/bootstrap:
    post:
      operationId: authBootstrap
      summary: Create the first admin user (one-shot)
      description: >
        Single-use endpoint that creates the first admin user on a fresh
        Confeature deployment. The pre-shared bootstrap
        token is presented via the `X-Bootstrap-Token` header. Once the
        `users` table is non-empty, this endpoint MUST respond 410 gone
        for every subsequent call regardless of token validity.
      tags: [Auth]
      parameters:
        - name: X-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
          description: Plaintext bootstrap token; compared constant-time to BOOTSTRAP_TOKEN_HASH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, minLength: 5, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        "201":
          description: Admin user created; bootstrap endpoint is now disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Bootstrap token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "410":
          description: Bootstrap already consumed (users table is non-empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/login:
    post:
      operationId: authLogin
      summary: Sign in with email + password
      description: >
        Verifies the credential and, on success, issues a session cookie
        (`__Host-cfsession`, HttpOnly, Secure, SameSite=Strict, Path=/,
        Max-Age=604800). The cookie value is opaque; revocation is
        server-side via POST /v1/auth/logout. Failures return the SAME
        shape and timing whether the email does not exist or the password
        is wrong (auth-side enumeration defence).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 5
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  writeOnly: true
      responses:
        "200":
          description: Sign-in succeeded; session cookie set in headers.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Strict; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Malformed request body (e.g. password too short).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Wrong email OR wrong password (indistinguishable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: Sign out and revoke the current session
      description: >
        Deletes the session record for the cookie carried on the request,
        then clears the cookie client-side. Idempotent: calling logout
        without a session still returns 204.
      tags: [Auth]
      responses:
        "204":
          description: Session deleted (if present); cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=; Max-Age=0; HttpOnly; Secure; SameSite=Strict; Path=/
  /v1/auth/me:
    get:
      operationId: authMe
      summary: Return the currently authenticated user
      description: >
        Returns the User record associated with the request's session
        credential (cookie or management token). For a
        cookie session the response additionally carries a `methods`
        object describing which sign-in methods are connected to the
        account — `password` (a password is set) and `google` (a Google
        identity is linked). The field is additive and backward-compatible.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Currently authenticated user, with connected methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeWithMethods"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/session:
    get:
      operationId: authSession
      summary: Probe the current session (always 200)
      description: >
        Public session probe used by the back-office bootstrap.
        ALWAYS returns 200: `authenticated` is the boolean session signal
        and `user` is the User record when a valid cookie session is
        present, else null. Unlike GET /v1/auth/me this endpoint NEVER
        returns 401, so the back-office can probe for a session on a public
        route (e.g. /sign-in) without surfacing a console-visible 401.
      tags: [Auth]
      responses:
        "200":
          description: Session probe result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProbe"
  /v1/auth/events:
    get:
      operationId: listAuthEvents
      summary: List the caller's own account-security activity (newest-first).
      description: >
        Returns the AUTHENTICATED CALLER'S OWN auth-plane events (sign-in/out,
        OAuth link/unlink, CLI device approve/deny, CLI + management token
        mint/revoke), newest-first. Strictly user-self-scoped:
        the read is hard-scoped `WHERE user_id = <principal.id>`, so a caller
        can NEVER see another user's events. Management-plane
        only (no ConfigCat equivalent) — additive and parity-safe. Each item is
        an `AuthEventModel` carrying NO secret value and NO other user's id.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Page size (default 50, max 200).
        - in: query
          name: before
          required: false
          schema:
            type: integer
            format: int64
          description: >
            Cursor — return only events strictly OLDER than this `createdAt`
            (unix ms). Omit for the newest page.
      responses:
        "200":
          description: The caller's own auth events, newest-first (bare array).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthEventModel"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/accept-invite:
    post:
      operationId: authAcceptInvite
      summary: Redeem a one-time invite and sign in
      description: >
        Confeature-original endpoint (ConfigCat's invite
        flow is not part of their public API, so no parity drift exists
        to violate). Consumes a `confeature_invite_<…>` token and a
        password, atomically creates the `users` row + issues a
        `__Host-cfsession` cookie. The invite row is DELETEd in the
        same D1 transaction that inserts the user, making the link
        single-use by construction. Expired, consumed,
        unknown, and malformed tokens all return the SAME 410 generic
        body — no token-existence enumeration.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Invite redeemed; user created; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Strict; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "410":
          description: >
            Invite expired, consumed, unknown, or malformed — same generic body
            and status for all FOUR failure branches.
            This unifies what would otherwise be a 400 (token shape / password
            length) with the 410 (expired / consumed / unknown). The contract
            deliberately omits 400 here: a malformed body emerges as 410 with
            the identical generic copy so no scanner can distinguish "I
            mistyped the token" from "I guessed a once-valid token that has
            been redeemed".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/password-reset/request:
    post:
      operationId: authPasswordResetRequest
      summary: Request a password-reset link
      description: >
        Confeature-original endpoint. Accepts an email and,
        for a registered account that HAS a password, mints a single-use
        30-minute reset token and emails a reset link. ALWAYS returns the same
        generic 200 acknowledgement — for a real account, an SSO/OAuth-only
        account (no password), a non-existent account, or a rate-limited caller
        — so the endpoint cannot be used to discover which emails are
        registered (mirrors /v1/auth/login's "SAME shape and timing" defence).
        The reset token is never returned in the response and
        never logged.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  minLength: 5
                  maxLength: 254
      responses:
        "200":
          description: >
            Generic acknowledgement, identical in every case. No body field
            discloses whether an account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAck"
        "400":
          description: Malformed request body (e.g. not an email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/password-reset/confirm:
    post:
      operationId: authPasswordResetConfirm
      summary: Complete a password reset
      description: >
        Confeature-original endpoint. Exchanges a valid,
        unexpired, unconsumed reset token plus a new password for an updated
        credential. On success the new argon2id hash is written, the token is
        consumed (single-use), and ALL of the account's sessions are revoked —
        the user must sign in again with the new password. A rejected (weak)
        password does NOT consume the token, so the same link can be retried
        within its lifetime. A malformed body, a weak password, or an
        invalid/expired/consumed token all return a single uniform 400 (no
        distinction that reveals which condition failed).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 128
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 256
                  writeOnly: true
      responses:
        "200":
          description: Password changed. No session cookie is issued; sign in again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAck"
        "400":
          description: >
            Malformed body, weak new password, OR an invalid/expired/consumed
            token — returned as a single uniform outcome (no distinction that
            reveals which condition failed). The token is not consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/sso/{provider}/start:
    post:
      operationId: ssoStart
      summary: Begin an OIDC SSO flow for a registered provider
      description: >
        Confeature-original endpoint (ConfigCat's SSO
        sign-in endpoints are not part of their public OpenAPI, so no
        parity drift exists to violate). Mints a fresh `state`, `nonce`,
        and PKCE verifier (S256), persists the triple to KV under
        `sso:state:<state>` with a 10-minute TTL, then returns a fully-
        formed OIDC Authorization-Code-with-PKCE redirect URL the
        back-office opens in the same tab. A 404 response means the
        path-`provider` id is not registered; the body is deliberately
        generic so an attacker cannot distinguish "registry empty" from
        "unknown id".
      tags: [Auth]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
          description: The registered provider id (string slug, e.g. `corp-okta`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoStartRequest"
      responses:
        "200":
          description: Provider authorization URL minted; client opens it in the same tab.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoStartResponse"
        "404":
          description: >
            Provider id is not registered. Body is the generic SSO error
            envelope; no enumeration of empty-registry vs unknown-id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
  /v1/auth/sso/{provider}/callback:
    post:
      operationId: ssoCallback
      summary: Complete an OIDC SSO flow and issue a session cookie
      description: >
        Confeature-original endpoint (same note as `ssoStart`: no
        ConfigCat counterpart exists). Consumes the KV state
        triple atomically (read + delete), exchanges the `code` at the
        provider's token endpoint, fetches the operator's email at
        the userinfo endpoint, upserts a single `users` row by
        email-match (preserving any existing `password_hash`),
        creates a session, and sets the `__Host-cfsession` cookie
        using the same machinery as `/v1/auth/login` and
        `/v1/auth/accept-invite`. All 400-class failures (missing /
        consumed / malformed state, missing email, malformed body)
        return one bytewise-identical body. All 502-class failures
        (token endpoint down, userinfo endpoint down) return one
        bytewise-identical body. No per-branch enumeration.
      tags: [Auth]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
          description: The registered provider id (string slug, e.g. `corp-okta`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoCallbackRequest"
      responses:
        "200":
          description: >
            SSO sign-in succeeded (session cookie set), OR — for the
            consumer `google` provider when the verified email matches an
            existing PASSWORD account not yet linked — a `link_required`
            challenge (NO cookie set, NO mutation), OR — when the KV state
            record carried a `link_user_id`
            (minted by /v1/auth/link/google/start) — a `linked` envelope
            confirming the authenticated user just connected Google from the
            account page (the session is UNCHANGED; no new cookie). The
            response is a discriminated union of three shapes: the signed-in
            branch is a plain `User`; the link-required branch carries
            `status: "link_required"` + a single-use `challenge_id` + the
            matched `email`; the account-link branch carries
            `status: "linked"` + `return_to` + the updated `methods`. The
            client distinguishes account-link (go to `return_to`, toast
            "Google connected") from sign-in (a plain `User`, go to
            `/products`) on the presence of `status: "linked"`.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Strict; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoCallbackResult"
        "400":
          description: >
            State missing / consumed / malformed / tampered, or userinfo
            returned no `email`, or — for the `google` provider — the
            `email_verified` claim was absent or false, or malformed body
            — same generic body for ALL branches. No session is issued; the KV
            state entry IS consumed when present, to prevent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
        "403":
          description: >
            Link-mode CSRF guard. The KV state carried a
            `link_user_id` but the request presented no valid session, or a
            session whose user id does NOT equal `link_user_id`. The link is
            bound to the session that initiated it; a mismatched/absent
            session is rejected and NOTHING is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
        "409":
          description: >
            Link-mode conflict. Either the Google `email`
            does not match the authenticated account's email
            (`email_mismatch`), or the Google `sub` is already linked to a
            DIFFERENT account (`identity_conflict`), or the account is
            already linked to a different Google identity. Nothing is changed.
            Only reachable when the state carried a `link_user_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkAccountError"
        "502":
          description: >
            Provider's token endpoint or userinfo endpoint returned an
            error or was unreachable. Same generic body for BOTH
            branches. The KV state entry
            IS consumed; no users row is upserted; no session is
            issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoError"
  /v1/auth/sso/providers:
    get:
      operationId: listSsoProviders
      summary: Discover registered SSO providers for the back-office sign-in page
      description: >
        Confeature-original endpoint (a discovery endpoint that keeps the
        back-office sign-in page provider-agnostic). Returns the public-safe
        `{ id, label }` subset of
        every entry in `CONFEATURE_SSO_PROVIDERS`. The response NEVER
        carries any secret-bearing field (`client_id`,
        `client_secret_binding`, `issuer`, `redirect_uri_origin` are
        all omitted by construction). Empty registry returns
        `{ providers: [] }` with HTTP
        200 (not 404; an empty list is a valid steady state).
      tags: [Auth]
      responses:
        "200":
          description: Public-safe list of registered SSO providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoProviderListResponse"
  /v1/auth/link/google:
    post:
      operationId: authLinkGoogle
      summary: Confirm a password account and attach a pending Google identity
      description: >
        Confeature-original endpoint. The second
        leg of the no-silent-merge linking flow: the `google` callback
        verified the Google identity server-side and minted a single-use
        link challenge (returned as `challenge_id` in the callback's
        `link_required` branch). This endpoint consumes that challenge,
        loads the user by the challenge's email, verifies the supplied
        password with argon2id (timing-equalised on a wrong/unknown
        password), and — on success — attaches `sso_provider_id='google'`
        + `sso_subject`, creates a session, and sets the `__Host-cfsession`
        cookie. The challenge is single-use (deleted on read). No token or
        password is ever logged.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleRequest"
      responses:
        "200":
          description: Google linked; session cookie set. Password still valid.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __Host-cfsession=<uuid>; Max-Age=604800; HttpOnly; Secure; SameSite=Strict; Path=/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: >
            Wrong password (timing-equalised against the unknown-user
            branch). Nothing is written; no session is issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
        "409":
          description: >
            The Google `sub` carried by the challenge is already linked to
            a different account (partial-unique `(sso_provider_id,
            sso_subject)` conflict). No silent reassignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
        "410":
          description: >
            The link challenge is missing, expired, or already used.
            Single-use + ~10 minute TTL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkGoogleError"
  /v1/auth/link/google/start:
    post:
      operationId: authLinkGoogleStart
      summary: Begin connecting Google to the already-authenticated account
      description: >
        Confeature-original endpoint ("connect Google from the account
        page"). The inverse of /v1/auth/unlink/google: lets an
        ALREADY-AUTHENTICATED user link a Google identity to their existing
        account. Session-only (a management-token principal has no connected-
        method concept, mirroring /v1/auth/set-password and
        /v1/auth/unlink/google) — a bearer caller gets 401. Mints the SAME
        `state` / `nonce` / PKCE triple as /v1/auth/sso/google/start and
        persists it to KV under `sso:state:<state>`, but TAGS the record with
        `link_user_id` = the initiating session user's id. That binding IS the
        CSRF protection: the matching callback completes the link ONLY when a
        valid session whose user id equals `link_user_id` is presented. Returns
        the same `{ redirect_url }` as the sign-in start. The optional
        `return_to` defaults to `/account/security`.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleStartRequest"
      responses:
        "200":
          description: >
            Google authorization URL minted (link-mode). The client opens it
            in the same tab; on return the callback completes the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoStartResponse"
        "401":
          description: >
            No valid cookie session presented (session-only endpoint — a
            management-token bearer is rejected). Nothing is minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /v1/auth/set-password:
    post:
      operationId: authSetPassword
      summary: Add an email+password credential to a Google-first account
      description: >
        Confeature-original endpoint. Lets an
        authenticated user who signed up via Google (no password set) add
        an email+password credential. Allowed ONLY when the caller's
        `password_hash IS NULL`; the password is hashed with argon2id and
        stored. If a password is already set the endpoint returns 409
        `password_already_set` with NO overwrite (a change/reset flow is a
        separate concern, out of scope here). The password is never logged.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: Password set; the account can now also sign in with email+password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPasswordResponse"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "409":
          description: >
            The account already has a password set — no overwrite. Use a
            change/reset flow (out of scope here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPasswordError"
  /v1/auth/unlink/google:
    post:
      operationId: authUnlinkGoogle
      summary: Disconnect the Google sign-in from the authenticated account
      description: >
        Confeature-original endpoint. Lets an authenticated
        user disconnect their Google sign-in from the connected-accounts
        surface — the inverse of /v1/auth/link/google. Session-only (a
        management-token principal has no connected-method concept, mirroring
        /v1/auth/set-password). On success the `sso_provider_id` and
        `sso_subject` columns are set to NULL and the post-mutation connected
        methods are returned so the client can reflect state without a
        re-fetch. Empty request body. The endpoint enforces the account-lockout
        safety rule: Google can be unlinked ONLY when another sign-in method
        remains (a password is set) — otherwise it returns 409
        `last_sign_in_method` and changes NOTHING. When the account is already
        not connected to Google the call is an idempotent 200 no-op (the
        desired end state already holds).
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: >
            Google disconnected, or already not connected (idempotent no-op).
            Returns the post-mutation connected methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkGoogleResponse"
        "401":
          description: No valid credential presented (session-only endpoint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "409":
          description: >
            Google is the account's only sign-in method (no password set) —
            unlinking would lock the account out. Nothing is changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlinkGoogleError"
  /v1/users/invite:
    post:
      operationId: createInvite
      summary: Invite one or more members
      description: >
        Invite one or more members in a single call — the request shape
        aligns to ConfigCat's `InviteMembersRequest` (`emails[]` +
        `permissionGroupId`). `permissionGroupId` is a v1 placeholder:
        Confeature has no permission-groups feature yet, so the only
        accepted value is `0` (the same rule as
        `InvitationModel.permissionGroupId`) — a non-zero value is a 400.
        The `201` array response — one `{ email, invite_token, expires_at }`
        entry per submitted email — is a deliberate, documented
        Confeature-original divergence from ConfigCat's `204 No Content`:
        Confeature has no server-side email delivery, so the operator
        receives each invite token to relay (the back-office builds
        `<origin>/signup?invite=<token>`). The hashed-at-rest, 7-day,
        single-use token model and the best-effort per-email
        duplicate-email guard are unchanged from the single-email path.
        Any authenticated principal can call this in v0.1 (every session
        carries scope `*`; no RBAC).
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMembersRequest"
      responses:
        "201":
          description: >
            One invitation minted per submitted email; the plaintext
            token of each is returned once (shown only once).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InviteCreateResultEntry"
        "400":
          description: >
            Malformed request — an empty or omitted `emails` array, a
            malformed address inside the batch, or a non-zero
            `permissionGroupId`. No invitation row is minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid credential presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "409":
          description: >
            Whole-batch rejection — at least one submitted address
            already belongs to a registered user (`email_taken`). The
            batch is all-or-nothing: nothing is minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
