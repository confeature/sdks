        Returns the product's segments, each with its `usage`: how many
        feature flags and settings reference it in their targeting rules.
        Aligned with ConfigCat's get-segments.
      tags: [Segments]
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        "200":
