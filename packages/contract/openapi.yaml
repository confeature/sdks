            body the settings list carries for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingModel"
        "400":
          description: >
            Invalid request body: `settingType` and `type` disagree, an initial
            value does not fit the setting type, an environment is named twice,
            a tag cannot be assigned (one fixed body, see
            `CreateSettingRequest.tags`), a field Confeature does not support
            yet is not empty, or a change note is required.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks setting:write, or it is a management token
            without config:publish. With initial values, it also needs
            setting-value:write.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Config not found, or an `initialValues` environment is not one of
            the config's product. Both answer the same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A setting with this key already exists in this config.
