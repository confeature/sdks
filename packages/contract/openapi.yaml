  /v1/configs/{configId}/settings:
    post:
      operationId: createSetting
      summary: Create a setting within a config
      description: >
        The new setting goes live with no publish call: when the 201 arrives it
        is served, with its initial value, in every published environment of
        the config. An environment never published receives it at its first
        publish. If the edge cannot be updated at that moment, the setting is
        still created and the 201 stands; the edge update is retried
        automatically.


        The body is ConfigCat's `CreateSettingInitialValues` (#938).
        `initialValues` sets the setting's value in the environments it names;
        every other environment starts at the type's zero value (`false`, `""`,
        `0`). The setting and all of its initial values are written together
        or not at all. Initial values are value writes: a management token
        needs `setting-value:write` as well, and an initial value that cannot
        reach the edge answers 503 with everything saved.
      tags: [Settings]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettingRequest"
