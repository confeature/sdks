          description: Product not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createSegment
      summary: Create a segment
      description: >
        Creates a segment in the product: one user condition, with a legacy
        comparator (`RolloutRuleComparator`) and a comparison value string,
        which targeting rules reference with `isIn` or `isNotIn`. A list
        comparator's value is comma-separated; `contains` and
        `doesNotContain` compare the whole value; a number may use a decimal
        comma. A sensitive comparison value is stored in cleartext and served
        hashed, its context salt being the segment's name. A management
        token also needs config:publish. Aligned with ConfigCat's
        create-segment.
      tags: [Segments]
      security:
        - bearerAuth: []
        - basicAuth: []
