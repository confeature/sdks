  /v1/code-references:
    # ConfigCat's "Upload References", copied 1:1: path, method, tag, the
    # `CodeReferenceRequest` body and the empty 200. This is the call that
    # ends every `configcat scan --upload`. ConfigCat's CLI reads only the
    # status: it parses a failure body as `Dictionary<string,string[]>` and,
    # when that fails, prints the status, so the `Error` envelope is harmless
    # to it. Each divergence is stated in the description below.
    post:
      operationId: uploadCodeReferences
      summary: Upload References
      description: >
        Stores one code-reference report: the references the scanner
        (`configcat scan --upload`) found on one branch of one repository,
        scanned against one config. ConfigCat publishes no operationId for
        this operation; `uploadCodeReferences` is Confeature's.


        A re-scan replaces the branch's report: the report of the same
        config, `repository` and `branch` is deleted and the new one stored,
        with a new `codeReferenceId`, in one transaction. When
        `activeBranches` is present (an empty array included), every other
        report of that config and repository whose branch is not in it is
        deleted too, never the uploaded branch (it may simply not be pushed
        yet). When `activeBranches` is absent or null, no branch is pruned.
        An empty or absent `flagReferences` still stores the report: the
        branch was scanned and nothing was found.


        References whose `settingId` is neither a setting of the config nor a
        deleted setting of the config are dropped, and the rest of the upload
        is stored: references to an unknown `settingId` are dropped, and
        references to a deleted setting are kept (it may have been deleted
        between the scanner's read and its upload). Unknown properties are
        ignored. The body is accepted as `application/json` only (ConfigCat
        also lists `text/json` and `application/*+json`; the scanner sends
        `application/json`). A `commitUrl` or `fileUrl` must be an `http:` or
        `https:` URL. Bounds ConfigCat does not document, the same for every
        organization: at most 10 lines in each `preLines` and `postLines`,
        150 references per Feature Flag or Setting (across all of its
        `FlagReference` entries), 10,000 references per upload,
        5,000 `activeBranches` (1 MiB serialised), a body of 8 MiB, and 100
        reports per config.


        The upload spends the organization's write budget by its size: one
        token, plus one per full 64 KiB of `Content-Length` (a body sent
        without `Content-Length` is charged as 8 MiB).
      tags: [Code References]
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeReferenceRequest"
      responses:
        "200":
          description: The report is stored. No body, as ConfigCat.
        "400":
          description: >
            `bad_request`: the body is not JSON, misses a required field, or
            breaks a length, a bound or the URL rule of `CodeReferenceRequest`.
            `code_reference_report_limit`: the upload would create the 101st
            report of the config, counted after its own replace and prune; a
            config holds at most 100 reports (one per repository and branch).
            ConfigCat documents no such limit; it answers 400, the only status
            of the ones ConfigCat documents for this operation that fits.
            Nothing is written in either case, not even the prune.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks the code-reference:write scope. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Config not found. A config the caller may not access answers the
            same body. Nothing is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >
            The request body is larger than 8 MiB (8,388,608 bytes), with or
            without `Content-Length`. ConfigCat documents no bound. Nothing is
            written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/code-references/delete-reports:
