              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "403":
          description: Token lacks segment:read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
