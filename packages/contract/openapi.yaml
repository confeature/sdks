          $ref: "#/components/responses/TooManyAttempts"
  /v1/settings/{settingId}/predefined-variations:
    # ConfigCat's "Get predefined variations" and "Update predefined
    # variations", copied 1:1: path, methods, tag, int32 `settingId`, no query
    # parameter, and the request and response models field for field. The
    # operationIds are ConfigCat's `get-predefined-variations` and
    # `update-predefined-variations` in the contract's camelCase convention.
    # ConfigCat declares no 401 or 403; they are declared here as on every
    # sibling. The tag is `Settings`, as on every other setting operation of
    # this contract, not ConfigCat's "Feature Flags & Settings".
    get:
      operationId: getPredefinedVariations
      summary: Get predefined variations
      description: >
        The predefined variations of a Feature Flag or Setting, in their
        order, with their usages in the Environments, as ConfigCat's
        `PredefinedVariationsWithUsagesModel`. `environments` lists every
        Environment of the setting's product; Confeature has no
        environment-specific Feature Management permission, so each has
        `accessType: full`.


        Confeature divergences: `usages` is always empty and
        `usagesInOtherEnvironments` is 0 until a setting value can name a
        predefined variation, and `changeRequestUsages` is always empty and
        `changeRequestUsagesInOtherEnvironments` 0 until change requests
        ship. `maxPredefinedVariations` is Confeature's technical maximum,
        100, the same for every plan. A deleted setting answers 404, as a
        missing one. Reading this never answers 402.
      tags: [Settings]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: settingId
          required: true
          schema:
            type: integer
            format: int32
          description: The identifier of the Setting.
      responses:
        "200":
          description: >
            The setting's predefined variations, as ConfigCat's
            `PredefinedVariationsWithUsagesModel`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredefinedVariationsWithUsagesModel"
        "400":
          description: The `settingId` is not an int32.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The token lacks the setting:read scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Setting not found. A setting the caller may not access answers the
            same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
    put:
      operationId: updatePredefinedVariations
      summary: Update predefined variations
      description: >
        Replaces the whole list of the setting's predefined variations, in the
        request's order, and answers the stored list as ConfigCat's
        `PredefinedVariationsModel`. An entry with a `predefinedVariationId`
        updates that variation of the setting; an entry without one creates a
        variation with a new id; a stored variation absent from the request
        is deleted. Every value must match the setting's type and stay in its
        value domain (an int32, the string length limit, a finite double), and
        the served values of one setting are distinct. A predefined
        variation's value can only be updated, and the variation deleted, if
        it is not used anywhere in your feature flags; its name and hint can
        always be updated. The variations never change what the SDKs are
        served: nothing is published and no config is re-projected.


        Confeature divergences, each the same for every plan: at most 100
        variations per setting (Confeature's technical maximum, reported as
        `maxPredefinedVariations`), the whole ordered list at most 900,000
        bytes of UTF-8 JSON (400), and a body of at most 1 MiB (413). The
        optional `reason` is a Confeature addition: the change note for the
        audit log, required when the product requires a reason for changes;
        a ConfigCat client omits it. The body is accepted as
        `application/json` only (ConfigCat also lists `text/json` and
        `application/*+json`), as on every other write of this contract. A
        change is audited as `predefinedVariationsChanged`; Confeature has no
        `settingConvertedToPredefinedVariations` event, because a setting
        needs no conversion to hold variations. This never answers 402.
      tags: [Settings]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: settingId
          required: true
          schema:
            type: integer
            format: int32
          description: The identifier of the Setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePredefinedVariationsRequest"
      responses:
        "200":
          description: >
            The setting's predefined variations as stored, as ConfigCat's
            `PredefinedVariationsModel`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredefinedVariationsModel"
        "400":
          description: >
            The body is invalid; or a reason is required for this change and
            none is given (`reason_required`); or there are more than 100
            variations; or the ordered list is over 900,000 bytes; or a value
            does not match the setting's type or its value domain; or two
            variations have the same served value; or a
            `predefinedVariationId` is not a variation of this setting; or a
            variation in use would be deleted or have its value changed.
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks the setting:write scope. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Setting not found. A setting the caller may not access answers the
            same body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/configs/{configId}/environments/{environmentId}:
    get:
      operationId: getSdkKeys
      summary: Get the SDK keys for a config in an environment
      description: >
        Returns the SDK keys (primary and optional secondary) for the given
        Config in the specified Environment. Byte-for-byte parity with
        ConfigCat's `get-sdk-keys`.
      tags: [SDK Keys]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
        - in: path
          name: environmentId
          required: true
          schema:
            type: string
            format: uuid
          description: Environment id (UUID).
      responses:
        "200":
          description: The SDK keys for the config-in-environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeysModel"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "403":
          description: Token lacks the required scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Config or environment not found, not in the same product, or not
            visible to the caller's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── Confeature extensions — SDK-key generation and deletion ──────────────
  # ConfigCat's Public Management API only reads SDK keys (`get-sdk-keys`);
  # generating a secondary key and deleting a key are dashboard actions there,
  # audited as `apiKeyAdded` / `apiKeyRemoved`. These two routes expose the
  # same two-slot model (a primary, at most one secondary, never a third key)
  # over the API. They are namespaced under the parity route's path and
  # documented as Confeature extensions. ConfigCat parity covers the surface
  # ConfigCat exposes; it does not forbid additive endpoints.
  /v1/configs/{configId}/environments/{environmentId}/sdk-keys/rotate:
    post:
      operationId: rotateSdkKeys
      summary: Generate the secondary SDK key for a config in an environment (Confeature extension)
      description: >
        CONFEATURE EXTENSION — not part of ConfigCat parity (ConfigCat
        generates a secondary key from its dashboard). Generates a secondary
        SDK key next to the primary; the primary is unchanged and both keys
        serve the environment's published config. Refused with 409
        `secondary_exists` while a secondary already exists: as in ConfigCat
        there is never a third key, so delete one of the two keys first
        (`deleteSdkKey`). A rotation is therefore generate, migrate the apps
        to the secondary, then delete the primary. Requires the
        `sdk-key:write` scope. Recorded in the audit log as `apiKeyAdded`.
      tags: [SDK Keys]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
        - in: path
          name: environmentId
          required: true
          schema:
            type: string
            format: uuid
          description: Environment id (UUID).
      responses:
        "200":
          description: A secondary key was generated. Returns the primary and the new secondary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeysModel"
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Token lacks the required scope. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Config or environment not found / not visible to the org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            `secondary_exists` — a secondary key already exists: delete one of
            the two keys first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/configs/{configId}/environments/{environmentId}/sdk-keys/{slot}:
    delete:
      operationId: deleteSdkKey
      summary: Delete an SDK key of a config in an environment (Confeature extension)
      description: >
        CONFEATURE EXTENSION — not part of ConfigCat parity (ConfigCat deletes
        a key from its dashboard). Deletes the primary or the secondary SDK
        key. Deleting the primary promotes the secondary to primary. The only
        key cannot be deleted (409 `only_key`): generate a secondary first
        (`rotateSdkKeys`). A deleted key stops serving within about 60 s at
        the edge; from then on the CDN answers it like any unknown key (403
        `AccessDenied`), and it never serves again. Requires the
        `sdk-key:write` scope; a management token also needs
        `config:publish`, since the delete takes the key off the edge.
        Recorded in the audit log as `apiKeyRemoved`.
      tags: [SDK Keys]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
        - in: path
          name: environmentId
          required: true
          schema:
            type: string
            format: uuid
          description: Environment id (UUID).
        - in: path
          name: slot
          required: true
          schema:
            type: string
            enum: [primary, secondary]
          description: The key to delete.
      responses:
        "200":
          description: >
            The key is deleted and stops serving (within about 60 s at the
            edge). Returns the remaining keys; deleting the primary promotes
            the secondary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeysModel"
        "400":
          description: >
            Invalid path parameter (a non-UUID id, or a slot other than `primary` / `secondary`). Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks sdk-key:write, or it is a management token
            without config:publish.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >
            Config or environment not found, not in the same product, or not
            visible to the caller's organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeyNotFound"
        "409":
          description: >
            `only_key` — it is the only key (or the requested slot is empty):
            generate a secondary first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkKeyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/configs/{configId}/publish:
    # Divergence #2 from ConfigCat: ConfigCat auto-materialises configs to
    # its CDN on every setting-value write, so no explicit publish endpoint
    # exists. Confeature keeps an explicit publish endpoint until setting-value
    # writes project automatically.
    post:
      operationId: publishConfig
      summary: Project current setting state to KV for every active SDK key
      description: >
        Publishes the config: each environment's current (draft) setting
        values become that environment's published snapshot, and the snapshot
        is then projected to the served payload of every active SDK key in the
        environment. A key whose served payload already matches the snapshot
        (same ETag) is left untouched, so republishing an unchanged config
        rewrites nothing.
      tags: [Publish]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeNoteRequest"
      responses:
        "200":
          description: Config state projected to KV.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          description: >
            A change note (reason) is required for this change. Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Token lacks the required scope. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Config not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/me:
    get:
      operationId: meGet
      summary: Get authenticated user details
      description: >
        Returns the email and full name of the currently authenticated
        user. ConfigCat parity (their `GET /v1/me` returns the same
        `MeModel` shape). Confeature additionally exposes a richer
        `/v1/auth/me` (returns the full `User` schema with creation
        timestamp + session metadata); both endpoints coexist — `/v1/me`
        is the canonical parity surface for ConfigCat-style clients,
        `/v1/auth/me` is the Confeature-internal richer view.
      tags: [Me]
