  /v1/environments/{environmentId}/configs/{configId}/settings/{key}/value:
    # Divergence carry-over: ConfigCat exposes the per-env
    # value endpoint under /v1/environments/{environmentId}/settings/{settingId}/value
    # where settingId is a synthetic numeric id. Confeature treats setting `key`
    # as immutable and addresses settings by (configId, key), so the per-env
    # value endpoint follows the same shape.
    get:
      operationId: getSettingValue
      summary: Get the per-environment value for a setting
      description: >
        Returns the setting's value in this environment, projected into the
        SettingValue envelope. Every (environment, config, setting) triple has
        exactly one value row — the value is canonical, not an optional
        override — so the read always returns a value, mirroring ConfigCat's
        get-value behaviour where every setting has a value in every
        environment.
      tags: [Setting Values]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: environmentId
          required: true
          schema:
            type: string
            format: uuid
          description: Environment id (UUID).
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
        - in: path
          name: key
          required: true
          schema:
            $ref: "#/components/schemas/SettingKey"
          description: Setting key.
      responses:
        "200":
          description: The setting's effective value in this environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingValue"
        "400":
          description: >
            Environment and setting do not share a product, or the value has
            targeting rules, which this envelope cannot carry: the message
            names the v2 value route
            (`/v2/environments/{environmentId}/settings/{settingId}/value`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "403":
          description: Token lacks the required scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setting, config, or environment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setSettingValue
      summary: Set a per-environment value override for a setting
      description: >
        Sets the setting's value in one environment and makes it live there:
        no publish call is needed, and no other unpublished change ships with
        it. The response is 200 only once the value is in the environment's
        edge storage, where it is visible at once; other locations see it
        within 60 seconds (Workers KV propagation). A 503 means the value is
        saved but not live yet: retry the same request after Retry-After. A
        management token also needs config:publish.
      tags: [Setting Values]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - in: path
          name: environmentId
          required: true
          schema:
            type: string
            format: uuid
          description: Environment id (UUID).
        - in: path
          name: configId
          required: true
          schema:
            type: string
            format: uuid
          description: Config id (UUID).
        - in: path
          name: key
          required: true
          schema:
            $ref: "#/components/schemas/SettingKey"
          description: Setting key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingValue"
      responses:
        "200":
          description: Setting value override set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingValue"
        "400":
          description: >
            Invalid request body, or env and setting do not share a product,
            or rolloutRules/rolloutPercentageItems is non-empty (v1 rollout
            rules are #890), or the value has v2 targeting rules, which this
            envelope would wipe: nothing is written, and the message names
            the v2 value route
            (`/v2/environments/{environmentId}/settings/{settingId}/value`).
            Also `bad_request` when the request carries a Confeature cookie and its body is not JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            Token lacks the required scope. Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setting or environment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: >
            The value is saved but not live yet. Retry the same request after
            Retry-After.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueNotLive"
