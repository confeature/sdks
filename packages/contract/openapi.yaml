        "200":
          description: The value was replaced and is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingFormulaModel"
        "400":
          $ref: "#/components/responses/ValueWriteBadRequest"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks setting-value:write, or it is a management token
            without config:publish.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setting or environment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/ValueWriteConflict"
        "413":
          description: The request body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ValueNotLive"
    patch:
      operationId: updateSettingValueV2
      summary: Update a setting's value in one environment with JSON Patch (v2)
      description: >
        Applies an RFC 6902 JSON Patch to the setting's evaluation formula (the
        model a PUT takes), then validates and writes the result as a PUT
        would. Every operation (add, remove, replace, move, copy, test), array
        index, `-` and RFC 6901 escape is supported on `/defaultValue`,
        `/targetingRules` and `/percentageEvaluationAttribute` and anything
        below them, in `path` and in `from`; the patch is atomic. At most 100
        operations. A stale `latestVersionId` answers 409 before the patch is
        applied. A patch that changes nothing answers 204. Aligned with
        ConfigCat's update-setting-value-v2.
      tags: [Setting Values V2]
      security:
        - bearerAuth: []
        - basicAuth: []
      parameters:
        - $ref: "#/components/parameters/ValueWriteReason"
        - $ref: "#/components/parameters/ValueWriteBypassApproval"
        - $ref: "#/components/parameters/ValueWriteLatestVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/JsonPatchOperation"
      responses:
        "200":
          description: The patch was applied and the value is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingFormulaModel"
        "204":
          description: The patch changed nothing.
        "400":
          $ref: "#/components/responses/ValueWriteBadRequest"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The token lacks setting-value:write, or it is a management token
            without config:publish.
            Also `forbidden` (cross-origin request refused) when the request carries a Confeature cookie and comes from neither the dashboard's own origin nor an allowlisted one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setting or environment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/ValueWriteConflict"
        "413":
          description: The request body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ValueNotLive"
