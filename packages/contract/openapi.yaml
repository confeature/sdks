            pagination — mirrors ConfigCat).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogItemModel"
        "401":
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/BasicChallenge"
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        "403":
          description: Token lacks the auditlog:read scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found (or cross-org — anti-enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # ── Release Guardian — management plane ONLY. Does NOT touch
  #    the SDK eval wire (config_v6 / ConfigV6). The inbound webhook is token-auth
  #    (the path token IS the auth); every other route is scope-guarded with a
  #    generic-404 cross-org gate (anti-enumeration). ───────────────────────────
  /v1/guardian/webhooks/{token}:
    post:
      operationId: receiveGuardianSignal
      summary: Inbound error-spike signal (token-auth; the customer's alert POSTs here).
      description: >
        Served by hooks.confeature.io, a dedicated ingress host that
        persists no request logs. The path token is the integration's
        credential, which Confeature stores only as a hash; this host keeps
        the plaintext out of every Confeature log. The ingress hashes the
        token and hands the api only that hash, never the token or the
        request URL.
      servers:
        - url: https://hooks.confeature.io
          description: Release Guardian webhook ingress
      tags: [Guardian]
      # NO security — authenticity is the path token. Body is ignored for auth in v1.
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/NotJsonWrite"
        "403":
          $ref: "#/components/responses/CrossOriginWrite"
        "202":
          description: Signal accepted (whether or not it correlated).
        "404":
          description: Unknown/disabled/malformed token (anti-enumeration).
        "429":
          description: Rate limited.
