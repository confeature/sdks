  /v1/guardian/events/{eventId}/rollback:
    post:
      operationId: rollbackGuardianEvent
      summary: One-click rollback of the suspect flag-value change.
      tags: [Guardian]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Override the value-moved-on guard (roll back even if the flag's value changed since the suspect change).
                reason:
                  type: string
                  description: Mandatory note if the scope requires one.
      responses:
        "200":
          description: >
            Rolled back — the suspect flag's draft value restored and the event
            marked rolled_back. The served value is restored (and re-published
            for this environment only) when SDKs are still served the suspect
            change; `servedValueChanged` reports whether it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianRollbackResult"
        "400":
          description: A change note (reason) is required for this change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The flag's value changed since the suspect (use force to override).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianValueChanged"
        "422":
          description: Rollback not available for this change type (not a flag-value change).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found / cross-org.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # CLI browser device-flow auth. Management-plane only —
  # NONE of these enter the SDK config_v6 wire / wire-cases corpus. The
  # device authorization grant (RFC 8628): authorize → (browser approve via a
  # cookie session) → token poll mints a long-lived, user-scoped, revocable
  # bearer (the `cli-token` source). Auth separation: the public
  # authorize / token endpoints never read account data and only yield a token
  # AFTER an authenticated cookie-session approval.
  /v1/cli/device/authorize:
    post:
      operationId: cliDeviceAuthorize
      summary: Start a CLI device-flow login (public; IP rate-limited).
      tags: [CLI Auth]
      # NO security — public. The minted device_code becomes the poll credential.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceAuthorizeRequest"
      responses:
        "200":
          description: Device + user codes and the verification URIs (RFC 8628).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceAuthorizeResponse"
        "429":
          description: Rate limited (per IP).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/device/token:
    post:
      operationId: cliDeviceToken
      summary: Poll for the CLI device-flow token (public; device_code rate-limited).
      tags: [CLI Auth]
      # NO security — the device_code IS the credential. A token is returned
      # ONLY when the matching request is approved; otherwise an RFC 8628 error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceTokenRequest"
      responses:
        "200":
          description: Approved — the minted token (returned ONCE) + identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceTokenSuccess"
        "400":
          description: RFC 8628 poll state (authorization_pending / slow_down / expired_token / access_denied).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceTokenError"
        "429":
          description: Rate limited (per device_code).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/device/approve:
    post:
      operationId: cliDeviceApprove
      summary: Approve a pending CLI device code (cookie-session authed).
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceDecisionRequest"
      responses:
        "200":
          description: Approved — the waiting poll will mint a token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceDecisionResponse"
        "401":
          description: No valid web session (an anonymous visitor cannot approve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown / expired / already-acted code (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/device/deny:
    post:
      operationId: cliDeviceDeny
      summary: Deny a pending CLI device code (cookie-session authed).
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliDeviceDecisionRequest"
      responses:
        "200":
          description: Denied — the waiting poll will end cleanly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliDeviceDecisionResponse"
        "401":
          description: No valid web session (an anonymous visitor cannot deny).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown / expired / already-acted code (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/logout:
    post:
      operationId: cliLogout
      summary: Revoke the presenting CLI token (cli-token authed; idempotent).
      tags: [CLI Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token revoked (idempotent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliLogoutResponse"
        "401":
          description: No valid CLI token presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/tokens:
    get:
      operationId: listCliTokens
      summary: List the session user's own CLI logins (cookie-session authed).
      description: >
        Owner-scoped list of the signed-in user's `cli_token` rows for the
        dashboard revoke surface. NEVER returns the token hash or
        plaintext.
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session user's own CLI logins (no hash / plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliTokenList"
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/cli/tokens/{id}:
    delete:
      operationId: revokeCliToken
      summary: Revoke the caller's own CLI login (cookie-session authed; idempotent).
      description: >
        Owner-scoped revoke for the dashboard. A token belonging to
        another user (or an unknown id) returns the SAME uniform 404 — no
        cross-user enumeration. Idempotent: a second revoke of the caller's own
        already-revoked token is a 204 no-op.
      tags: [CLI Auth]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked (idempotent).
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id or another user's token (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/authorize/approve:
    post:
      operationId: mcpAuthorizeApprove
      summary: Approve a pending MCP client authorization (cookie-session authed).
      description: >
        Called by the dashboard MCP consent page when the signed-in user
        approves a remote MCP client's authorization request.
        Validates the session + the `state`'s `mcp:authreq` KV entry (must
        exist, match `client_id`), mints a bridged, org-scoped `mcp_token` for
        the session user's active org, writes a one-time `mcp:handoff:{code}`
        record (TTL 120 s, delete-on-read), and returns the MCP server's
        callback URL. The response NEVER carries the token plaintext — it travels only
        via delete-on-read KV.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAuthorizeApproveRequest"
      responses:
        "200":
          description: Approved — the callback URL the MCP server completes the grant with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAuthorizeRedirectResponse"
        "400":
          description: Unknown / expired `state` or client mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid web session (an anonymous visitor cannot approve).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/authorize/deny:
    post:
      operationId: mcpAuthorizeDeny
      summary: Deny a pending MCP client authorization (cookie-session authed).
      description: >
        Called by the dashboard MCP consent page when the signed-in user
        declines. Validates the session, deletes the
        `mcp:authreq:{state}` KV entry, and returns the MCP server's callback URL
        carrying `error=access_denied`. No token is minted.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAuthorizeDenyRequest"
      responses:
        "200":
          description: Denied — the callback URL carrying error=access_denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAuthorizeRedirectResponse"
        "400":
          description: Unknown / expired `state`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid web session (an anonymous visitor cannot deny).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/tokens:
    get:
      operationId: listMcpTokens
      summary: List the session user's own MCP connection credentials (cookie-session authed).
      description: >
        Owner-scoped list of the signed-in user's bridged `mcp_token` rows — the
        credentials backing their MCP connections. Each entry
        is a non-secret summary (which client, when created, when last used,
        whether revoked, when it expires). NEVER returns the token hash, the
        plaintext, or the grant id.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session user's own MCP credentials (no hash / plaintext).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenList"
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp/tokens/{id}:
    delete:
      operationId: revokeMcpToken
      summary: Revoke the caller's own MCP credential (cookie-session authed; idempotent).
      description: >
        Owner-scoped revoke of a bridged `mcp_token`. Sets
        `revoked_at` so the credential is refused on its next management call,
        then — if the row's grant is linked — fires a best-effort internal hop to
        invalidate the OAuth grant in the MCP server (the grant-invalidate cascade;
        failure is tolerated, never blocks the revoke). A token belonging to
        another user (or an unknown id) returns the SAME uniform 404 — no
        cross-user enumeration. Idempotent: a second revoke of the caller's own
        already-revoked token is a 204 no-op.
      tags: [MCP Auth]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Credential revoked (idempotent).
        "401":
          description: No valid web session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown id or another user's credential (uniform — no enumeration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Management API bearer token. Each token carries a list of
        scopes (e.g., `product:write`, `config:publish`); the API
        enforces scope on every /v1/* route.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-cfsession
      description: >
        Opaque session id (UUID v4). Issued by POST /v1/auth/login.
        The cookie is HttpOnly, Secure, SameSite=Strict, Path=/,
        Max-Age=604800. The api validates by point-reading the
        `sessions` table in D1; sign-out (POST /v1/auth/logout)
        deletes the session row globally.
  parameters:
    ConfigIfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema:
        type: string
      description: >
        The strong, quoted `ETag` of the config the SDK already holds,
        compared verbatim. A match answers `304 Not Modified`.
    ConfigSdkVersion:
      in: query
      name: sdk
      required: false
      schema:
        type: string
      description: >
        The SDK's name and version, as every ConfigCat-compatible SDK
        sends it. Informational: it feeds the server-side deprecation
        signal and never changes the response.
    ValueWriteReason:
      in: query
      name: reason
      required: false
      schema:
        type: string
        maxLength: 1000
      description: >
        The change note for the audit log. Required (400 reason_required)
        when the environment or its product requires a reason for changes.
    ValueWriteBypassApproval:
      in: query
      name: bypassApproval
      required: false
      schema:
        type: string
        enum: ["true", "false"]
      description: >
        Accepted for ConfigCat compatibility. Confeature has no approval
        flow, so it has no effect, and it never bypasses a required reason.
    ValueWriteLatestVersionId:
      in: query
      name: latestVersionId
      required: false
      schema:
        type: string
        format: uuid
      description: >
        The `lastVersionId` the client last read. When it no longer matches
        the stored value, the write is refused with 409 and nothing changes.
  responses:
    ConfigV6:
      description: Raw config_v6 JSON payload.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ConfigCacheControl"
        ETag:
          $ref: "#/components/headers/ConfigETag"
        Last-Modified:
          $ref: "#/components/headers/ConfigLastModified"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigV6"
    ConfigV6NotModified:
      description: >
        The config is unchanged since the `ETag` sent in `If-None-Match`.
        No body; the SDK keeps its cached config.
      headers:
        Cache-Control:
          $ref: "#/components/headers/ConfigCacheControl"
        ETag:
          required: true
          description: >
            The config's current strong ETag — always present on a 304,
            which can only answer a matching `If-None-Match`.
          schema:
            type: string
        Last-Modified:
          $ref: "#/components/headers/ConfigLastModified"
    ConfigV6AccessDenied:
      description: >
        No config is served for this SDK key (ConfigCat's answer for an
        unknown key: `AccessDenied`). SDKs report it as an invalid SDK
        key. It does not mean the key was revoked.
      content:
        application/xml:
          schema:
            type: string
          example: |-
            <?xml version="1.0" encoding="UTF-8"?>
            <Error><Code>AccessDenied</Code><Message>Access Denied</Message></Error>
    ValueWriteBadRequest:
      description: >
        Invalid request: a value that does not respect the setting's type or
        bounds, more than one value field, a predefined variation, targeting
        rules (#883) or a percentage evaluation attribute (#885), an invalid
        JSON Patch, a missing required reason, environment and setting in
        different products, or a config whose evaluationVersion is not v2.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValueWriteConflict:
      description: >
        The stored value changed since `latestVersionId` (or since this
        request read it). Nothing was written; read the value again and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValueNotLive:
      description: >
        The value is saved but not live yet. Retry the same request after
        Retry-After.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValueNotLive"
  headers:
    ConfigCacheControl:
      required: true
      description: >
        Always `max-age=0, must-revalidate`, as ConfigCat's CDN sends it:
        caches must revalidate before reuse, so a stale flag set is never
        served from a heuristic freshness window.
      schema:
        type: string
        const: max-age=0, must-revalidate
    ConfigETag:
      required: false
      description: >
        Strong, quoted, content-derived ETag. Present whenever the config
        was published with one; send it back as `If-None-Match`.
      schema:
        type: string
    ConfigLastModified:
      required: false
      description: >
        HTTP-date (IMF-fixdate) of the config's last write to the edge.
        Present whenever the publish recorded it.
      schema:
        type: string
  schemas:
    AuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_credentials"
            - "invalid_request"
            - "unauthorized"
            - "ambiguous_credential"
            - "bootstrap_consumed"
            - "bootstrap_unauthorized"
      description: >
        Auth-surface error envelope. On /v1/auth/login an unknown email and
        a wrong password return the same error, so the response never
        reveals whether an account exists.
    PasswordResetAck:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Neutral, non-committal acknowledgement copy.
          example: If an account exists for that email, we've sent a reset link.
      description: >
        The single, constant 200 body returned by BOTH password-reset endpoints.
        The request endpoint returns it identically for a
        real account, an SSO-only account, an unknown email, or a rate-limited
        caller (no account enumeration); the confirm endpoint returns it on a
        successful password change. Carries no token, no session, and no field
        that discloses account existence.
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: integer
          description: Unix ms timestamp at user creation.
      description: >
        A human operator. Identified by email (lowercase canonical).
        Issued sessions live in the server-side `sessions` table; this
        shape is the wire representation returned by /v1/auth/login,
        /v1/auth/me, and /v1/auth/bootstrap.
    SessionProbe:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
          description: Boolean session signal — true iff a valid cookie session is present.
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
          description: The User record when authenticated, else null.
      description: >
        Result of the public session probe GET /v1/auth/session.
        Always returned with HTTP 200 so a probe on a public route never
        surfaces a console-visible 401.
    Session:
      type: object
      required: [id, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: integer
          description: Unix ms timestamp at session creation.
        expires_at:
          type: integer
          description: >
            Unix ms; refreshed on hot reads (sliding 7-day window,
            debounced to write only on ≥5-minute extends).
      description: >
        Server-side session record. Documented for completeness — the
        wire never carries a Session object directly; the cookie value
        IS the session id. Future endpoints ("list my sessions" / "sign
        out everywhere") will return this shape.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build identifier.
    Version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          description: Build identifier (typically a git SHA in production, "dev" locally).
    ConfigV6:
      type: object
      description: >
        The ConfigCat config_v6 payload. The exact schema is governed by
        ConfigCat's specification; this contract treats it as an opaque
        object to preserve byte-for-byte forwarding from KV. SDKs are
        responsible for parsing per ConfigCat's documented format.
      additionalProperties: true
    Error:
      type: object
      description: >
        Uniform error envelope returned by 4xx responses on /v1/* routes.
        `error` is a stable machine-readable token (e.g., `not_found`,
        `conflict`, `forbidden`, `unauthorized`); `message` is a
        human-readable explanation.
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
    InviteMembersRequest:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
            minLength: 5
            maxLength: 254
          description: >
            Non-empty array of invitee email addresses, capped at 20 per
            request. Each address is lower-cased server-side before
            storage and mints its own invitation row, its own one-time
            token, and its own 7-day expiry. The per-entry bounds match
            the address bounds Confeature applies elsewhere. The 20-item
            cap keeps the batch within D1's 100-statement `batch()` limit
            and SQLite's bound-variable ceiling, so an oversized batch
            fails fast with a clean 400.
        permissionGroupId:
          type: integer
          default: 0
          description: >
            Identifier of the permission group the invited members join.
            Confeature v1 has no permission-groups feature — the only
            accepted value is `0` (a placeholder, the same rule as
            `InvitationModel.permissionGroupId`); a non-zero value is
            rejected with 400. Omitting the field defaults it to `0`. A
            future release that introduces permission groups gives this
            field real values.
      description: >
        Request to invite one or more members in a single call — mirrors
        ConfigCat's `InviteMembersRequest`. Email uniqueness is checked
        best-effort against the existing `users` table: if ANY address
        already belongs to a registered user the whole batch is rejected
        with 409 and nothing is minted (the batch is all-or-nothing). The
        real safety net is the `UNIQUE(email)` constraint that fires at
        redemption time.
    InviteCreateResultEntry:
      type: object
      required: [email, invite_token, expires_at]
      properties:
        email:
          type: string
          format: email
          description: The invitee address this entry was minted for (lower-cased).
        invite_token:
          type: string
          pattern: "^confeature_invite_[A-Za-z0-9_-]{48}$"
          description: >
            Plaintext invite token, shape `confeature_invite_<48 url-safe
            chars>` (≈ 288 bits of entropy). Returned ONCE; never
            persisted server-side (only its SHA-256 digest is stored).
            The back-office UI constructs the full link
            (`<origin>/signup?invite=<token>`).
        expires_at:
          type: integer
          description: Unix epoch seconds at which this invitation expires (created_at + 7 days).
      description: >
        One element of the 201 response array of POST /v1/users/invite —
        the invitation minted for one email in the batch. The plaintext
        token is the only sensitive value on the wire; the back-office
        MUST hold it in a function-scoped variable and never log it.
    AcceptInviteRequest:
      type: object
      required: [invite_token, password]
      properties:
        invite_token:
          type: string
          pattern: "^confeature_invite_[A-Za-z0-9_-]{48}$"
          description: The plaintext token from the invite link's `?invite=` parameter.
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: >
            New user's password. Same minimum-strength rule as
            /v1/auth/bootstrap and /v1/auth/login. Hashed with
            argon2id server-side; never logged in plaintext.
      description: >
        Request body for POST /v1/auth/accept-invite. The token is
        observed on the wire exactly twice in its lifetime (here and in
        the matching 201 from /v1/users/invite); the password is
        observed once (here) and is hashed before persistence.
    SsoStartRequest:
      type: object
      properties:
        return_to:
          type: string
          description: >
            Optional path the back-office should land the operator on
            after a successful callback (e.g. `/products`). Bounded by
            the issuing back-office's own routing; the api treats it as
            opaque and round-trips it through KV state.
      description: >
        Request body for POST /v1/auth/sso/{provider}/start. All fields
        are optional in v0.1.
    SsoStartResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: >
            Fully-formed OIDC authorization URL with `state`, `nonce`,
            `code_challenge`, and `code_challenge_method=S256` baked in.
            The back-office opens this in the same tab (top-level
            navigation).
      description: >
        200 response of POST /v1/auth/sso/{provider}/start. The client
        navigates to `redirect_url`; the matching callback POSTs to
        `/v1/auth/sso/{provider}/callback` once the provider redirects
        back with `code` + `state` on the query string.
    SsoCallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
          description: >
            Provider-issued authorization code (opaque). The back-office
            extracts it from the provider's redirect query string.
        state:
          type: string
          description: >
            The state value the provider echoed back. Must match the KV
            state entry minted by `ssoStart`; mismatched / missing /
            already-consumed state returns the generic 400 envelope.
      description: >
        Request body for POST /v1/auth/sso/{provider}/callback. Posted
        by the back-office after extracting `code` and `state` from the
        provider's redirect.
    SsoError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_sso_state"
            - "sso_provider_unavailable"
          description: >
            Failure-class signal. `invalid_sso_state` accompanies a 400
            (state missing / consumed / malformed / tampered, userinfo
            missing email, malformed body — all five branches share
            this code). `sso_provider_unavailable`
            accompanies a 502 (token endpoint or userinfo endpoint
            returned an error or was unreachable — both branches share
            this code). The user-facing `message`
            is identical between the two; the HTTP status is the
            broad-class signal.
        message:
          type: string
          description: >
            Human-readable explanation suitable for display in the
            back-office. Identical across all branches within a status
            class — no information leakage about which specific failure
            fired.
      description: >
        Uniform error envelope for `/v1/auth/sso/*` failures. Used by
        the 400-class and 502-class responses of `ssoCallback` and by
        the 404 of `ssoStart`. Errors are deliberately generic so a
        response never reveals which specific check failed.
    SsoProviderListItem:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: >
            Operator-chosen provider id — the same slug that appears in
            `/v1/auth/sso/{provider}/start` and `/callback` route
            placeholders. Public by construction; appears in the
            authorization-URL query string anyway.
        label:
          type: string
          description: >
            Human-readable button text rendered by the back-office sign-
            in page ("Sign in with <label>"). Defaults to `id` when the
            operator omits the `label` field in CONFEATURE_SSO_PROVIDERS.
      description: >
        Public-safe shape of a single registered SSO provider as exposed
        by `listSsoProviders`. NEVER carries any secret-bearing field.
    SsoProviderListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SsoProviderListItem"
          description: >
            Every registered provider in `CONFEATURE_SSO_PROVIDERS`
            order. Empty list when no providers are configured (the
            back-office sign-in page hides the SSO block silently in
            that case).
      description: >
        200 response of GET /v1/auth/sso/providers. The back-office
        renders one "Sign in with <label>" button per item above the
        existing email+password form. The built-in
        consumer `google` provider (id `google`, label `Google`) appears
        here automatically when `GOOGLE_CLIENT_ID` + `GOOGLE_CLIENT_SECRET`
        are configured.
    ConnectedMethods:
      type: object
      required: [password, google]
      properties:
        password:
          type: boolean
          description: True when the account has an email+password credential set.
        google:
          type: boolean
          description: True when a Google identity is linked to the account.
      description: >
        Sign-in methods connected to the authenticated account, derived
        read-only from the `users` row. No new
        storage — `password` is `password_hash IS NOT NULL`, `google` is
        `sso_provider_id = 'google' AND sso_subject IS NOT NULL`.
    MeWithMethods:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            methods:
              $ref: "#/components/schemas/ConnectedMethods"
      description: >
        200 response of GET /v1/auth/me. The base `User` shape plus an
        additive, optional `methods` object (present for cookie sessions;
        omitted for management-token principals, which have no connected-
        method concept). Backward-compatible with the prior plain `User`
        response.
    LinkRequiredResponse:
      type: object
      required: [status, challenge_id, email]
      properties:
        status:
          type: string
          enum: ["link_required"]
          description: Discriminator for the link-required branch of the callback.
        challenge_id:
          type: string
          description: >
            Single-use link-challenge id (~10 min TTL, stored in KV). The
            back-office prompts for the existing password and POSTs it
            with this id to /v1/auth/link/google. Carries no session
            authority on its own and never contains a token or password.
        email:
          type: string
          format: email
          description: The verified Google email matching the existing password account.
      description: >
        Returned by /v1/auth/sso/google/callback when the verified Google
        email matches an existing PASSWORD account not yet linked to
        Google. NO session cookie is set and NO
        mutation occurs; the user must confirm ownership with their
        password via /v1/auth/link/google.
    SsoCallbackResult:
      oneOf:
        - $ref: "#/components/schemas/User"
        - $ref: "#/components/schemas/LinkRequiredResponse"
        - $ref: "#/components/schemas/LinkedResponse"
      description: >
        Discriminated 200 result of /v1/auth/sso/{provider}/callback. A
        plain `User` (with a session cookie) for the signed-in branches;
        a `LinkRequiredResponse` (no cookie) for the consumer-google
        password-account-not-yet-linked branch; a `LinkedResponse`
        (`status: "linked"`, session unchanged) when the state carried a
        `link_user_id` and the authenticated user connected Google from the
        account page.
    LinkGoogleStartRequest:
      type: object
      properties:
        return_to:
          type: string
          description: >
            Optional path the back-office should land the operator on after
            a successful account-link callback. Defaults to
            `/account/security`. The api treats it as opaque and round-trips
            it through KV state (never forwarded to Google).
      description: >
        Request body for POST /v1/auth/link/google/start. All fields are
        optional.
    LinkedResponse:
      type: object
      required: [status, return_to, methods]
      properties:
        status:
          type: string
          enum: ["linked"]
          description: >
            Discriminator for the account-link branch of the callback. The
            authenticated user just connected Google from the account page;
            the session is unchanged (no new cookie). The client routes to
            `return_to` and toasts "Google connected".
        return_to:
          type: string
          description: >
            The path the back-office should navigate to (the `return_to`
            supplied to /v1/auth/link/google/start, default
            `/account/security`).
        methods:
          $ref: "#/components/schemas/ConnectedMethods"
      description: >
        Returned by /v1/auth/sso/google/callback when the KV state record
        carried a `link_user_id` (minted by /v1/auth/link/google/start) and
        the verified Google identity was successfully attached to the
        authenticated account. NO session cookie is set —
        the user stays logged in as themselves; `methods.google` is now
        `true`.
    LinkAccountError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "email_mismatch"
            - "identity_conflict"
          description: >
            Failure-class signal for the account-link callback branch (409).
            `email_mismatch` — the verified Google email does not equal the
            authenticated account's email; `identity_conflict` — the Google
            `sub` is already linked to a different account, or the account is
            already linked to a different Google identity. Nothing is changed.
        message:
          type: string
          description: >
            Human-readable explanation. For `email_mismatch` it names the
            account's own email ("Connect the Google account for
            <your account email>.") and never references any other account.
      description: Uniform 409 error envelope for the account-link callback branch.
    LinkGoogleRequest:
      type: object
      required: [challenge_id, password]
      properties:
        challenge_id:
          type: string
          description: The single-use link-challenge id from the callback's link_required branch.
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: >
            The existing account's password. Verified with argon2id
            (timing-equalised on a wrong/unknown password); never logged.
      description: Request body for POST /v1/auth/link/google.
    LinkGoogleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "invalid_credentials"
            - "invalid_link_challenge"
            - "identity_conflict"
          description: >
            Failure-class signal. `invalid_credentials` (401) — wrong
            password; `invalid_link_challenge` (410) — challenge missing /
            expired / already used; `identity_conflict` (409) — the Google
            `sub` is already linked to another account.
        message:
          type: string
      description: Uniform error envelope for POST /v1/auth/link/google failures.
    SetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: >
            New password (same minimum-strength rule as signup). Hashed
            with argon2id server-side; never logged in plaintext.
      description: Request body for POST /v1/auth/set-password.
    SetPasswordResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
          description: True when the password was set.
      description: 200 response of POST /v1/auth/set-password.
    SetPasswordError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ["password_already_set"]
          description: The account already has a password set — no overwrite (409).
        message:
          type: string
      description: 409 error envelope for POST /v1/auth/set-password.
    UnlinkGoogleResponse:
      type: object
      required: [methods]
      properties:
        methods:
          $ref: "#/components/schemas/ConnectedMethods"
      description: >
        200 response of POST /v1/auth/unlink/google. The
        post-mutation connected methods so the client can reflect the
        disconnected state without re-fetching GET /v1/auth/me. After a
        successful unlink `methods.google` is always `false`.
    UnlinkGoogleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: ["last_sign_in_method"]
          description: >
            Google is the account's only sign-in method (no password set) —
            unlinking would lock the account out (409). Nothing is changed.
        message:
          type: string
      description: 409 error envelope for POST /v1/auth/unlink/google.
    ScopeSchema:
      type: string
      pattern: "^(?:\\*|[a-z][a-z-]*:(?:\\*|[a-z][a-z-]+))$"
      description: >
        Either `*` (super-admin), or `<resource>:<action>` where action
        is `*` or a lowercase verb (e.g., `product:write`,
        `config:publish`).
    CreateTokenRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScopeSchema"
        expires_at:
          type: integer
          minimum: 1
          description: Unix epoch ms after which the token is no longer valid.
    TokenSummary:
      type: object
      required:
        - id
        - name
        - scopes
        - expires_at
        - created_at
        - created_by_token_id
        - revoked_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ScopeSchema"
        expires_at:
          type: number
          nullable: true
        created_at:
          type: number
        created_by_token_id:
          type: string
          nullable: true
        revoked_at:
          type: number
          nullable: true
    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/TokenSummary"
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: Plaintext token — shown only once at creation.
    TokenList:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenSummary"
    ProductModel:
      type: object
      description: >
        Details of the Product. Schema aligned 1:1 with ConfigCat's
        `ProductModel` (configcat-publicapi-node-client/model/product-model.ts).
      required:
        - organization
        - productId
        - name
        - description
        - order
        - reasonRequired
        - approveRequired
      properties:
        organization:
          $ref: "#/components/schemas/OrganizationModel"
        productId:
          type: string
          format: uuid
          description: Identifier of the Product.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of the Product.
        description:
          type: string
          nullable: true
          description: Description of the Product.
        order:
          type: integer
          description: >
            The order of the Product represented on the dashboard. Determined
            from an ascending sequence of integers.
        reasonRequired:
          type: boolean
          description: >
            Determines whether a mandatory reason must be given every time the
            Feature Flags or Settings within a Product are saved. Always false
            in Confeature v1 — carried for wire parity; populated when the
            product-preferences surface ships.
        approveRequired:
          type: boolean
          description: >
            Whether changes need an approval. Always false: Confeature has no
            approval flow. Carried for wire parity with ConfigCat.
    CreateProductRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The name of the Product.
        description:
          type: string
          nullable: true
          description: The description of the Product.
        order:
          type: integer
          nullable: true
          description: >
            The order of the Product represented on the dashboard. When
            omitted, the next integer in the organization's sequence is
            assigned.
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
          description: The name of the Product.
        description:
          type: string
          nullable: true
          description: The description of the Product.
        order:
          type: integer
          nullable: true
          description: The order of the Product represented on the dashboard.
    EvaluationVersion:
      type: string
      description: >
        The evaluation version of a Config. Aligned 1:1 with ConfigCat's
        `EvaluationVersion` (configcat-publicapi-node-client/model/
        evaluation-version.ts). Confeature only ever produces `v2`; `v1` is
        carried for wire parity.
      enum:
        - v1
        - v2
    ConfigModel:
      type: object
      description: >
        Details of the Config. Schema aligned 1:1 with ConfigCat's
        `ConfigModel` (configcat-publicapi-node-client/model/config-model.ts).
      required:
        - product
        - configId
        - name
        - description
        - order
        - migratedConfigId
        - evaluationVersion
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        configId:
          type: string
          format: uuid
          description: Identifier of the Config.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of the Config.
        description:
          type: string
          nullable: true
          description: Description of the Config.
        order:
          type: integer
          description: >
            The order of the Config represented on the dashboard. Determined
            from an ascending sequence of integers.
        migratedConfigId:
          type: string
          format: uuid
          nullable: true
          description: >
            Identifier of the Config the current Config was migrated from.
            Always null in Confeature v1 — carried for wire parity.
        evaluationVersion:
          $ref: "#/components/schemas/EvaluationVersion"
    CreateConfigRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The name of the Config.
        description:
          type: string
          nullable: true
          description: The description of the Config.
        order:
          type: integer
          nullable: true
          description: >
            The order of the Config represented on the dashboard. When
            omitted, the next integer in the product's sequence is assigned.
        evaluationVersion:
          allOf:
            - $ref: "#/components/schemas/EvaluationVersion"
          description: >
            The evaluation version of the Config. When omitted, defaults to
            `v2`.
    UpdateConfigRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
          description: The name of the Config.
        description:
          type: string
          nullable: true
          description: The description of the Config.
        order:
          type: integer
          nullable: true
          description: The order of the Config represented on the dashboard.
    SettingKey:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,255}$"
      description: Stable lookup key for a setting inside a config.
    SettingType:
      type: string
      enum: [boolean, string, int, double]
      description: >
        The type of a Feature Flag or Setting. Aligned 1:1 with ConfigCat's
        `SettingType` enum (configcat-publicapi-node-client/model/setting-type.ts)
        — exactly the four members `boolean`, `string`, `int`, `double`, in that
        order, serialised as a lowercase string.
    Setting:
      type: object
      description: >
        A Setting describes a feature flag's identity and shape only — it
        carries NO value. Aligned 1:1 with ConfigCat's `SettingModel` /
        `SettingDataV2Model`, which have no value field; a setting's value is
        per-environment, read and written via the per-environment value
        endpoint (`SettingValue`).
        Carries the human-readable `name` (required) and optional `hint`
        (ConfigCat `SettingModel.name`/`SettingModel.hint`); both are
        management-plane only and NOT part of the SDK config delivery payload.
      required:
        - settingId
        - config_id
        - key
        - name
        - type
        - created_at
        - updated_at
      properties:
        settingId:
          type: integer
          format: int64
          minimum: 1
          description: >
            The stable numeric identity of the Setting. Server-assigned,
            monotonically allocated, never reused. Aligned 1:1 with ConfigCat's
            `SettingModel.settingId`
            (configcat-publicapi-node-client/model/setting-model.ts).
            Output-only — the server assigns it; it is NOT accepted
            on `CreateSettingRequest`.
        config_id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Human-readable display label for the feature flag. Aligned 1:1 with
            ConfigCat's `SettingModel.name`. Management-plane only — NOT part of
            the SDK config delivery (`config_v6`) payload. For settings created
            before this field existed, the value is backfilled to the setting's
            `key`.
        hint:
          type: string
          maxLength: 1000
          nullable: true
          description: >
            Optional operator-facing description/hint. Aligned 1:1 with
            ConfigCat's `SettingModel.hint`. Management-plane only; null when
            unset.
        type:
          $ref: "#/components/schemas/SettingType"
        created_at:
          type: number
        updated_at:
          type: number
    CreateSettingRequest:
      type: object
      description: >
        The create-setting request body accepts `key`, `name` (required), `type`
        and an optional `hint`. A new setting carries no value — its
        per-environment value rows are seeded server-side with the setting type's
        zero value (`boolean → false`, `string → ""`, `int → 0`, `double → 0`),
        then edited via the per-environment value endpoint. `name`/`hint`
        mirror ConfigCat's `SettingModel`; the
        value-seeding behaviour is unchanged by their addition.
      required:
        - key
        - name
        - type
      properties:
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable display label (ConfigCat SettingModel.name).
        hint:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional operator-facing hint (ConfigCat SettingModel.hint).
        type:
          $ref: "#/components/schemas/SettingType"
    UpdateSettingRequest:
      type: object
      description: >
        Partial update of a Setting's mutable METADATA only. Every field is
        optional and only the fields present in the body are written (mirrors
        `UpdateConfigRequest`). `name`/`hint` map 1:1 to
        ConfigCat's `SettingModel.name`/`SettingModel.hint`. The setting's `key`
        and `type` are IMMUTABLE — they are NOT on this body; its per-environment
        VALUE is edited via the per-environment value endpoint, not here.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable display label (ConfigCat SettingModel.name).
        hint:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional operator-facing hint (ConfigCat SettingModel.hint).
    SettingModel:
      type: object
      description: >
        A Feature Flag or Setting in a config list. Aligned 1:1 with
        ConfigCat's `SettingModel` (get-settings). It carries no value: a
        value is per-environment (`SettingFormulaModel`). `tags` and
        `predefinedVariations` are always empty in Confeature.
      required:
        - settingId
        - key
        - name
        - hint
        - order
        - settingType
        - isJson
        - configId
        - configName
        - createdAt
        - tags
        - predefinedVariations
      properties:
        settingId:
          type: integer
          format: int32
          description: Identifier of the Feature Flag or Setting.
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
          description: Name of the Feature Flag or Setting.
        hint:
          type: string
          nullable: true
          description: Description of the Feature Flag or Setting.
        order:
          type: integer
          format: int32
          description: >
            The order of the setting in its config, from 0, by creation.
        settingType:
          $ref: "#/components/schemas/SettingType"
        isJson:
          type: boolean
          description: Always false in Confeature.
        configId:
          type: string
          format: uuid
        configName:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          maxItems: 0
          description: Tags are not supported yet; always empty.
          items:
            type: object
        predefinedVariations:
          type: array
          maxItems: 0
          description: Predefined variations are not supported yet; always empty.
          items:
            type: object
    SettingDataV2Model:
      type: object
      description: >
        The setting a v2 value belongs to. Aligned 1:1 with ConfigCat's
        `SettingDataV2Model`. The creator fields are always null: Confeature
        does not return member identities through this model.
      required:
        - settingId
        - key
        - name
        - hint
        - settingType
        - isJson
        - order
        - createdAt
        - creatorEmail
        - creatorFullName
        - predefinedVariations
        - isWatching
      properties:
        settingId:
          type: integer
          format: int32
        key:
          $ref: "#/components/schemas/SettingKey"
        name:
          type: string
        hint:
          type: string
          nullable: true
        settingType:
          $ref: "#/components/schemas/SettingType"
        isJson:
          type: boolean
        order:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
          nullable: true
        creatorEmail:
          type: string
          nullable: true
        creatorFullName:
          type: string
          nullable: true
        predefinedVariations:
          type: array
          maxItems: 0
          items:
            type: object
        isWatching:
          type: boolean
    ValueModel:
      type: object
      description: >
        A typed value, as ConfigCat's `ValueModel`: exactly the field that
        matches the setting's type is non-null.
      required:
        - boolValue
        - stringValue
        - intValue
        - doubleValue
        - predefinedVariationId
      properties:
        boolValue:
          type: boolean
          nullable: true
        stringValue:
          type: string
          nullable: true
        intValue:
          type: integer
          format: int32
          nullable: true
        doubleValue:
          type: number
          format: double
          nullable: true
        predefinedVariationId:
          type: string
          format: uuid
          nullable: true
          description: Always null in Confeature.
    UpdateValueModel:
      type: object
      additionalProperties: false
      description: >
        The value to set, as ConfigCat's `UpdateValueModel`: exactly one
        field, the one matching the setting's type, is non-null.
        `predefinedVariationId` is refused (400).
      properties:
        boolValue:
          type: boolean
          nullable: true
        stringValue:
          type: string
          maxLength: 100000
          nullable: true
        intValue:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
          nullable: true
        doubleValue:
          type: number
          format: double
          nullable: true
        predefinedVariationId:
          type: string
          format: uuid
          nullable: true
    UpdateEvaluationFormulaModel:
      type: object
      additionalProperties: false
      description: >
        The body of a v2 value PUT, as ConfigCat's
        `UpdateEvaluationFormulaModel`. A full replace: an omitted field is
        reset.
      required:
        - defaultValue
      properties:
        defaultValue:
          $ref: "#/components/schemas/UpdateValueModel"
        targetingRules:
          type: array
          nullable: true
          maxItems: 0
          description: Must be empty or null until targeting lands (#883).
          items:
            type: object
        percentageEvaluationAttribute:
          type: string
          nullable: true
          maxLength: 1000
          description: Must be null until percentage options land (#885).
    FeatureFlagLimitations:
      type: object
      description: >
        The limits this setting's values are held to, as ConfigCat's
        `FeatureFlagLimitations`. Every targeting limit is 0 until targeting
        lands (#883).
      required:
        - maxPercentageOptionCount
        - maxTargetingRuleCount
        - maxComparisonValueLength
        - maxComparisonValueListLength
        - maxComparisonValueListItemLength
        - maxStringFlagValueLength
        - maxConditionPerTargetingRuleCount
      properties:
        maxPercentageOptionCount:
          type: integer
          format: int32
        maxTargetingRuleCount:
          type: integer
          format: int32
        maxComparisonValueLength:
          type: integer
          format: int32
        maxComparisonValueListLength:
          type: integer
          format: int32
        maxComparisonValueListItemLength:
          type: integer
          format: int32
        maxStringFlagValueLength:
          type: integer
          format: int32
        maxConditionPerTargetingRuleCount:
          type: integer
          format: int32
    SettingFormulaModel:
      type: object
      description: >
        A setting's value in one environment, as ConfigCat's
        `SettingFormulaModel` (get-setting-value-v2). The person fields are
        always null, `targetingRules` is empty until #883, and approvals are
        not supported, so `approveRequired`, `canBypassApproval` and
        `changeRequestCount` are false / false / 0.
      required:
        - lastVersionId
        - defaultValue
        - targetingRules
        - setting
        - updatedAt
        - percentageEvaluationAttribute
        - lastUpdaterUserEmail
        - lastUpdaterUserFullName
        - integrationLinks
        - settingTags
        - settingIdsWherePrerequisite
        - changeRequestCount
        - config
        - environment
        - readOnly
        - featureFlagLimitations
        - approveRequired
        - canBypassApproval
        - reasonRequired
      properties:
        lastVersionId:
          type: string
          format: uuid
          description: >
            The version of this value. Send it back as `latestVersionId` to
            refuse the write if someone changed the value in between.
        defaultValue:
          $ref: "#/components/schemas/ValueModel"
        targetingRules:
          type: array
          maxItems: 0
          items:
            type: object
        setting:
          $ref: "#/components/schemas/SettingDataV2Model"
        updatedAt:
          type: string
          format: date-time
          nullable: true
        percentageEvaluationAttribute:
          type: string
          nullable: true
        lastUpdaterUserEmail:
          type: string
          nullable: true
        lastUpdaterUserFullName:
          type: string
          nullable: true
        integrationLinks:
          type: array
          maxItems: 0
          items:
            type: object
        settingTags:
          type: array
          maxItems: 0
          items:
            type: object
        settingIdsWherePrerequisite:
          type: array
          maxItems: 0
          items:
            type: integer
            format: int32
        changeRequestCount:
          type: integer
          format: int32
        config:
          $ref: "#/components/schemas/ConfigModel"
        environment:
          $ref: "#/components/schemas/EnvironmentModel"
        readOnly:
          type: boolean
          description: True when the caller cannot write values here.
        featureFlagLimitations:
          $ref: "#/components/schemas/FeatureFlagLimitations"
        approveRequired:
          type: boolean
        canBypassApproval:
          type: boolean
        reasonRequired:
          type: boolean
          description: >
            True when a change note (`reason`) is required for a value change
            in this environment.
    OperationType:
      type: string
      enum: [unknown, add, remove, replace, move, copy, test]
      description: >
        ConfigCat's `OperationType`. `unknown` is accepted by the schema and
        refused (400).
    JsonPatchOperation:
      type: object
      description: One RFC 6902 operation, as ConfigCat's `JsonPatchOperation`.
      required:
        - op
        - path
      properties:
        op:
          $ref: "#/components/schemas/OperationType"
        path:
          type: string
          minLength: 1
          description: The target JSON Pointer (RFC 6901).
        from:
          type: string
          nullable: true
          description: The source JSON Pointer, for move and copy.
        value:
          nullable: true
          description: The value, for add, replace and test.
    SdkKeysModel:
      type: object
      description: >
        The SDK keys for a Config in a specified Environment. Schema aligned
        1:1 with ConfigCat's `SdkKeysModel`
        (configcat-publicapi-node-client/model/sdk-keys-model.ts).
      required:
        - primary
        - secondary
      properties:
        primary:
          type: string
          description: >
            The primary SDK key. Minted in ConfigCat's shape,
            `configcat-sdk-1/<22>/<22>`; an older key keeps
            the legacy `confeature-sdk-1-<32>-<32>` shape and stays valid.
          example: configcat-sdk-1/FAKEfixtureKeyNotRea01/FAKEfixtureKeyNotRea02
        secondary:
          type: string
          nullable: true
          description: >
            The secondary SDK key, in either shape (see `primary`). Null
            when the secondary slot is empty.
    SdkKeyNotFound:
      type: object
      description: >
        404 body of `deleteSdkKey` — the config-in-environment does not exist,
        or is not visible to the caller's organization.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_found]
        message:
          type: string
    SdkKeyConflict:
      type: object
      description: >
        409 body of the SDK-key extensions (Confeature extension). `only_key`
        (`deleteSdkKey`): the only key cannot be deleted — generate a
        secondary first. `secondary_exists` (`rotateSdkKeys`): a secondary
        already exists — delete one of the two keys first.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [only_key, secondary_exists]
        message:
          type: string
    EnvironmentModel:
      type: object
      description: >
        Details of the Environment. Schema aligned 1:1 with ConfigCat's
        `EnvironmentModel` (configcat-publicapi-node-client/model/
        environment-model.ts).
      required:
        - product
        - environmentId
        - name
        - color
        - description
        - order
        - reasonRequired
        - approveRequired
      properties:
        product:
          $ref: "#/components/schemas/ProductModel"
        environmentId:
          type: string
          format: uuid
          description: Identifier of the Environment.
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Name of the Environment.
        color:
          type: string
          nullable: true
          description: The color of the Environment.
        description:
          type: string
          nullable: true
          description: The description of the Environment.
        order:
          type: integer
          description: >
            The order of the Environment represented on the dashboard.
            Determined from an ascending sequence of integers.
        reasonRequired:
          type: boolean
          description: >
            Determines whether a mandatory reason must be given every time
            the Feature Flags or Settings are saved within this Environment.
            Always false in Confeature v1 — carried for wire parity.
        approveRequired:
          type: boolean
          description: >
            Whether changes need an approval. Always false: Confeature has no
            approval flow. Carried for wire parity with ConfigCat.
    CreateEnvironmentModel:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: The name of the Environment.
        color:
          type: string
          nullable: true
          description: The color of the Environment.
        description:
          type: string
          nullable: true
          description: The description of the Environment.
        order:
          type: integer
          nullable: true
          description: >
            The order of the Environment represented on the dashboard. When
            omitted, the next integer in the product's sequence is assigned.
    UpdateEnvironmentModel:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          description: The name of the Environment.
        color:
          type: string
          nullable: true
          description: The color of the Environment.
        description:
          type: string
          nullable: true
          description: The description of the Environment.
        order:
          type: integer
          nullable: true
          description: The order of the Environment represented on the dashboard.
    InvitationModel:
      type: object
      description: >
        Details of an Invitation. Schema aligned 1:1 with ConfigCat's
        `InvitationModel` (configcat-publicapi-node-client/model/
        invitation-model.ts).
      required:
        - invitationId
        - email
        - permissionGroupId
        - createdAt
        - expired
      properties:
        invitationId:
          type: string
          description: Identifier of the Invitation.
        email:
          type: string
          nullable: true
          description: >
            The email address the invitation was sent to. Nullable for
            parity with ConfigCat's model; Confeature always emits a
            non-null value.
        permissionGroupId:
          type: integer
          description: >
            Identifier of the Permission Group the invited user joins.
            Always 0 in Confeature v1 — carried for wire parity (no
            permission-groups feature yet).
        createdAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp the invitation was created.
        expired:
          type: boolean
          description: >
            Whether the invitation has expired. True when the invitation's
            expiry instant has passed; independent of redemption state.
    ValueNotLive:
      type: object
      description: >
        A value write that was saved but did not reach the edge (#879). One
        constant body for every cause.
      required: [error, message]
      properties:
        error:
          type: string
          enum: [not_live]
        message:
          type: string
          enum:
            - "The value is saved but is not live yet. Retry the same request to make it live."
    SettingValue:
      type: object
      description: >
        Per-environment setting value envelope. Matches ConfigCat's shape:
        `value` carries the override; `rolloutRules` and
        `rolloutPercentageItems` MUST be present but empty in phase 1
        (segments / targeting are not yet supported);
        `settingType` is the value's type discriminator. Confeature persists
        only `value` and `settingType` for now.
      required:
        - value
        - rolloutRules
        - rolloutPercentageItems
        - settingType
      properties:
        value:
          oneOf:
            - type: boolean
            - type: string
            - type: number
          description: >
            The per-environment value. Its JSON type MUST respect the setting's
            `settingType` — a boolean for `boolean`, a string for `string`, an
            integer for `int`, any finite number for `double`. Aligned with
            ConfigCat's `SettingValueType` (boolean | number | string).
        rolloutRules:
          type: array
          maxItems: 0
          description: >
            Reserved for targeting rules. MUST be an empty array in phase 1;
            non-empty values return 400 (segments / targeting are not yet
            supported).
          items:
            type: object
        rolloutPercentageItems:
          type: array
          maxItems: 0
          description: >
            Reserved for percentage rollouts. MUST be an empty array in
            phase 1; non-empty values return 400 (segments / targeting are
            not yet supported).
          items:
            type: object
        settingType:
          $ref: "#/components/schemas/SettingType"
    PublishResponse:
      type: object
      required:
        - config_id
        - sdk_keys_updated
        - setting_count
        - published_at
      properties:
        config_id:
          type: string
          format: uuid
        sdk_keys_updated:
          type: integer
          minimum: 0
          description: >
            Number of active SDK keys whose served entry was actually
            (re)written by this publish. A key already serving the published
            payload (same ETag) is not rewritten and is not counted, so a
            publish that changes nothing reports 0.
        setting_count:
          type: integer
          minimum: 0
          description: Number of settings included in the projected payload.
        published_at:
          type: number
          description: Unix epoch ms at which the publish completed.
    OrganizationModel:
      type: object
      description: >
        Details of the Organization. Schema aligned 1:1 with ConfigCat's
        `OrganizationModel` (configcat-publicapi-node-client/model/
        organization-model.ts).
      required: [organizationId, name]
      properties:
        organizationId:
          type: string
          format: uuid
          description: Identifier of the Organization.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Name of the Organization.
    OrganizationAdminModel:
      type: object
      description: >
        Describes an Organization Admin. ConfigCat parity
        (organization-admin-model.ts). `twoFactorEnabled` always
        reports `false` in Confeature v1 — the field is carried for
        wire-shape parity; truthful values arrive when 2FA support
        ships.
      required: [userId, fullName, email, twoFactorEnabled]
      properties:
        userId:
          type: string
          format: uuid
          description: Identifier of the Organization Admin.
        fullName:
          type: string
          description: Name of the Organization Admin.
        email:
          type: string
          format: email
          description: Email of the Organization Admin.
        twoFactorEnabled:
          type: boolean
          description: >
            Determines whether 2FA is enabled for the Organization Admin.
            Always `false` in Confeature v1 (no 2FA yet).
    OrganizationMemberModel:
      type: object
      description: >
        Describes an Organization Member. ConfigCat parity
        (organization-member-model.ts). The `permissions` field always
        returns an empty array in Confeature v1 — per-product ACL is
        not yet supported. The shape is preserved so ConfigCat
        customers regenerating clients against the Confeature API don't
        lose fields.
      required: [userId, fullName, email, twoFactorEnabled, permissions]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        twoFactorEnabled:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationPermissionModel"
          description: >
            The permissions of the Member. v1 of Confeature does not
            implement per-product permissions; this field always returns
            an empty array.
    OrganizationPermissionModel:
      type: object
      description: >
        Per-product permission entry (ConfigCat parity placeholder).
        Confeature v1 returns EMPTY arrays in
        `OrganizationMemberModel.permissions`. The shape is published so
        client codegen does not break; field-level fidelity will land
        when per-product ACL ships.
      properties: {}
    OrganizationMembersModel:
      type: object
      description: >
        Response shape for GET /v1/organizations/{organizationId}/members.
        ConfigCat parity (organization-members-model.ts). Three role
        buckets — admins, billingManagers, members. v1 of Confeature
        populates `admins` (self-service signup, founder-org backfill,
        existing invite redemption) and eventually `members` (future
        member-role invitations). `billingManagers` always returns an
        empty array until billing managers are supported.
      required: [admins, billingManagers, members]
      properties:
        admins:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAdminModel"
          description: List of Organization Admins.
        billingManagers:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationAdminModel"
          description: >
            List of Billing Managers. Empty in v1 of Confeature (no
            billing module yet). Field present for ConfigCat wire parity.
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMemberModel"
          description: List of Organization Members.
    MeModel:
      type: object
      description: >
        Response shape for GET /v1/me. ConfigCat parity (me-model.ts).
        Returns ONLY identity — org membership is discovered via GET
        /v1/organizations. Confeature v1 derives `fullName` from the
        user's email local part until a profile-editing feature lands.
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
    AuditLogItemModel:
      type: object
      additionalProperties: false
      required: [auditLogId, auditLogDateTime, auditLogTypeEnum]
      description: >
        A single config-plane change in a product's audit log.
        Mirrors ConfigCat's audit-log item shape: the structured `before`/
        `after` snapshots + `configId`/`environmentId` are Confeature-only
        additive members carried for the back-office diff view + the
        Release Guardian rollback.
      properties:
        auditLogId:
          type: integer
          format: int64
        auditLogDateTime:
          type: string
          format: date-time
        auditLogType:
          type: string
          nullable: true
        auditLogTypeEnum:
          $ref: "#/components/schemas/AuditLogType"
        userEmail:
          type: string
          nullable: true
        userName:
          type: string
          nullable: true
        actionTarget:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
        where:
          type: string
          nullable: true
        why:
          type: string
          nullable: true
        # Additive Confeature-only members (ConfigCat clients ignore them):
        before:
          nullable: true
          description: Structured pre-change snapshot (Confeature extension).
        after:
          nullable: true
          description: Structured post-change snapshot (Confeature extension).
        configId:
          type: string
          format: uuid
          nullable: true
        environmentId:
          type: string
          format: uuid
          nullable: true
    AuthEventModel:
      type: object
      additionalProperties: false
      required: [eventType, createdAt]
      description: >
        A single auth-plane event in the caller's own account-security activity
        Management-plane only (no ConfigCat equivalent). The
        shape carries NO secret value (token plaintext / hash / password) and NO
        other user's id — it is the caller's own security context, exposed only
        to them.
      properties:
        eventType:
          $ref: "#/components/schemas/AuthEventType"
        createdAt:
          type: integer
          format: int64
          description: Unix ms timestamp of the event.
        ip:
          type: string
          nullable: true
          description: Originating IP (CF-Connecting-IP, or "unknown").
        userAgent:
          type: string
          nullable: true
          description: Originating request User-Agent.
        actorType:
          type: string
          enum: [user, management_token, system]
          description: The kind of identity that performed the action.
        actorLabel:
          type: string
          nullable: true
          description: Denormalized non-secret actor label (email / token name).
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Non-secret detail for the event (e.g. a token label/id, the OAuth
            provider name). NEVER contains a secret value.
    AuthEventType:
      type: string
      description: >
        The enumerated kind of auth-plane event. Extensible —
        a migration client deserializes an unknown future value as the raw
        string.
      enum:
        - session_login
        - session_logout
        - oauth_linked
        - oauth_unlinked
        - cli_device_approved
        - cli_device_denied
        - cli_token_minted
        - cli_token_revoked
        - management_token_minted
        - management_token_revoked
    AuditLogType:
      type: string
      description: >
        ConfigCat audit log event type. Lists ConfigCat's full enum verbatim
        (incl. its own casing inconsistencies) for migration-client
        deserializer safety, PLUS the additive Confeature value
        `configPublished`. Confeature's emitter only produces the config-plane
        subset it supports.
      enum:
        - productCreated
        - productChanged
        - productOwnershipTransferred
        - productDeleted
        - productsReordered
        - teamMemberInvited
        - teamMemberInvitationRevoked
        - teamMemberJoined
        - teamMemberPermissionGroupChanged
        - teamMemberRemoved
        - teamMemberLeft
        - teamMemberInvitationChanged
        - teamMemberInvitationResent
        - teamMemberInvitationRejected
        - configCreated
        - configChanged
        - configDeleted
        - configsReordered
        - environmentCreated
        - environmentChanged
        - environmentDeleted
        - environmentsReordered
        - settingCreated
        - settingChanged
        - settingDeleted
        - settingsReordered
        - settingValueChanged
        - webHookCreated
        - webHookChanged
        - webHookDeleted
        - subscriptionChanged
        - permissionGroupCreated
        - permissionGroupChanged
        - permissionGroupDeleted
        - permissionGroupDefault
        - apiKeyAdded
        - apiKeyRemoved
        - integrationAdded
        - integrationChanged
        - integrationRemoved
        - apiKeyConnected
        - integrationLinkAdded
        - integrationLinkRemoved
        - organizationAdded
        - organizationRemoved
        - organizationChanged
        - organizationSubscriptionTypeChanged
        - organizationAdminChanged
        - organizationAdminLeft
        - organizationAdminDisabled2FA
        - tagAdded
        - tagChanged
        - tagRemoved
        - settingTagAdded
        - settingTagRemoved
        - publicApiAccessTokenAdded
        - publicApiAccessTokenRemoved
        - domainAdded
        - domainVerified
        - domainRemoved
        - domainSamlConfigured
        - domainSamlDeleted
        - autoProvisioningConfigurationChanged
        - organizationMemberJoined
        - organizationMemberProductJoinRequested
        - organizationMemberProductJoinRequestRejected
        - organizationMemberProductJoinRequestApproved
        - codeReferencesUploaded
        - codeReferenceDeleted
        - codeReferenceStaleBranchDeleted
        - segmentCreated
        - segmentChanged
        - segmentDeleted
        - webhookSigningKeyDeleted
        - webhookSigningKeyCreated
        # --- Confeature additive extension (no ConfigCat equivalent) ---
        - configPublished
    # ── Release Guardian — management-plane component shapes.
    #    `before`/`after`/`current` are arbitrary JSON values: modelled with the
    #    concrete `{}` (empty schema = "any JSON") + `nullable: true`, NOT a bare
    #    z.unknown()-equivalent that collapses codegen. ──────────────────────────
    GuardianEventStatus:
      type: string
      enum: [open, acknowledged, rolled_back, dismissed]
    CreateGuardianIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        environmentId:
          type: string
          format: uuid
          nullable: true
          description: null = product-wide.
        outboundWebhookUrl:
          type: string
          nullable: true
          description: SSRF-validated (https, allowlisted provider).
        correlationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
    UpdateGuardianIntegrationRequest:
      type: object
      additionalProperties: false
      description: Partial update — every member is optional.
      properties:
        environmentId:
          type: string
          format: uuid
          nullable: true
          description: null = product-wide.
        outboundWebhookUrl:
          type: string
          nullable: true
          description: SSRF-validated (https, allowlisted provider).
        correlationWindowSeconds:
          type: integer
          minimum: 60
          maximum: 86400
        enabled:
          type: boolean
    GuardianIntegration:
      type: object
      additionalProperties: false
      required: [integrationId, productId, correlationWindowSeconds, enabled, createdAt]
      properties:
        integrationId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
          nullable: true
        outboundWebhookUrl:
          type: string
          nullable: true
        correlationWindowSeconds:
          type: integer
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
    GuardianIntegrationCreated:
      allOf:
        - $ref: "#/components/schemas/GuardianIntegration"
        - type: object
          required: [webhookUrl]
          properties:
            webhookUrl:
              type: string
              description: The full inbound URL with the plaintext token — returned ONCE, never again.
    GuardianChangeSummary:
      type: object
      description: A summary of a suspect/candidate audit_log change (no error data).
      additionalProperties: false
      properties:
        auditLogId:
          type: integer
          format: int64
        action:
          type: string
        settingKey:
          type: string
          nullable: true
        before:
          type: object
          nullable: true
          additionalProperties: true
          description: The change's prior value — an arbitrary JSON value.
        after:
          type: object
          nullable: true
          additionalProperties: true
          description: The change's new value — an arbitrary JSON value.
        changedBy:
          type: string
          nullable: true
        changedAt:
          type: integer
          format: int64
        rollbackable:
          type: boolean
          description: true only for flag-value changes.
    GuardianEvent:
      type: object
      additionalProperties: false
      required: [eventId, productId, receivedAt, status, signalCount, candidates]
      properties:
        eventId:
          type: integer
          format: int64
        productId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
          nullable: true
        receivedAt:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/GuardianEventStatus"
        signalCount:
          type: integer
        suspect:
          allOf:
            - $ref: "#/components/schemas/GuardianChangeSummary"
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GuardianChangeSummary"
    # A flat superset of GuardianEvent, deliberately NOT `allOf: [GuardianEvent, …]`:
    # GuardianEvent is `additionalProperties: false`, so an allOf extension could
    # never validate an instance carrying `servedValueChanged`; and the pinned
    # oasdiff breaking gate reads an allOf-wrapped 200 as every GuardianEvent
    # property removed. Keep the members below in lock-step with GuardianEvent.
    GuardianRollbackResult:
      type: object
      additionalProperties: false
      description: >
        A rollback's answer: the updated event (the GuardianEvent shape), plus
        whether SDKs are now served the restored value.
      required:
        [eventId, productId, receivedAt, status, signalCount, candidates, servedValueChanged]
      properties:
        eventId:
          type: integer
          format: int64
        productId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
          nullable: true
        receivedAt:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/GuardianEventStatus"
        signalCount:
          type: integer
        suspect:
          allOf:
            - $ref: "#/components/schemas/GuardianChangeSummary"
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/GuardianChangeSummary"
        servedValueChanged:
          type: boolean
          description: >
            true when the value SDKs are served was restored. false when the
            rollback changed the draft value only — the suspect change was
            never served, a later publish superseded it, or the environment's
            published snapshot could not be read.
    GuardianValueChanged:
      type: object
      description: >
        409 body of a rollback — the flag's current value no longer equals the
        suspect change's new value, so a rollback would overwrite a newer
        change. Retry with `force: true` to override.
      required: [error, message, current]
      properties:
        error:
          type: string
          enum: [value_changed_since]
        message:
          type: string
        current:
          description: The flag's current (draft) value — an arbitrary JSON value, or null.
        published:
          description: >
            The value SDKs are served for the flag — an arbitrary JSON value.
            Present only when the flag is published in this environment.
    CliDeviceAuthorizeRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 200
          description: >
            Optional display name (e.g. the host name) shown beside the minted
            CLI token in the dashboard token list. A display nicety, NEVER an
            auth input.
      description: Request body for POST /v1/cli/device/authorize (bodiless POST accepted).
    CliDeviceAuthorizeResponse:
      type: object
      additionalProperties: false
      required:
        - device_code
        - user_code
        - verification_uri
        - verification_uri_complete
        - interval
        - expires_in
      properties:
        device_code:
          type: string
          description: The CLI-held credential for the poll. Its SHA-256 hash is stored; the plaintext is not.
        user_code:
          type: string
          description: Short, human-readable code the user reads / types on the approval page (e.g. WDJB-MJHT).
        verification_uri:
          type: string
          description: The session-gated approval page URL on the back-office app origin.
        verification_uri_complete:
          type: string
          description: The verification URI with ?user_code= pre-filled.
        interval:
          type: integer
          description: Minimum poll interval in seconds (RFC 8628).
        expires_in:
          type: integer
          description: Seconds until the device + user codes expire.
      description: RFC 8628 device-authorization response.
    CliDeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [device_code]
      properties:
        device_code:
          type: string
      description: Request body for POST /v1/cli/device/token — the device_code IS the credential.
    CliDeviceTokenSuccess:
      type: object
      additionalProperties: false
      required: [access_token, token_type, identity]
      properties:
        access_token:
          type: string
          description: The minted CLI token plaintext — returned ONCE, stored only as a hash server-side.
        token_type:
          type: string
          enum: ["bearer"]
        identity:
          type: object
          additionalProperties: false
          required: [user, org]
          properties:
            user:
              type: string
              description: The approving user's email.
            org:
              type: string
              description: The active org id the token is scoped to.
      description: Successful poll — the minted token + the identity it acts as.
    CliDeviceTokenError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            - "authorization_pending"
            - "slow_down"
            - "expired_token"
            - "access_denied"
      description: >
        RFC 8628 poll error envelope. NEVER carries a token — an unknown /
        expired / denied / pending code yields the appropriate error here, never
        account data (auth separation).
    CliDeviceDecisionRequest:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code:
          type: string
      description: Request body for POST /v1/cli/device/approve and /deny.
    CliDeviceDecisionResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      description: Acknowledgement of a successful approve / deny.
    CliLogoutResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
      description: Acknowledgement of an idempotent CLI-token revoke.
    CliTokenSummary:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: string
        label:
          type: string
          nullable: true
        createdAt:
          type: integer
        lastUsedAt:
          type: integer
          nullable: true
        revokedAt:
          type: integer
          nullable: true
      description: >
        One CLI login in the dashboard revoke list (owner-scoped). NEVER carries
        the token hash or plaintext.
    CliTokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/CliTokenSummary"
      description: The session user's own CLI logins.
    McpAuthorizeApproveRequest:
      type: object
      additionalProperties: false
      required: [state, client_id, scope]
      properties:
        state:
          type: string
          description: >
            The opaque CSRF state that binds the dashboard consent decision to
            the MCP server's `mcp:authreq:{state}` KV record carrying the parsed
            OAuth request.
        client_id:
          type: string
          description: The registered MCP client id the authorization is for (must match the authreq).
        scope:
          type: string
          description: The OAuth scope string the client requested.
      description: Request body for POST /v1/mcp/authorize/approve.
    McpAuthorizeDenyRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          description: The opaque CSRF state identifying the pending authorization to decline.
      description: Request body for POST /v1/mcp/authorize/deny.
    McpAuthorizeRedirectResponse:
      type: object
      additionalProperties: false
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
          description: >
            The MCP server's callback URL the browser is sent to. On approve it
            carries a one-time `code` (the bridged token travels separately via
            delete-on-read KV, NEVER in this URL); on deny it carries
            `error=access_denied`. NEVER contains the token plaintext.
      description: >
        The callback URL the MCP server completes (or aborts) the OAuth grant with.
        Returned by both /approve and /deny.
    McpToken:
      type: object
      additionalProperties: false
      required: [id, oauthClientId, createdAt, revoked]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        oauthClientId:
          type: string
          nullable: true
          description: The registered MCP client (Claude / Cursor / …) this credential was minted for.
        createdAt:
          type: integer
          description: Unix ms.
        lastUsedAt:
          type: integer
          nullable: true
          description: Unix ms of the last (debounced) use, or null if never used.
        revoked:
          type: boolean
          description: Derived from `revoked_at` being non-null.
        expiresAt:
          type: integer
          nullable: true
          description: Unix ms the sliding-30-day standing expiry currently lapses at.
      description: >
        One MCP connection credential in the dashboard revoke list (owner-scoped).
        NEVER carries the token hash, the plaintext, or the grant id.
    McpTokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/McpToken"
      description: The session user's own MCP connection credentials.
tags:
  - name: Auth
    description: >
      Real-user authentication for the back-office. Email + password
      core in v0.1, with an SSO-ready provider interface for future
      Okta / Google Workspace / Azure AD / GitHub OAuth plugins.
      Management tokens remain the parallel M2M / CLI credential —
      see the `bearerAuth` security scheme.
  - name: Me
    description: >
      Authenticated user identity endpoint (ConfigCat parity — `GET
      /v1/me`). Returns the minimal `MeModel` (email + fullName) for
      drop-in compatibility with ConfigCat-generated clients. Confeature
      additionally exposes a richer `/v1/auth/me` (under the `Auth` tag)
      that returns the full `User` shape with creation timestamp + session
      metadata.
  - name: Organizations
    description: >
      Multi-tenant organization surface (ConfigCat parity). Organizations
      are the canonical unit of ownership across the back-office data plane.
      v1 ships three endpoints: list orgs the user belongs to, list
      members of a specific org, and read the active org via `/v1/me`.
      Cross-org access on `{organizationId}` routes returns 404 generic —
      no existence enumeration. Schema names mirror ConfigCat's
      `OrganizationModel`, `OrganizationAdminModel`,
      `OrganizationMemberModel`, `OrganizationMembersModel` byte-for-byte.
  - name: Guardian
    description: >
      Release Guardian — a Confeature differentiator with
      no ConfigCat counterpart. Correlates an inbound error-spike signal
      (POSTed to an unguessable token-auth webhook) with recent flag-value
      changes and offers a one-click rollback. Management plane ONLY: nothing
      here enters the SDK eval wire (`config_v6` / `ConfigV6`). The inbound
      webhook is token-auth (the path token IS the authentication, mirroring
      the billing webhook split); every other route is scope-guarded
      (`guardian:read` / `guardian:write`) with a generic-404 cross-org gate.
  - name: CLI Auth
    description: >
      CLI browser device-flow login — an RFC 8628 device
      authorization grant. `confeature login` requests a device + user code,
      opens the browser to a session-gated approval page, and polls until the
      signed-in user approves; the poll then mints a long-lived, revocable,
      USER-scoped bearer (the `cli-token` source — org-scoped like a session,
      NOT a platform-admin management token). Management plane ONLY: nothing
      here enters the SDK eval wire (`config_v6` / `ConfigV6`). Auth separation:
      the public authorize / token endpoints never read account data
      and only yield a token AFTER an authenticated cookie-session approval.
  - name: MCP Auth
    description: >
      Dashboard consent endpoints for the remote MCP server
      (`mcp.confeature.io`). Because `__Host-cfsession` is host-locked to
      `app.confeature.io`, the MCP server's OAuth `/authorize` step redirects to a
      session-gated dashboard consent page that calls these endpoints. On
      approve, the API mints a bridged, org-scoped `mcp_token` (the `mcp-token`
      source — org-scoped like a session, NOT a platform-admin management token)
      and hands it to the MCP server via a short-TTL, delete-on-read KV record; the
      response NEVER carries the token plaintext. Management plane ONLY:
      nothing here enters the SDK eval wire (`config_v6` / `ConfigV6`). The
      OAuth/MCP protocol wire (authorize/token/register/`/mcp`) is served by
      the MCP server via standard libraries and is intentionally NOT part of this
      management contract.
