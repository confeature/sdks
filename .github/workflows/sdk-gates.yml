# SPDX-License-Identifier: MIT

# Every SDK judged by its own suite, on every push to main, once a day, and on
# every pull request for the SDKs it touches (#793). Until this workflow, 19 of
# the 21 SDKs ran their suite on no push at all: only a release tag or the
# operator's local pre-push did, so a regression was found at publish time.
#
# The jobs, each fed by its own output of the select job:
#   select          tools/repo-gates/select-sdks.mjs decides which SDKs this
#                   change is judged by, and through which kind of job. A push
#                   and the schedule select every SDK; a pull request, the SDKs
#                   it touches plus their dependents, or every SDK when it
#                   touches anything outside one SDK's directory.
#   gate            one leg per selected SDK with a daggerFn: that SDK's own
#                   Dagger function, the one definition of its suite, shared
#                   with the publish gate, release-gate.yml and the pre-push,
#                   then, when the manifest gives it a liveSuite.runner, its
#                   live wire-cases (`live-suite --sdk <name>`, #918).
#   gate-known-red  the same legs for an SDK whose ticketed defect is waived in
#                   the BASE manifest (ci.knownRed): shown red, never counted.
#   swift           Swift natively on macOS (ci.native: macos): the one SDK
#                   whose toolchain is Apple's, on a macos-15 runner; then its
#                   live wire-cases natively (run-live-suite.mjs, #924).
#   smoke           Unreal's source-quality smoke (ci.native: smoke), labelled
#                   as such: no hosted runner has an Unreal Engine.
#   sdk gates       the aggregate, and the one required check on main:
#                   tools/repo-gates/conclude-sdk-gates.mjs decides it, from
#                   toJSON(needs).
#
# It holds nothing: `contents: read`, no environment, no secret, no token in
# any expression, a checkout that keeps no credential, no cache of any kind
# (a pull request's cache could reach main) and no continue-on-error. A
# fork's pull request runs it with the same read-only token, after a
# maintainer approves the run (CONTRIBUTING.md, "Approving a fork's run").
#
# tools/repo-gates/verify-workflows.mjs rule 19 holds this file's shape: the
# three unfiltered triggers, the runner labels, a timeout on every job, the
# concurrency key, fail-fast: false, the empty-matrix guards, and an
# aggregate that needs every job, runs always() and runs the conclude script.

name: sdk-gates

on:
  push:
    branches: [main]
  pull_request:
  # Daily, on main: a commit that skipped CI, toolchain drift, a fetch that
  # changed under a pinned suite.
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

# A newer run of the same event on the same ref supersedes the older one. The
# event is in the key so the schedule and a push to main never cancel each
# other; the ref is github.ref, never head_ref, which a fork names.
concurrency:
  group: sdk-gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.3"

jobs:
  select:
    name: select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.select.outputs.gate }}
      known_red: ${{ steps.select.outputs.known_red }}
      swift: ${{ steps.select.outputs.swift }}
      smoke: ${{ steps.select.outputs.smoke }}
      gate_files: ${{ steps.select.outputs.gate_files }}
      summary: ${{ steps.select.outputs.summary }}
    steps:
      # Full history: a pull request's diff is <base>...<head>, and the
      # known-red waiver is read from the base commit's manifest.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Dependency-free: no install. The SHAs are data, through env: (rule 5).
      - name: Select the SDKs (tools/repo-gates/select-sdks.mjs)
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/repo-gates/select-sdks.mjs

  gate:
    name: gate (${{ matrix.sdk.name }})
    needs: select
    # An empty matrix is an error, not a skip: no leg when nothing is selected.
    if: needs.select.outputs.gate != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.select.outputs.gate) }}
    steps:
      # The leg runs the pull request's code inside Dagger and never pushes, so
      # the checkout keeps no GITHUB_TOKEN in .git/config.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Dagger as every job sets it up (.github/actions/dagger-setup, #868):
      # the engine version from dagger/dagger.json, the CLI verified against
      # dagger/cli-checksums.txt, and the engine image by the digest in
      # dagger/engine-digest.txt. tools/dagger-call/engine-pin.test.mjs
      # follows the action into its action.yml and fails on any drift.
      - name: Set up the pinned Dagger (.github/actions/dagger-setup)
        id: pin
        uses: ./.github/actions/dagger-setup

      # The action is pinned by commit SHA (v8.4.1, the contract that supports
      # verb/module/args/enable-github-summary) and the engine by `version:`,
      # taken from the pin step. The action tag and the engine version are
      # decoupled by design: never @v8 / @latest, never the action's `latest`
      # engine default. tools/dagger-call/engine-pin.test.mjs fails on either.
      - name: Run ${{ matrix.sdk.daggerFn }} (Dagger)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.pin.outputs.version }}
          verb: call
          module: ./dagger
          args: ${{ matrix.sdk.daggerFn }} --source=.
          enable-github-summary: true

      # The SDK's live wire-cases against the reference origin (#918): its
      # manifest liveSuite.runner, on its own toolchain, through the same
      # verified CLI and pinned engine. After the suite, and only on a leg that
      # has one (select-sdks.mjs sets live); a red live suite reddens the leg.
      - name: Run live-suite --sdk ${{ matrix.sdk.name }} (Dagger)
        if: matrix.sdk.live
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.pin.outputs.version }}
          verb: call
          module: ./dagger
          args: live-suite --sdk ${{ matrix.sdk.name }} --source=.
          enable-github-summary: true

      # A matrix job reports one combined result, so each leg names itself.
      - name: Name the leg in its summary
        if: always()
        env:
          SDK: ${{ matrix.sdk.name }}
          STATUS: ${{ job.status }}
        run: |
          echo "gate (${SDK}): ${STATUS}" >> "$GITHUB_STEP_SUMMARY"

  gate-known-red:
    name: gate (${{ matrix.sdk.name }}, known red ${{ matrix.sdk.ticket }})
    needs: select
    if: needs.select.outputs.known_red != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.select.outputs.known_red) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Dagger as every job sets it up (.github/actions/dagger-setup, #868):
      # the engine version from dagger/dagger.json, the CLI verified against
      # dagger/cli-checksums.txt, and the engine image by the digest in
      # dagger/engine-digest.txt. tools/dagger-call/engine-pin.test.mjs
      # follows the action into its action.yml and fails on any drift.
      - name: Set up the pinned Dagger (.github/actions/dagger-setup)
        id: pin
        uses: ./.github/actions/dagger-setup

      # The action is pinned by commit SHA (v8.4.1, the contract that supports
      # verb/module/args/enable-github-summary) and the engine by `version:`,
      # taken from the pin step. The action tag and the engine version are
      # decoupled by design: never @v8 / @latest, never the action's `latest`
      # engine default. tools/dagger-call/engine-pin.test.mjs fails on either.
      - name: Run ${{ matrix.sdk.daggerFn }} (Dagger)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.pin.outputs.version }}
          verb: call
          module: ./dagger
          args: ${{ matrix.sdk.daggerFn }} --source=.
          enable-github-summary: true

      # The SDK's live wire-cases against the reference origin (#918): its
      # manifest liveSuite.runner, on its own toolchain, through the same
      # verified CLI and pinned engine. After the suite, and only on a leg that
      # has one (select-sdks.mjs sets live); a red live suite reddens the leg.
      - name: Run live-suite --sdk ${{ matrix.sdk.name }} (Dagger)
        if: matrix.sdk.live
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.pin.outputs.version }}
          verb: call
          module: ./dagger
          args: live-suite --sdk ${{ matrix.sdk.name }} --source=.
          enable-github-summary: true

      - name: Name the leg in its summary
        if: always()
        env:
          SDK: ${{ matrix.sdk.name }}
          TICKET: ${{ matrix.sdk.ticket }}
          STATUS: ${{ job.status }}
        run: |
          echo "gate (${SDK}), known red ${TICKET}, not counted: ${STATUS}" >> "$GITHUB_STEP_SUMMARY"

  # Swift natively on macOS (ci.native: macos): scripts/swift-precheck.sh,
  # the same script the local pre-push runs, which fails closed under CI when
  # swift or swift-format is missing. Xcode is selected by exact path. Then,
  # when the manifest gives the SDK a liveSuite.runner (select-sdks.mjs sets
  # live, #924), its live wire-cases natively: no Dagger container has
  # Apple's toolchain, so the harness runs here, on loopback, on the runner.
  swift:
    name: swift (${{ matrix.sdk.name }})
    needs: select
    if: needs.select.outputs.swift != '[]'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.select.outputs.swift) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build, test and lint (scripts/swift-precheck.sh)
        run: bash scripts/swift-precheck.sh

      # The harness's toolchain, as verify.yml sets it up: pnpm, the pinned
      # Node, the workspace from the frozen lockfile (wrangler and its darwin
      # workerd), and the harness's dist/, which every runner starts.
      - name: Setup pnpm
        if: matrix.sdk.live
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        if: matrix.sdk.live
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the workspace
        if: matrix.sdk.live
        run: pnpm install --frozen-lockfile

      - name: Build the live-contract harness
        if: matrix.sdk.live
        run: pnpm --filter @confeature/test-harness-live-contract build

      # The SDK's manifest liveSuite.runner, run as Dagger's live-suite runs
      # it (repository root, bash -euo pipefail); a red live suite reddens
      # the leg.
      - name: Run the live suite (tools/repo-gates/run-live-suite.mjs)
        if: matrix.sdk.live
        env:
          SDK: ${{ matrix.sdk.name }}
        run: node tools/repo-gates/run-live-suite.mjs

  # The labelled source-quality smoke (ci.native: smoke): NOT A BUILD. No
  # hosted runner has an Unreal Engine, so apps/sdk-<name>/scripts/
  # source-smoke.mjs checks what the source alone can show, and its summary's
  # first line says what it is. Its own tests run first.
  smoke:
    name: ${{ matrix.sdk }} (source-quality smoke — not a build)
    needs: select
    if: needs.select.outputs.smoke != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.select.outputs.smoke) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the smoke itself
        env:
          SDK: ${{ matrix.sdk }}
        run: node --test "apps/sdk-${SDK}/scripts/source-smoke.test.mjs"

      - name: Run the source-quality smoke
        env:
          SDK: ${{ matrix.sdk }}
        run: node "apps/sdk-${SDK}/scripts/source-smoke.mjs"

  # The one required check. It runs whatever happened above, and is green only
  # when every kind's result matches its selection (conclude-sdk-gates.mjs).
  sdk-gates:
    name: sdk gates
    needs: [select, gate, gate-known-red, swift, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Conclude (tools/repo-gates/conclude-sdk-gates.mjs)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/repo-gates/conclude-sdk-gates.mjs
