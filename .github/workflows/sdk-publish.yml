  # -------------------------------------------------------------- maven ----
  pack-maven:
    name: pack ${{ needs.setup.outputs.coordinates }}
    needs: [setup, gate]
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.registry == 'maven' &&
      (needs.setup.outputs.gate == 'skip' || needs.gate.result == 'success')
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.digest.outputs.sums }}
    env:
      UNIT_PATH: ${{ needs.setup.outputs.path }}
      UNIT_VERSION: ${{ needs.setup.outputs.version }}
      UNIT_COORDINATES: ${{ needs.setup.outputs.coordinates }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every manifest names MakerLabs (verify:manifest-author)
        run: pnpm run verify:manifest-author

      # No `cache:` input, so nothing is restored (setup-java caches only
      # when asked). The Gradle distribution each wrapper downloads is checked
      # against its distributionSha256Sum.
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The live metadata is read with a query string no cache has seen, so it
      # is R2's object, never an edge copy (R2 ignores the query). A 404 is a
      # first release, recorded as <aid>.absent; any other answer stops the
      # run, since guessing "first release" would publish metadata that lists
      # no earlier version. check:maven-release refuses an artifact with
      # neither <aid>.xml nor <aid>.absent, so a skipped fetch fails too.
      # `-PenableAndroid=true` turns on kotlin-mp's opt-in Android target; the
      # Java and Android builds have no such property and ignore it.
      - name: Pack the release artifact
        run: |
          group="${UNIT_COORDINATES%%:*}"
          base="${group//.//}"
          repo="$GITHUB_WORKSPACE/$UNIT_PATH/build/release-repo"
          live="$RUNNER_TEMP/live"
          mkdir -p "$live" "$RUNNER_TEMP/release"
          rm -rf "$repo"
          publish() {
            (cd "$UNIT_PATH" && ./gradlew --no-daemon --stacktrace -PenableAndroid=true publishAllPublicationsToReleaseRepository)
          }
          publish
          [ -d "$repo/$base" ] || { echo "::error::the build published nothing under $base"; exit 1; }
          merged=0
          for dir in "$repo/$base"/*/; do
            aid="$(basename "$dir")"
            url="$MAVEN_URL/$base/$aid/maven-metadata.xml"
            code="$(curl --proto '=https' --tlsv1.2 -sS -o "$live/$aid.xml" -w '%{http_code}' "$url?pack=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || echo 000)"
            case "$code" in
              200) cp "$live/$aid.xml" "$dir/maven-metadata.xml" && merged=1 ;;
              404) rm -f "$live/$aid.xml" && : > "$live/$aid.absent" ;;
              *) echo "::error::cannot read $url (HTTP $code): refusing to guess whether $aid has releases"; exit 1 ;;
            esac
          done
          if [ "$merged" = 1 ]; then publish; fi
          cp -R "$repo/." "$RUNNER_TEMP/release/"

      - name: Check the artifact against the resolved unit
        run: pnpm run check:maven-release "$RUNNER_TEMP/release" "$UNIT_COORDINATES" "$UNIT_VERSION" "$RUNNER_TEMP/live"

      # Immutability, before the tag's publish job can run: a file of this
      # version that is already live is refused (the publish job's conditional
      # put refuses it again, atomically). Same cache-free query as above.
      - name: Probe maven.confeature.io for the new version (no credentials)
        run: |
          cd "$RUNNER_TEMP/release"
          n=0
          while IFS= read -r f; do
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /dev/null -I -w '%{http_code}' "$MAVEN_URL/$f?pack=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || echo 000)"
            case "$code" in
              404) n=$((n + 1)) ;;
              200) echo "::error::$MAVEN_URL/$f is already published: a released version never changes"; exit 1 ;;
              *) echo "::error::cannot tell whether $MAVEN_URL/$f is published (HTTP $code): refusing to guess"; exit 1 ;;
            esac
          done < <(find . -type f -path "./*/${UNIT_VERSION}/*" | sed 's|^\./||' | sort)
          [ "$n" -gt 0 ] || { echo "::error::the release has no file of ${UNIT_VERSION}"; exit 1; }
          { echo "### Maven dry run"; java -version 2>&1 | head -n 1; echo "- ${n} files of ${UNIT_VERSION}, none live yet"; } >> "$GITHUB_STEP_SUMMARY"

      # macOS has no sha256sum; `shasum -a 256` prints the same lines.
      - name: Record the artifact digests
        id: digest
        run: |
          cd "$RUNNER_TEMP/release"
          { echo "sums<<SUMS"; find . -type f | sed 's|^\./||' | sort | xargs shasum -a 256; echo "SUMS"; } >> "$GITHUB_OUTPUT"

      - name: Hand the artifact to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-maven
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  publish-maven:
    name: publish ${{ needs.setup.outputs.coordinates }}@${{ needs.setup.outputs.version }}
    needs: [setup, pack-maven]
    if: >-
      always() &&
      needs.pack-maven.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: sdk-publish-maven
    timeout-minutes: 20
    # id-token and attestations: the artifact attestation only; R2 takes the
    # environment's S3 credentials.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_SUMS: ${{ needs.pack-maven.outputs.sums }}
      UNIT_COORDINATES: ${{ needs.setup.outputs.coordinates }}
      UNIT_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout (tools/sdk-pack/maven-r2-upload.sh)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Receive the artifact (this run only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-maven
          path: release

      - name: Check the artifact against the pack job's digests
        run: |
          mkdir -p publish-tmp
          find release -type f | sed 's|^release/||' | sort > publish-tmp/got-files
          printf '%s\n' "$EXPECTED_SUMS" | cut -d ' ' -f 3- | sort > publish-tmp/want-files
          if cmp publish-tmp/got-files publish-tmp/want-files; then echo "the file set is the pack job's"; else echo "::error::the file set differs from the pack job's"; exit 1; fi
          printf '%s\n' "$EXPECTED_SUMS" | sed 's|  |  release/|' | sha256sum --check --strict --quiet
          printf '%s\n' "$EXPECTED_SUMS" > publish-tmp/subjects.sha256

      # One attestation whose subjects are every file, by its Maven path:
      # `gh attestation verify <file> --repo confeature/sdks` checks any one.
      - name: Attest every file (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: publish-tmp/subjects.sha256

      # The upload is tools/sdk-pack/maven-r2-upload.sh, the job's one
      # recorded exception: its ordering and immutability logic is outside the
      # strict grammar a credentialed run block is held to (rule 3). It refuses
      # metadata that drops a stored version, puts the version's files with
      # If-None-Match, the metadata last, then reads the POM back.
      - name: Upload
        env:
          MAVEN_R2_ACCESS_KEY_ID: ${{ secrets.MAVEN_R2_ACCESS_KEY_ID }}
          MAVEN_R2_SECRET_ACCESS_KEY: ${{ secrets.MAVEN_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash tools/sdk-pack/maven-r2-upload.sh release

  # ------------------------------------------------------------ conclude ----

  conclude:
    name: conclude
    needs:
      - workflow-rules
      - setup
      - gate
      - pack-npm
      - publish-npm
      - pack-pypi
      - publish-pypi
      - pack-crates
      - publish-crates
      - pack-rubygems
      - publish-rubygems
      - pack-nuget
      - publish-nuget
      - pack-pubdev
      - publish-pubdev
      - pack-go
      - publish-go
      - verify-go-module
      - pack-packagist
      - publish-packagist
      - pack-swiftpm
      - publish-swiftpm
      - pack-swiftpm-openfeature
      - publish-swiftpm-openfeature
      - pack-maven
      - publish-maven
      - pack-jsr
      - publish-jsr
      - pack-hex
      - publish-hex
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: The registry's jobs ran and succeeded
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            if (needs["workflow-rules"]?.result !== "success") { console.error("::error::the tagged workflows break the workflow rules (workflow-rules)"); process.exit(1); }
            const setup = needs.setup;
            if (setup?.result !== "success") { console.error("::error::the tag was refused (setup)"); process.exit(1); }
            const reg = setup.outputs.registry;
            const regs = [reg, ...(setup.outputs.jsr ? ["jsr"] : [])];
            const want = regs.flatMap((r) => [`pack-${r}`, ...(process.env.EVENT === "push" ? [`publish-${r}`] : [])]);
            if (setup.outputs.name === "openfeature-go" && process.env.EVENT === "push") want.push("verify-go-module");
            for (const job of want) {
              if (!(job in needs)) { console.error(`::error::this workflow has no ${job} job: registry ${reg} is not wired yet`); process.exit(1); }
              if (needs[job].result !== "success") { console.error(`::error::${job} ended ${needs[job].result}`); process.exit(1); }
            }
            const out = [`### sdk-publish — ${setup.outputs.coordinates}@${setup.outputs.version}`, "",
              `- Registry: \`${regs.join("`, `")}\``, `- Gate: \`${setup.outputs.gate}\` ${setup.outputs.daggerFn}`,
              `- Mode: ${process.env.EVENT === "push" ? "published" : "dry run (nothing published)"}`];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '
