# SPDX-License-Identifier: MIT

# Tag-triggered SDK publish: one tag publishes one unit to its registry.
#
# Tag format: `sdk-<name>-v<X.Y.Z>`, for example `sdk-node-v0.1.0`. The units,
# their registries, coordinates, version sources and publish order live in ONE
# place: `publish[]` in dagger/sdk-manifest.json. This workflow never maps a
# tag to a package itself.
#
# The chain, each job gating the next (`needs:`):
#
#   1. setup     tools/sdk-pack/resolve-publish.mjs accepts the tag, or refuses
#                it before any job that can reach a credential: unknown unit,
#                registry `none`, blocked, pending gate, version mismatch, an
#                `after` dependency not yet on its registry, or a commit that is
#                not on main. Every value later jobs use comes from the unit,
#                never from a substring of the tag, and reaches `run:` through
#                `env:` only.
#   2. gate      the unit's containerized suite (its `.sdks[]` daggerFn), unless
#                the unit is `exempt`.
#   3. pack-*    ONE per registry. No environment, no `id-token`, no secret, no
#                cache restore. It installs, runs the author rule, builds and
#                packs the artifact, checks the artifact's own name and version
#                against the resolver's, runs the registry's credential-free dry
#                run, and hands the artifact on with its sha256.
#   4. publish-* ONE per registry, a top-level job bound to environment
#                `sdk-publish-<registry>` (a tag-only
#                deployment policy). It runs NO project code: it downloads the
#                artifact from this same run, checks the digest, and runs the
#                pinned upload command. OIDC trusted publishing wherever the
#                registry has it; the trust configuration names this file AND
#                the environment, so a job outside the environment gets nothing.
#   5. conclude  fails unless the registry's pack job (and, for a tag, its
#                publish job) actually succeeded: a registry with no jobs here
#                yet is a red run, never a green one that published nothing.
#
# A `workflow_dispatch` run is a DRY RUN, always: it packs and runs the dry run
# of the named unit, and no publish job can run (they require a tag push).
# A dry run proves the packaging, not the OIDC binding; the first real tag
# proves that.
#
# The jobs, environments and rules here are checked by
# tools/repo-gates/verify-workflows.mjs; the environments, their rules and
# tag policies are declared in tools/repo-gates/release-settings.json.
#
# Registries wired so far: npm. The others land with their own child of #794.

name: sdk-publish

on:
  push:
    tags:
      - "sdk-*-v*"
  workflow_dispatch:
    inputs:
      unit:
        description: "Publish unit to dry-run (a `publish[].name` from dagger/sdk-manifest.json)"
        required: true
        type: string
      version:
        description: "Only for a unit whose version comes from its tag (php, swift)"
        required: false
        type: string
        default: ""

# Never cancel an in-flight publish. Tag pushes are rare; concurrency
# protects against accidental double-tag pushes.
concurrency:
  group: sdk-publish-${{ github.ref }}-${{ inputs.unit }}
  cancel-in-progress: false

permissions:
  contents: read

# The one home of each tool version a pack or publish job runs
# (tools/repo-gates/verify-workflows.mjs rule 9).
env:
  NODE_VERSION: "22.23.3"
  NPM_VERSION: "11.20.0"

jobs:
  setup:
    name: resolve ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      registry: ${{ steps.resolve.outputs.registry }}
      coordinates: ${{ steps.resolve.outputs.coordinates }}
      path: ${{ steps.resolve.outputs.path }}
      version: ${{ steps.resolve.outputs.version }}
      gate: ${{ steps.resolve.outputs.gate }}
      daggerFn: ${{ steps.resolve.outputs.daggerFn }}
      releaseTag: ${{ steps.resolve.outputs.releaseTag }}
      mirrorRepository: ${{ steps.resolve.outputs.mirrorRepository }}
      mirrorTag: ${{ steps.resolve.outputs.mirrorTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the publish unit (tools/sdk-pack/resolve-publish.mjs)
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          UNIT: ${{ inputs.unit }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            git fetch --no-tags origin main
            node tools/sdk-pack/resolve-publish.mjs --tag "$TAG" --commit "$GITHUB_SHA" --main-ref FETCH_HEAD
          elif [ -n "$VERSION" ]; then
            node tools/sdk-pack/resolve-publish.mjs --unit "$UNIT" --version "$VERSION"
          else
            node tools/sdk-pack/resolve-publish.mjs --unit "$UNIT"
          fi

  # Containerized test gate, for covered units only. A red gate propagates via
  # `needs` to every pack job, which is then skipped, so nothing is published.
  gate:
    name: gate ${{ needs.setup.outputs.name }} (${{ needs.setup.outputs.daggerFn }})
    needs: setup
    if: needs.setup.outputs.gate == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The job runs repository code inside Dagger and never pushes, so the
      # checkout keeps no GITHUB_TOKEN in .git/config (#865).
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # The engine version has one home, dagger/dagger.json `engineVersion`
      # (#865). This step reads it, so no workflow writes the number out.
      - name: Read the Dagger engine version (dagger/dagger.json)
        id: pin
        run: |
          version="$(jq -r '.engineVersion // empty' dagger/dagger.json)"
          if [ -z "${version}" ]; then
            echo "::error::dagger/dagger.json has no engineVersion"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The CLI's bytes are trusted from dagger/cli-checksums.txt, committed in
      # this repository, never from a checksum served by the download host. With
      # this CLI first on PATH at the pinned version, the action below finds it
      # and skips its own install.sh.
      - name: Install the checksum-verified Dagger CLI
        env:
          DAGGER_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          tarball="dagger_${DAGGER_VERSION}_linux_amd64.tar.gz"
          dir="${RUNNER_TEMP}/dagger-cli"
          mkdir -p "${dir}/bin"
          cd "${dir}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${tarball}" \
            "https://dl.dagger.io/dagger/releases/${DAGGER_VERSION#v}/${tarball}"
          awk -v f="${tarball}" '$2 == f' "${GITHUB_WORKSPACE}/dagger/cli-checksums.txt" > expected.sha256
          if [ "$(wc -l < expected.sha256)" -ne 1 ]; then
            echo "::error::dagger/cli-checksums.txt has no single entry for ${tarball}"
            exit 1
          fi
          sha256sum -c --strict expected.sha256
          tar -xzf "${tarball}" -C bin dagger
          got="$(bin/dagger --silent version | cut -s -d ' ' -f 2)"
          if [ "${got}" != "${DAGGER_VERSION}" ]; then
            echo "::error::the verified CLI reports '${got}', not ${DAGGER_VERSION}; the action would reinstall it unverified"
            exit 1
          fi
          echo "${dir}/bin" >> "$GITHUB_PATH"

      # The action is pinned by commit SHA (v8.4.1, the contract that supports
      # verb/module/args/enable-github-summary) and the engine by `version:`,
      # taken from the pin step. The action tag and the engine version are
      # decoupled by design: never @v8 / @latest, never the action's `latest`
      # engine default. tools/dagger-call/engine-pin.test.mjs fails on either.
      - name: Run ${{ needs.setup.outputs.daggerFn }} (Dagger)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ steps.pin.outputs.version }}
          verb: call
          module: ./dagger
          args: ${{ needs.setup.outputs.daggerFn }} --source=.
          enable-github-summary: true

  # ---------------------------------------------------------------- npm ----

  pack-npm:
    name: pack ${{ needs.setup.outputs.coordinates }}
    needs: [setup, gate]
    # `always()` lets an exempt unit (gate skipped) through; a failed or
    # cancelled gate still stops it.
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.registry == 'npm' &&
      (needs.setup.outputs.gate == 'skip' || needs.gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      file: ${{ steps.digest.outputs.file }}
    env:
      UNIT_COORDINATES: ${{ needs.setup.outputs.coordinates }}
      UNIT_VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The author rule: every manifest names MakerLabs as its author, with no
      # email address in any author or contact field. A registry keeps what it
      # is given, so this runs in every pack job, before the artifact exists.
      - name: Every manifest names MakerLabs (verify:manifest-author)
        run: pnpm run verify:manifest-author

      - name: Build the unit
        run: pnpm --filter "$UNIT_COORDINATES" run build

      # pnpm rewrites `workspace:` ranges into real versions while packing; the
      # tarball is exactly what the publish job uploads.
      - name: Pack the release artifact
        run: pnpm --filter "$UNIT_COORDINATES" pack --pack-destination "$RUNNER_TEMP/release"

      # The artifact must be the unit the resolver accepted, and usable: no
      # workspace range, a LICENSE, and every entry point it names present.
      - name: Check the artifact against the resolved unit
        # Exactly one tarball: two would pass four arguments, none a literal
        # glob, and the check refuses both (usage error, unreadable input).
        run: pnpm run check:npm-tarball "$RUNNER_TEMP"/release/*.tgz "$UNIT_COORDINATES" "$UNIT_VERSION"

      - name: Install the pinned npm
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"

      - name: npm publish --dry-run (no credentials)
        run: npm publish --dry-run --access public --ignore-scripts "$RUNNER_TEMP"/release/*.tgz

      - name: Record the artifact digest
        id: digest
        run: |
          cd "$RUNNER_TEMP/release"
          file="$(ls -- *.tgz)"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum -- "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the artifact to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-npm
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: publish ${{ needs.setup.outputs.coordinates }}@${{ needs.setup.outputs.version }}
    needs: [setup, pack-npm]
    # `always()` because `gate` is skipped for an exempt unit, and an implied
    # success() would skip this job with it; the pack job's own result gates it.
    if: >-
      always() &&
      needs.pack-npm.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: sdk-publish-npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA256: ${{ needs.pack-npm.outputs.sha256 }}
      ARTIFACT: ${{ needs.pack-npm.outputs.file }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Install the pinned npm
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"

      - name: Receive the artifact (this run only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm
          path: release

      - name: Check the artifact against the pack job's digest
        run: |
          actual="$(sha256sum -- "release/$ARTIFACT" | cut -d' ' -f1)"
          [ -n "$EXPECTED_SHA256" ] && [ "$actual" = "$EXPECTED_SHA256" ] ||
            { echo "::error::release/$ARTIFACT is $actual, the pack job recorded $EXPECTED_SHA256"; exit 1; }

      # Trusted publishing: npm exchanges this job's OIDC token. No token is
      # stored anywhere, and every package is set to disallow tokens.
      - name: Upload
        run: npm publish --access public --provenance --ignore-scripts "./release/$ARTIFACT"

  # ------------------------------------------------------------ conclude ----

  conclude:
    name: conclude
    needs: [setup, gate, pack-npm, publish-npm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: The registry's jobs ran and succeeded
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const setup = needs.setup;
            if (setup?.result !== "success") { console.error("::error::the tag was refused (setup)"); process.exit(1); }
            const reg = setup.outputs.registry;
            const want = [`pack-${reg}`, ...(process.env.EVENT === "push" ? [`publish-${reg}`] : [])];
            for (const job of want) {
              if (!(job in needs)) { console.error(`::error::this workflow has no ${job} job: registry ${reg} is not wired yet`); process.exit(1); }
              if (needs[job].result !== "success") { console.error(`::error::${job} ended ${needs[job].result}`); process.exit(1); }
            }
            const out = [`### sdk-publish — ${setup.outputs.coordinates}@${setup.outputs.version}`, "",
              `- Registry: \`${reg}\``, `- Gate: \`${setup.outputs.gate}\` ${setup.outputs.daggerFn}`,
              `- Mode: ${process.env.EVENT === "push" ? "published" : "dry run (nothing published)"}`];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '
