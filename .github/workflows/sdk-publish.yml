      # and a tag that already exists, and then pushes neither.
      - name: Upload
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_SSH_COMMAND: ssh -F /dev/null -i ${{ github.workspace }}/publish-tmp/ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ github.workspace }}/publish-tmp/ssh/known_hosts
          GIT_ALLOW_PROTOCOL: ssh
        run: |
          if [ -z "$MIRROR_TAG" ]; then echo "::error::the resolver gave no mirror tag"; exit 1; fi
          git --git-dir=publish-tmp/mirror.git push --atomic --end-of-options git@github.com:confeature/confeature-php-sdk.git refs/heads/main:refs/heads/main "refs/heads/main:refs/tags/${MIRROR_TAG}"

      - name: Remove the deploy key
        if: always()
        run: rm -rf publish-tmp/ssh

