# SPDX-License-Identifier: MIT

# Tag-triggered CLI release (distribution slice #657 / spec 183; R2 hosting #801).
#
# Tag format: `cli-v<X.Y.Z>`, for example `cli-v0.1.0`.
#
# Users install from https://cli.confeature.io (Cloudflare R2), a permanent
# contract; see apps/cli/RELEASES-R2.md and ADR 0006's amendment. A release
# runs as one chain, each job gating the next (`needs:`):
#
#   0. workflow-rules  tools/repo-gates/verify-workflows.mjs over this commit's
#                      workflows, before any token or environment.
#   1. build           a `contents: read` job: the tag is on main, its version
#                      matches the CLI's, all five targets compile, SHA256SUMS
#                      is written. The assets go on as an artifact, with the
#                      SHA256SUMS digest as a job output.
#   1b. release        the one `contents: write` job, which runs no build: it
#                      checks the artifact against that digest and runs
#                      release-github.sh, the GitHub release (a mirror, never
#                      the documented path).
#   2. upload          a `contents: read` job, separate from the write token and
#                      the build's toolchain. It re-checks the artifact against
#                      that digest, then `publish-r2.sh upload` puts the immutable
#                      v<ver>/ files.
#   3. verify-pinned   Windows installs `-Version <ver>` from the real host, and
#                      exercises the checkout's latest path against the current
#                      `latest`, BEFORE anything is promoted.
#   4. promote         `publish-r2.sh promote <ver>` puts the root install
#                      scripts, then `latest`, last. It refuses to move `latest`
#                      backwards. Until this job, every user still gets the
#                      previous version.
#   5. verify-latest   Windows installs with no version and must get <ver>:
#                      the checkout's script under pwsh 7, and the SERVED script
#                      through `irm | iex` under Windows PowerShell 5.1.
#
# Principle VII: a release-time gate only, tag-triggered. It adds no per-PR job.
#
# Credentials:
#   - `GITHUB_TOKEN` (`contents: write`, release job only) for the GitHub release,
#     read by release-github.sh's gh only.
#   - `R2_ACCESS_KEY_ID` / `R2_SECRET_ACCESS_KEY`: the S3 credentials of an R2
#     Object Read & Write token on the one bucket (created by the operator; see
#     the runbook), read ONLY by the upload and promote steps, in
#     `contents: read` jobs that install nothing: publish-r2.sh puts through
#     R2's S3 API with the runner's AWS CLI. Cloudflare honours a bucket-scoped
#     token on the S3 API only, not on the REST API wrangler and `cf` call.
#   - No `secrets: inherit`.
#
# Spec 183 (CLI distribution docs) and #801's plan.

name: cli-release

on:
  push:
    tags:
      - "cli-v*"

# Never cancel an in-flight release. Tag pushes are rare; concurrency
# protects against accidental double-tag pushes.
# ONE group for every CLI tag: two releases never interleave their
# upload/promote steps (promote also refuses to move `latest` backwards).
concurrency:
  group: cli-release
  cancel-in-progress: false

permissions:
  contents: read

# The one home of the Node version the workflow-rules job runs
# (tools/repo-gates/verify-workflows.mjs rule 9).
env:
  NODE_VERSION: "22.23.3"

jobs:
  # The workflow rules (tools/repo-gates/verify-workflows.mjs) over the TAGGED
  # commit's workflows, before the release job's write token and the R2 jobs'
  # environment: a tag whose workflows break them releases nothing (#794
  # review). It installs @confeature/repo-gates' dependencies and the root's
  # (yaml, vitest, vite-plus, from the lockfile, no install script), loads yaml,
  # and holds nothing. Every other job needs it (rule 14).
  workflow-rules:
    name: workflow rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the rules' dependencies (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @confeature/repo-gates

      - name: The workflow rules (verify:workflows)
        run: pnpm run verify:workflows

  # Builds, checks and hands on the release, with a read-only token: the
  # compile runs repository code and its dependencies, so it holds nothing
  # (round 9: it used to share a job with the contents: write token).
  build:
    name: build ${{ github.ref_name }}
    needs: workflow-rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sums-digest: ${{ steps.sums.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the on-main check needs origin/main's ancestry.
          fetch-depth: 0
          persist-credentials: false

      # Who may push a `cli-v*` tag is the release-tag ruleset's decision, and
      # who may reach the R2 token is the `cli-release` environment's (a
      # `cli-v*` tag-only policy). This step adds that a
      # tag on a commit that is not on main publishes nothing.
      # fetch-depth 0 already brings refs/remotes/origin/main; no `git fetch`
      # is needed, and the checkout keeps no credential.
      - name: Refuse a tag that is not on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main — nothing is published"; exit 1; }

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version: "2.8.2"

      - name: Verify tag matches the declared CLI version
        working-directory: apps/cli
        env:
          TAG: ${{ github.ref_name }}
        run: deno run scripts/release-version-check.ts "$TAG"

      - name: Compile all targets
        working-directory: apps/cli
        run: deno task compile

      - name: Generate SHA256SUMS
        id: sums
        working-directory: apps/cli/dist
        run: |
          shopt -s nullglob
          sha256sum confeature-* > SHA256SUMS
          cat SHA256SUMS
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the build to the release and upload jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-dist
          path: |
            apps/cli/dist/confeature-*
            apps/cli/dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      - name: Release summary
        if: always()
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### CLI release — $TAG"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$SHA\`"
            echo "- R2: \`https://cli.confeature.io/v${TAG#cli-v}/\` (promoted to latest only after the pinned Windows verify)"
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release (a mirror), the one job with a contents: write token:
  # it runs no build, only the recorded release-github.sh on the build job's
  # artifact, checked against that job's digest first.
  release:
    name: release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (release-github.sh)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Receive the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-dist
          path: dist

      - name: Check the build against the build job's digest
        env:
          EXPECTED: ${{ needs.build.outputs.sums-digest }}
        run: printf '%s  %s\n' "$EXPECTED" dist/SHA256SUMS | sha256sum --check --strict

      # No --clobber: a re-run must not replace the GitHub copy with a
      # different compile than the one R2 serves (release-github.sh).
      - name: Create the GitHub release and upload its assets (mirror)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash apps/cli/scripts/release-github.sh "$TAG" dist

  upload:
    name: upload ${{ github.ref_name }} to R2
    needs: [build, release]
    runs-on: ubuntu-latest
    # The R2 token is an ENVIRONMENT secret of `cli-release` (#794): this job
    # accepts `cli-v*` tags only (no approval click: operator ruling 2026-10-16;
    # the release-tag ruleset decides who can push one), and the environment accepts
    # `cli-v*` tags only. No repository-level copy exists (read back by the
    # operator's release-settings tooling).
    environment: cli-release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (publish-r2.sh)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Receive the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-dist
          path: dist

      # The artifact crossed a job boundary: its manifest must be the one the
      # build job wrote. publish-r2.sh then checks every binary against it.
      - name: Check the build against the build job's digest
        env:
          EXPECTED: ${{ needs.build.outputs.sums-digest }}
        run: printf '%s  %s\n' "$EXPECTED" dist/SHA256SUMS | sha256sum --check --strict

      - name: Upload v<ver>/ to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: bash apps/cli/scripts/publish-r2.sh upload "${TAG#cli-v}" dist

  verify-pinned:
    name: verify Windows install (pinned)
    needs: upload
    permissions:
      contents: read
    uses: ./.github/workflows/cli-windows-install-verify.yml
    with:
      version: ${{ github.ref_name }}

  promote:
    name: promote ${{ github.ref_name }} to latest
    needs: verify-pinned
    runs-on: ubuntu-latest
    # The R2 token is an ENVIRONMENT secret of `cli-release` (#794): this job
    # accepts `cli-v*` tags only (no approval click: operator ruling 2026-10-16;
    # the release-tag ruleset decides who can push one), and the environment accepts
    # `cli-v*` tags only. No repository-level copy exists (read back by the
    # operator's release-settings tooling).
    environment: cli-release
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (the root install scripts come from here)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Promote
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: bash apps/cli/scripts/publish-r2.sh promote "${TAG#cli-v}"

  verify-latest:
    name: verify Windows install (latest)
    needs: promote
    permissions:
      contents: read
    uses: ./.github/workflows/cli-windows-install-verify.yml
    with:
      version: ""
      expect: ${{ github.ref_name }}
