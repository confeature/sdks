# SPDX-License-Identifier: MIT

# The public gate, `pnpm run verify`, on every push to main and every pull
# request (#794 review). Until this workflow, the rules this repository holds
# its release pipeline to (tools/repo-gates/verify-workflows.mjs), its gate
# declarations and their tests ran on no automated path: only a contributor
# who remembered to run them ran them.
#
# It holds nothing: `contents: read`, no environment, no secret, and a
# checkout that keeps no token. A fork's pull request runs it with the same
# read-only token, which is why the trigger is `pull_request`, never
# `pull_request_target` (rule 4). The containerised SDK suites (`pnpm run
# ready`) stay local and on the release tags (Principle VII).
#
# tools/repo-gates/verify-workflows.mjs rule 13 refuses a tree where this
# workflow no longer runs `pnpm run verify` and the CLI's deno suite on both
# triggers, or where either can be skipped, filtered or redirected.

name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the older run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.3"
  # The CLI's toolchain, as cli-release.yml compiles it.
  DENO_VERSION: "2.8.2"

jobs:
  verify:
    name: pnpm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The type-aware lint reads each SDK against its workspace dependencies'
      # dist/ (sdk-shared's above all), which a fresh checkout does not have.
      - name: Build the workspace packages
        run: pnpm run build

      - name: The public gate
        run: pnpm run verify

      # The CLI's own suite, publish-r2.sh's tests included: a Deno project,
      # outside the pnpm workspace's runners (#794 review).
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: The CLI's tests
        run: deno task --cwd apps/cli test
