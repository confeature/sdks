# SPDX-License-Identifier: MIT

# Cross-SDK live-contract matrix (spec 115 / #150, sub-task D of epic #146).
#
# Runs each live-capable SDK's wire-cases against the reference origin
# (booted by tools/test-harness-live-contract, ADR 0006 Q1) and publishes a per-SDK
# conformance report. Placement is the RELEASE GATE, never per-PR
# (constitution Principle VII, NON-NEGOTIABLE — ci.yml stays the 3-job ubuntu
# pipeline). Discovery is driven by the `liveSuite` field in
# dagger/sdk-manifest.json; the full 21-SDK roster is the denominator so
# un-exercised SDKs are reported `pending`, never false-green.
# Contract: spec 115's contract-live-workflow contract.

name: contract-live

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # 1. Build the matrix of live-capable SDKs from the manifest's `liveSuite` field.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Discover live-capable SDKs (manifest liveSuite)
        id: discover
        run: |
          matrix=$(jq -c '{ sdk: [ .sdks[]
            | select(.liveSuite != null)
            | { name: .name,
                runner: .liveSuite.runner,
                toolchain: (.liveSuite.toolchain // "node") } ] }' \
            dagger/sdk-manifest.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered live matrix: $matrix"

  # 2. One job per live-capable SDK: run its wire-cases against the live harness.
  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The harness package + the cross-package dist deps the live suites import.
      # Nothing here depends on a private package, so none is built (#858).
      - name: Build harness + the shared engine
        run: pnpm vp run -F @confeature/sdk-shared -F @confeature/test-harness-live-contract build

      # uv pinned like dagger livePythonContract (0.4.30), installed by the
      # SHA-pinned action rather than a piped install script: the action checks
      # what it downloads, `curl | sh` checks nothing.
      - name: Setup uv (python toolchain)
        if: matrix.sdk.toolchain == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.4.30"

      - name: Sync python project
        if: matrix.sdk.toolchain == 'uv'
        working-directory: apps/sdk-python
        run: uv sync --frozen --extra dev

      # Every liveSuite.runner goes through the harness wrapper (#783): it boots
      # the harness, sets CONFEATURE_LIVE=1 + LIVE_HARNESS_URL and passes the
      # suite's exit code through. There is no boot step here any more, and no
      # way to run a live suite that skips itself and reports a pass.
      - name: Run ${{ matrix.sdk.name }} live wire-cases
        id: run
        continue-on-error: true
        # The default shell is `bash -e`: capture the runner's code instead of
        # letting it end the step, so a red run still records its duration.
        # The runner is a command line from dagger/sdk-manifest.json; it
        # reaches the shell through env: and runs as written.
        env:
          SDK_RUNNER: ${{ matrix.sdk.runner }}
        run: |
          start=$(date +%s)
          rc=0
          eval "$SDK_RUNNER" || rc=$?
          end=$(date +%s)
          echo "duration=$(( (end - start) * 1000 ))" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Write result artifact
        if: always()
        env:
          SDK_NAME: ${{ matrix.sdk.name }}
          OUTCOME: ${{ steps.run.outcome }}
          DURATION: ${{ steps.run.outputs.duration || 0 }}
        run: |
          status="pass"
          [ "$OUTCOME" = "success" ] || status="fail"
          mkdir -p live-results
          cat > "live-results/live-result-${SDK_NAME}.json" <<EOF
          { "sdk": "${SDK_NAME}", "status": "$status", "ran": true, "durationMs": ${DURATION} }
          EOF
          cat "live-results/live-result-${SDK_NAME}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-result-${{ matrix.sdk.name }}
          path: live-results/live-result-${{ matrix.sdk.name }}.json
          retention-days: 14

      # Red the job iff the SDK runner was red (the artifact is already uploaded).
      - name: Fail job on red suite
        if: steps.run.outcome != 'success'
        env:
          SDK_NAME: ${{ matrix.sdk.name }}
        run: |
          echo "::error::live wire-cases failed for ${SDK_NAME}"
          exit 1

  # 3. Aggregate all results into one per-SDK conformance report.
  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download all results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: live-results
          pattern: live-result-*
          merge-multiple: true

      # The report script writes the per-SDK table + `N/<roster> live-covered`
      # headline to stdout AND appends it to $GITHUB_STEP_SUMMARY (the reliable
      # report surface — GitHub releases have no comment API, so the run summary
      # is where the conformance burn-down is published). Exits non-zero iff any
      # SDK is `fail`; a `pending` SDK never fails the run (FR-004).
      - name: Build conformance report
        id: report
        run: node tools/test-harness-live-contract/scripts/live-coverage-report.mjs live-results dagger/sdk-manifest.json
