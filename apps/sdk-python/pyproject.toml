[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "confeature-client"
version = "0.1.0"
description = "Python SDK for Confeature — drop-in compatible with ConfigCat's configcat-client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MakerLabs" }]
keywords = ["feature-flag", "feature-flags", "configcat", "confeature", "configuration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "platformdirs>=4"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "mypy>=1.11",
  "ruff>=0.6",
  # Spec 072 US3 — test-scope import for the API-surface conformance test.
  # NOT a runtime dependency; gated to the dev extra so production wheels
  # never pull it in.
  "configcat-client>=10.0,<11.0",
]

[project.urls]
Homepage = "https://confeature.io"
Repository = "https://github.com/confeature/sdks"
Issues = "https://github.com/confeature/sdks/issues"

[tool.confeature]
owner = "sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/confeature_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/confeature_client/py.typed" = "confeature_client/py.typed"

[tool.hatch.build.targets.sdist]
include = ["src/confeature_client", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "F", # pyflakes
  "W", # pycodestyle warnings
  "I", # isort
  "B", # flake8-bugbear
  "UP", # pyupgrade
  "C4", # flake8-comprehensions
  "PL", # pylint
  "RUF", # ruff-specific
]
ignore = [
  "PLR0913", # too many arguments (SDK client has legitimately many opts)
  "PLR2004", # magic value used in comparison (corpus + tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLR0915", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `-m "not slow"` skips the wheel-build integration test by default
# (per research §R16). CI + `python:ready` opt back in via `-m slow`
# or `--run-slow` (run all). Local devs hit the fast path automatically.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"'); used for the wheel-build integration test.",
]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*"]
