org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Auto-provision a JDK 21 toolchain if the host JDK is incompatible
# (Kotlin 2.0.21 does not support JDK 25+ as of writing). The Gradle
# toolchain resolver downloads Temurin 21 on first build when needed.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
# Kotlin Multiplatform native cache — speeds up iOS native builds on
# the macOS runner without affecting Linux / Windows runners.
kotlin.native.cacheKind=none
kotlin.code.style=official
# Suppress KMP "experimental" warning for the JS/IR target which is
# stable as of Kotlin 1.9+ but still flagged by the multiplatform plugin.
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.stability.nowarn=true
